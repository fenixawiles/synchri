function commitUrl(remote, sha) {
  // Only GitHub remotes become links; anything else stays plain text.
  if (!remote || !sha) return null;
  let cleaned = String(remote).trim().replace(/\.git$/, "").replace(/\/+$/, "");
  const githubOrigin = "https" + "://github.com/";
  if (cleaned.startsWith("git@github.com:")) {
    cleaned = githubOrigin + cleaned.slice("git@github.com:".length);
  } else if (cleaned.startsWith("ssh" + "://git@github.com/")) {
    cleaned = githubOrigin + cleaned.slice(("ssh" + "://git@github.com/").length);
  }
  if (!/^https:\/\/github\.com\/[^/]+\/[^/]+$/.test(cleaned)) return null;
  return `${cleaned}/commit/${sha}`;
}

function composerHint(d) {
  const actor = d.current_actor;
  if (actor && actor !== "human") return `${actor} has the floor — your message interrupts`;
  if (actor === "human") return "The agents are waiting on your reply";
  return "Your message reaches the agent leading the work";
}

function agentAlerts(d) {
  const states = d.participant_states || {};
  const blocks = Object.entries(states).map(([name, runtime]) => {
    if (!runtime || !runtime.state) return "";
    if (["failed", "timed_out", "dropped"].includes(runtime.state)) {
      const label = runtime.state === "dropped" ? "stopped responding and was dropped"
        : (runtime.state === "timed_out" ? "timed out" : "failed");
      return `<div class="agent-alert"><div><b>${esc(name)}</b> ${esc(label)}${runtime.detail ? ` — ${esc(runtime.detail)}` : ""}.</div>
        <button data-restart="${esc(name)}">Restart ${esc(name)}</button></div>`;
    }
    if (runtime.state === "active" && runtime.detail && runtime.detail.includes("refusing")) {
      return `<div class="agent-alert warn"><div><b>${esc(name)}</b> ${esc(runtime.detail)}.</div>
        <button class="ghost" data-restart="${esc(name)}">Restart ${esc(name)}</button></div>`;
    }
    return "";
  }).filter(Boolean);
  return blocks.length ? `<div class="agent-alerts">${blocks.join("")}</div>` : "";
}

async function runSessionControl(button, action, extra = {}) {
  const label = button.textContent;
  button.disabled = true;
  button.textContent = action === "complete" ? "Verifying…" : `${action[0].toUpperCase()+action.slice(1)}…`;
  try {
    S.dash = await api("control", {session:S.session, action, ...extra});
    renderSession();
  } catch (error) {
    button.disabled = false;
    button.textContent = label;
    throw error;
  }
}

function showForceCompleteDialog(button) {
  const blockers = S.dash?.gates?.summary?.blockers || [];
  document.getElementById("force-complete-dialog")?.remove();
  const dialog = $(`<div class="dialog stack" id="force-complete-dialog" role="dialog" aria-modal="true">
    <button class="detail-close" aria-label="Close">×</button>
    <div class="kicker">COMPLETE SESSION</div>
    <h2>${blockers.length === 1 ? "One acceptance gate is" : blockers.length + " acceptance gates are"} not satisfied</h2>
    <p class="muted small" style="margin:.2rem 0 0">Completing now waives what remains. Each waiver is recorded on its gate and in the final changelog, so the delivery record stays honest.</p>
    <div class="note warn small" style="margin:.4rem 0 0"><div class="mono">${blockers.map(esc).join("<br>")}</div></div>
    <div class="row"><button class="primary" data-force>Complete anyway — waive ${blockers.length === 1 ? "the gate" : blockers.length + " gates"}</button><button data-review>Review gates</button><button class="ghost" data-close>Cancel</button></div>
  </div>`);
  document.body.append(dialog);
  const close = () => dialog.remove();
  dialog.querySelector(".detail-close").onclick = close;
  dialog.querySelector("[data-close]").onclick = close;
  dialog.querySelector("[data-review]").onclick = () => { close(); S.tab = "gates"; renderSession(); };
  dialog.querySelector("[data-force]").onclick = guard(async () => {
    close();
    await runSessionControl(button, "complete", {force: true});
  });
}

function refreshSessionChrome() {
  const d = S.dash, s = d.session, g = d.gates.summary;
  const current = d.current_actor || (s.status === "active" ? "Waiting for the next turn" : s.status.replace("_", " "));
  const activeNotes = new Set((d.activities || []).map(note => note.name));
  const currentEl = document.getElementById("rail-current");
  if (currentEl) currentEl.textContent = current;
  const dot = document.getElementById("rail-current-dot");
  if (dot) dot.classList.toggle("live", s.status === "active");
  const gateText = document.getElementById("rail-gates");
  if (gateText) gateText.textContent = `${g.satisfied}/${g.required}`;
  const gateBar = document.getElementById("rail-gates-bar");
  if (gateBar) gateBar.style.width = `${g.required ? Math.round((g.satisfied / g.required) * 100) : 0}%`;
  const runtimeStates = d.participant_states || {};
  document.querySelectorAll(".team-line[data-member]").forEach(row => {
    const name = row.dataset.member;
    const active = name === d.current_actor;
    const runtime = runtimeStates[name] || {};
    const trouble = ["failed", "timed_out", "dropped"].includes(runtime.state);
    const state = row.querySelector("[data-team-state]");
    if (state) {
      state.textContent = trouble ? runtime.state.replace("_", " ")
        : (activeNotes.has(name) ? "working" : (active ? "on point" : "waiting"));
      state.style.color = trouble ? "var(--bad)" : "";
    }
    const presence = row.querySelector(".presence i");
    if (presence) {
      presence.classList.toggle("live", active && !trouble);
      presence.classList.toggle("warn", trouble && runtime.state !== "dropped");
      presence.classList.toggle("bad", runtime.state === "dropped");
    }
    if (runtime.detail) row.title = runtime.detail; else row.removeAttribute("title");
  });
}

async function paint(tab, el) {
  const q = "?session=" + encodeURIComponent(S.session);
  const d = S.dash;
  if (tab === "conversation") {
    const previousInput = el.querySelector("#mm");
    const draftValue = previousInput?.value || "";
    const draftFocused = document.activeElement === previousInput;
    const caretStart = previousInput?.selectionStart ?? draftValue.length;
    const caretEnd = previousInput?.selectionEnd ?? draftValue.length;
    const r = await api("conversation" + q);
    const liveWork = renderLiveFeed(r.live_events || [], d);
    const messages = r.messages.length ? r.messages.map(m => {
      const speaker = m.metadata?.source === "session_activation" ? "SYNCHRI"
        : (m.sender === "human" ? "YOU" : String(m.sender).toUpperCase());
      const responseState = m.message_type === "response"
        ? `${String(m.response_status || "complete").toUpperCase()} RESPONSE` : "";
      const kind = speaker === "SYNCHRI" ? "system" : (speaker === "YOU" ? "you" : "");
      const recipient = m.target && speaker !== "SYNCHRI"
        ? `→ ${String(m.target).toUpperCase()}` : "";
      const approvalText = m.metadata?.approval_request || "This agent needs your decision before it can continue.";
      const approvalCapability = m.metadata?.approval_capability || "";
      const decision = m.target === "human" && m.response_status === "blocked" && speaker !== "YOU"
        ? `<div class="decision-actions"><span class="small muted">${esc(approvalText)}</span><div><button data-decision="approve" data-agent="${esc(m.sender)}" data-capability="${esc(approvalCapability)}" data-detail="${esc(approvalText)}">Approve</button><button data-decision="deny" data-agent="${esc(m.sender)}" data-capability="${esc(approvalCapability)}" data-detail="${esc(approvalText)}">Deny</button></div></div>` : "";
      const hue = kind ? "" : ` ${hueFor(m.sender)}`;
      return `<div class="msg ${kind}"><div class="msg-head"><span class="who${hue}">${esc(speaker)}</span>${recipient ? `<span class="to">${esc(recipient)}</span>` : ""}<span class="when mono">${esc(fmtClock(m.timestamp))}</span></div>
        <div class="body">${rich(m.content)}</div>
        ${responseState ? `<div class="response-state">${esc(responseState)}</div>` : ""}
        ${m.handoff_target ? `<div class="handoff">HANDOFF → ${esc(m.handoff_target)}</div>` : ""}${decision}</div>`;
    }).join("") : `<span class="muted small">Nothing said yet.</span>`;
    el.innerHTML = `<div class="message-list">${messages}</div>` + liveWork + agentAlerts(d) + timeboxNudge(d);
    const list = el.querySelector(".message-list");
    requestAnimationFrame(() => list.scrollTo({ top: list.scrollHeight, behavior: "smooth" }));
    el.querySelectorAll(".feed-lines").forEach(lines => { lines.scrollTop = lines.scrollHeight; });
    el.querySelectorAll("details.file-card[data-path]").forEach(card => {
      card.addEventListener("toggle", () => {
        const key = card.dataset.agent + ":" + card.dataset.path;
        if (card.open) { S.openFileCards.add(key); loadFileCard(card); }
        else S.openFileCards.delete(key);
      });
      if (card.open) loadFileCard(card);
    });
    el.querySelectorAll("[data-restart]").forEach(button => button.onclick = guard(async () => {
      button.disabled = true;
      button.textContent = "Restarting…";
      S.dash = await api("control", {session: S.session, action: "restart_agent",
                                     participant: button.dataset.restart});
      renderSession();
    }));
    if (d.session.status !== "active") {
      const closed = d.session.status === "complete"
        ? "Session complete — the final changelog is available in the rail."
        : `Session ${d.session.status.replace("_", " ")} — messaging is closed.`;
      el.append($(`<div class="chat-compose muted small">${esc(closed)}</div>`));
      return;
    }
    const send = $(`<div class="chat-compose"><div class="composer">
      <textarea id="mm" rows="1" placeholder="Message the agents — Enter to send, Shift+Enter for a new line" autocomplete="off"></textarea>
      <div class="composer-bar"><span class="composer-hint small faint">${esc(composerHint(d))}</span>
        <button class="primary composer-send" id="ms" aria-label="Send" title="Send">↑</button></div>
    </div></div>`);
    el.append(send);
    const input = send.querySelector("#mm");
    const grow = () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    };
    input.value = draftValue;
    grow();
    if (draftFocused) {
      input.focus();
      input.setSelectionRange(caretStart, caretEnd);
    }
    input.addEventListener("input", grow);
    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        send.querySelector("#ms").click();
      }
    });
    send.querySelector("#ms").onclick = guard(async () => {
      const v = input.value.trim(); if (!v) return;
      input.value = "";
      grow();
      await api("message", { session: S.session, content: v, interrupt: true });
      paint("conversation", el);
    });
    el.querySelectorAll("[data-decision]").forEach(button => button.onclick = guard(async () => {
      const approved = button.dataset.decision === "approve";
      const target = button.dataset.agent;
      await api("approval", {
        session: S.session,
        target,
        approved,
        capability: button.dataset.capability,
        detail: button.dataset.detail,
      });
      paint("conversation", el);
    }));
    el.querySelectorAll("[data-extend]").forEach(button => button.onclick = guard(async () => {
      await api("control", {session:S.session, action:"extend_deadline", duration:button.dataset.extend});
      S.dash = await api("dashboard" + q); renderSession();
    }));
    el.querySelector("[data-dismiss-timebox]")?.addEventListener("click", () => {
      S.dismissedTimebox = d.session.session_id; paint("conversation", el);
    });
  } else if (tab === "changelog") {
    const r = await api("changelog" + q);
    el.innerHTML = `<div class="rich">${rich(r.markdown)}</div>`;
  } else if (tab === "gates") {
    const r = await api("gates" + q);
    const editable = !["complete", "stopped", "failed", "timed_out"].includes(d.session.status);
    el.innerHTML = r.gates.length ? `<div class="between"><div><b>${r.summary.satisfied}/${r.summary.required} verified</b>
      <div class="small muted">Agents report evidence here as they work. You can correct or override any gate.</div></div></div>
      <div class="stack" style="margin-top:1rem">${r.gates.map(x=>`<div class="card gate-card" data-gate="${esc(x.gate_id)}">
        <div class="between"><div><b class="mono">${esc(x.gate_id)}</b><div class="small" style="margin-top:.18rem">${esc(x.description)}</div></div>
          <select class="gate-status" ${editable?"":"disabled"}>${["pending","in_progress","pass","fail","unverified","waived"].map(status => `<option value="${status}" ${x.status===status?"selected":""}>${status.replace("_"," ")}</option>`).join("")}</select></div>
        <div class="small muted" style="margin-top:.65rem">${esc([...x.evidence,...x.tests,...x.commits].join(" · ") || "No evidence recorded yet.")}</div>
        <div class="small muted" style="margin-top:.25rem">Builder: ${esc(x.builder_assessment || "not recorded")} · Reviewer: ${esc(x.reviewer_assessment || "not recorded")}</div>
        ${editable?`<details style="margin-top:.65rem"><summary class="small muted" style="cursor:pointer">Add evidence or override</summary><div class="grid" style="margin-top:.55rem"><input class="gate-evidence mono" placeholder="Evidence, test, or commit"><input class="gate-builder" placeholder="Builder assessment"><input class="gate-reviewer" placeholder="Reviewer assessment"><button class="primary gate-save">Save gate</button></div></details>`:""}
        ${x.blocker?`<div class="small" style="color:var(--warn);margin-top:.55rem">${esc(x.blocker)}</div>`:""}</div>`).join("")}</div>
      <div class="small muted" style="margin-top:.9rem">A gate passes only with evidence and both sign-offs. ${esc(r.summary.blockers.join("; ")||"")}</div>${gateAddForm(editable)}`
      : `<span class="muted">No gates defined yet.</span>${gateAddForm(editable)}`;
    document.getElementById("gate-new-save")?.addEventListener("click", guard(async () => {
      const gateId = document.getElementById("gate-new-id").value.trim();
      const description = document.getElementById("gate-new-description").value.trim();
      await api("gate", {session:S.session, add:{gate_id:gateId, description}});
      S.dash = await api("dashboard" + q); await paint("gates", el);
      confirmNotice(`Added ${gateId.toUpperCase()}.`);
    }));
    if (editable) el.querySelectorAll(".gate-card").forEach(card => {
      const id = card.dataset.gate;
      card.querySelector(".gate-status").onchange = guard(async event => {
        await api("gate", {session:S.session, gate_id:id, status:event.target.value, actor:"human"});
        S.dash = await api("dashboard" + q); await paint("gates", el);
      });
      const save = card.querySelector(".gate-save");
      if (save) save.onclick = guard(async () => {
        const evidence = card.querySelector(".gate-evidence").value.trim();
        const builder = card.querySelector(".gate-builder").value.trim();
        const reviewer = card.querySelector(".gate-reviewer").value.trim();
        const payload = {session:S.session, gate_id:id, actor:"human"};
        if (evidence) payload.evidence = [evidence];
        if (builder) payload.builder_assessment = builder;
        if (reviewer) payload.reviewer_assessment = reviewer;
        await api("gate", payload);
        S.dash = await api("dashboard" + q); await paint("gates", el); confirmNotice(`Updated ${id}.`);
      });
    });
  } else if (tab === "tests") {
    const t = d.tests;
    el.innerHTML = `<div class="between"><div>
      ${t ? `<div class="stat-num">${t.passed} <span class="muted" style="font-size:13px">passed</span>${t.failed?`&ensp;<span style="color:var(--bad)">${t.failed}</span> <span class="muted" style="font-size:13px">failed</span>`:""}</div>
             <div class="small muted mono" style="margin-top:.3rem">${esc(t.command)} · exit ${t.exit_code}</div>`
          : `<span class="muted">Not run yet.</span>`}
      </div><button class="primary" id="rt">Run tests</button></div>
      ${t && t.output_tail ? `<pre style="margin-top:1rem;max-height:22rem;overflow:auto">${esc(t.output_tail)}</pre>` : ""}
      ${!d.test_command ? `<div class="note warn small" style="margin-top:1rem">No test command
        detected. Set one to collect evidence.</div>` : ""}`;
    el.querySelector("#rt").onclick = guard(async () => {
      el.innerHTML = `<span class="muted">Running…</span>`;
      await api("tests/run", { session: S.session });
      S.dash = await api("dashboard" + q); renderSession();
    });
  } else if (tab === "changes") {
    const r = await api("changes/files" + q);
    const files = r.files || [];
    const adds = files.reduce((total, f) => total + (f.insertions || 0), 0);
    const dels = files.reduce((total, f) => total + (f.deletions || 0), 0);
    el.innerHTML = `<div class="small muted mono">${files.length} file(s) ·
      <span style="color:var(--accent)">+${adds}</span> <span style="color:var(--bad)">−${dels}</span></div>` +
      (files.length ? `<div class="stack" style="margin-top:.8rem">${files.map((f, index) => `
        <details class="file-card"${index < 3 ? " open" : ""}>
          <summary><span class="mono file-card-path">${esc(f.path)}</span>
            ${f.uncommitted ? `<span class="pill warn">uncommitted</span>` : ""}
            <span class="file-card-stats small faint">${esc(f.status)} · +${f.insertions} −${f.deletions}</span></summary>
          <pre class="diff file-card-diff">${f.diff ? renderDiff(f.diff) : "No content changes."}</pre>
        </details>`).join("")}</div>` : `<span class="muted" style="display:block;margin-top:.8rem">No changes yet.</span>`);
  } else if (tab === "commits") {
    const c = d.changes;
    const remote = d.session.repository?.remote;
    el.innerHTML = c.recent.length ? `<table><thead><tr><th>Commit</th><th>Subject</th><th>Author</th><th>Date</th>
      </tr></thead><tbody>${c.recent.map(x => {
        const url = commitUrl(remote, x.full_sha || x.sha);
        const id = url
          ? `<a href="${esc(url)}" class="mono" data-commit-url="${esc(url)}" title="Open this commit on GitHub">${esc(x.sha)}</a>`
          : `<span class="mono">${esc(x.sha)}</span>`;
        return `<tr><td>${id}</td><td>${esc(x.subject)}</td><td class="small muted">${esc(x.author)}</td>
          <td class="small muted mono">${esc(String(x.date || "").slice(0, 16))}</td></tr>`;
      }).join("")}
      </tbody></table>` : `<span class="muted">No commits on this branch yet.</span>`;
    el.querySelectorAll("[data-commit-url]").forEach(link => link.onclick = event => {
      event.preventDefault();
      guard(() => openGitHub(link.dataset.commitUrl))();
    });
  } else if (tab === "worktree") {
    const w = d.session.worktree;
    el.innerHTML = w ? `<table><tbody>
      <tr><th>Name</th><td class="mono">${esc(w.name)}</td></tr>
      <tr><th>Branch</th><td class="mono">${esc(w.branch)}</td></tr>
      <tr><th>Base</th><td class="mono">${esc(w.base_branch)}</td></tr>
      <tr><th>Path</th><td class="mono">${esc(w.path)}</td></tr>
      <tr><th>Primary repo</th><td class="mono">${esc(w.repo_root)}</td></tr>
      <tr><th>Present</th><td>${d.worktree_present?"yes":"<b>MISSING</b>"}</td></tr></tbody></table>
      <div class="note small" style="margin-top:1rem">Every change the agents make happens here.
      Your primary working copy is never the target.</div>` : `<span class="muted">No worktree.</span>`;
  } else if (tab === "memory") {
    const r = await api("memory" + q);
    el.innerHTML = `<pre style="max-height:30rem;overflow:auto">${esc(r.markdown||"(empty)")}</pre>`;
  } else if (tab === "raw") {
    const r = await api("events" + q);
    el.innerHTML = `<pre style="max-height:30rem;overflow:auto">${esc(r.events.map(e =>
      `[${e.seq}] ${e.created_at} ${e.event_type} ${e.actor_name||"-"} ${JSON.stringify(e.payload)}`
      ).join("\n") || "(no events)")}</pre>`;
  } else if (tab === "contract") {
    const r = await api("contract" + q);
    const a = r.acknowledgments;
    el.innerHTML = `<div class="between"><div><b>Revision ${r.revision}</b>
      <span class="small muted mono"> ${esc(r.short_digest)}</span></div></div>
      <table style="margin-top:.8rem"><tbody>${a.expected.map(p => {
        const c = a.conflicts.find(x=>x.participant===p);
        const ok = a.accepted.includes(p);
        return `<tr><td><b>${esc(p)}</b></td><td>${ok?`<span class="pill">UNDERSTOOD</span>`
          : c?`<span class="pill bad">CONFLICT</span> <span class="small">${esc(c.reason)}</span>`
          : `<span class="pill dim">waiting</span>`}</td></tr>`;}).join("")}</tbody></table>
      ${a.all_accepted && d.session.status==="awaiting_ack"
        ? `<button class="primary" id="act" style="margin-top:1rem">Activate session</button>` : ""}
      <pre style="margin-top:1rem;max-height:26rem;overflow:auto">${esc(r.core_text)}</pre>`;
    const act = el.querySelector("#act");
    if (act) act.onclick = guard(async () => {
      await api("activate", { session: S.session });
      S.dash = await api("dashboard" + q); renderSession();
    });
  }
}

document.getElementById("nav-home").onclick = guard(home);
document.getElementById("nav-new").onclick = guard(quickStart);
/* Share: hand people the website link plus the one thing they need to know —
   sign in with GitHub and Synchri works with any repository. Clipboard only;
   the page itself still makes no external request. */
const SYNCHRI_SITE = "https" + "://synchri.com";
const shareMessage = () =>
  `Synchri — autonomous agent teams for your repositories. Get it at ${SYNCHRI_SITE}. Sign in with GitHub to use it with any repo.`;
document.getElementById("share-copy").onclick = guard(async () => {
  await copyText(shareMessage());
  document.getElementById("share-menu")?.removeAttribute("open");
  confirmNotice("Invite copied — the synchri.com link plus GitHub sign-in.", "Copied");
});
const nativeShare = document.getElementById("share-native");
if (navigator.share) {
  nativeShare.classList.remove("hide");
  nativeShare.onclick = guard(async () => {
    try {
      await navigator.share({title: "Synchri", text: shareMessage(), url: SYNCHRI_SITE});
    } catch (error) { /* dismissing the native sheet is not an error */ }
    document.getElementById("share-menu")?.removeAttribute("open");
  });
}
renderThemeMenu();
document.addEventListener("click", (event) => {
  document.querySelectorAll("details.menu[open]").forEach(menu => {
    if (!menu.contains(event.target)) menu.removeAttribute("open");
  });
});
guard(home)();
</script>
