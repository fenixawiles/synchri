<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synchri</title>
<script>
/* Apply the saved theme before first paint so the choice never flashes. */
try {
  const savedTheme = localStorage.getItem("synchri-theme");
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
} catch (e) { /* storage may be unavailable; the System theme still applies */ }
</script>
<style>
/* ------------------------------------------------------------------ tokens
   Every theme-dependent value is a token. Bare :root is Terminal (dark).
   With no explicit choice, the OS light preference switches to Daylight.
   An explicit data-theme (from the header picker, kept in localStorage)
   always wins. Each block also sets color-scheme for native controls. */
:root{
  color-scheme:dark;
  --bg:#0b0d10; --panel:#12151a; --panel2:#161a20; --raise:#1b2027;
  --line:#222933; --line2:#2e3844;
  --ink:#d7dee9; --dim:#8b95a6; --faint:#5f6a7a;
  --accent:#2fd287; --accent-ink:#052b1a;
  --accent-soft:rgba(47,210,135,.09); --accent-line:rgba(47,210,135,.38);
  --warn:#e0b34c; --warn-ink:#231a05; --warn-soft:rgba(224,179,76,.1); --warn-line:rgba(224,179,76,.38);
  --bad:#f2756b; --bad-soft:rgba(242,117,107,.1); --bad-line:rgba(242,117,107,.38);
  --info:#5fb2e6;
  --sel:rgba(47,210,135,.22);
  --shadow:0 16px 40px rgba(3,6,10,.5);
  --a0:#62b8dd; --a1:#a99bea; --a2:#d9ab5e; --a3:#5ec9a8; --a4:#dd8fb4;
  --diff-add:#7ee0a8; --diff-add-bg:rgba(47,210,135,.13);
  --diff-del:#f5928a; --diff-del-bg:rgba(242,117,107,.13);
  --gh-bg:#eef1f4; --gh-ink:#1f2328; --gh-line:#eef1f4;
  --radius:8px; --radius-s:5px;
  --sans:"SF Pro Text","Avenir Next",Inter,ui-sans-serif,system-ui,sans-serif;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
/* Daylight — light instrument panel. Defined twice on purpose: once for the
   System default (OS light, no explicit choice) and once as an explicit
   theme. Keep the two blocks identical. */
@media (prefers-color-scheme:light){:root:not([data-theme]){
  color-scheme:light;
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#f6f7f9; --raise:#ffffff;
  --line:#e3e6eb; --line2:#cad0d9;
  --ink:#1b222c; --dim:#5c6675; --faint:#8d96a5;
  --accent:#0e8f60; --accent-ink:#ffffff;
  --accent-soft:rgba(14,143,96,.08); --accent-line:rgba(14,143,96,.35);
  --warn:#96690a; --warn-ink:#ffffff; --warn-soft:rgba(150,105,10,.09); --warn-line:rgba(150,105,10,.32);
  --bad:#c73f36; --bad-soft:rgba(199,63,54,.08); --bad-line:rgba(199,63,54,.32);
  --info:#0b6bbd;
  --sel:rgba(14,143,96,.18);
  --shadow:0 14px 34px rgba(23,30,40,.14);
  --a0:#0973a5; --a1:#6d52c9; --a2:#99660c; --a3:#0c7d5c; --a4:#b13d78;
  --diff-add:#0b6b45; --diff-add-bg:rgba(14,143,96,.1);
  --diff-del:#a8322a; --diff-del-bg:rgba(199,63,54,.1);
  --gh-bg:#24292f; --gh-ink:#ffffff; --gh-line:#24292f;
}}
:root[data-theme="daylight"]{
  color-scheme:light;
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#f6f7f9; --raise:#ffffff;
  --line:#e3e6eb; --line2:#cad0d9;
  --ink:#1b222c; --dim:#5c6675; --faint:#8d96a5;
  --accent:#0e8f60; --accent-ink:#ffffff;
  --accent-soft:rgba(14,143,96,.08); --accent-line:rgba(14,143,96,.35);
  --warn:#96690a; --warn-ink:#ffffff; --warn-soft:rgba(150,105,10,.09); --warn-line:rgba(150,105,10,.32);
  --bad:#c73f36; --bad-soft:rgba(199,63,54,.08); --bad-line:rgba(199,63,54,.32);
  --info:#0b6bbd;
  --sel:rgba(14,143,96,.18);
  --shadow:0 14px 34px rgba(23,30,40,.14);
  --a0:#0973a5; --a1:#6d52c9; --a2:#99660c; --a3:#0c7d5c; --a4:#b13d78;
  --diff-add:#0b6b45; --diff-add-bg:rgba(14,143,96,.1);
  --diff-del:#a8322a; --diff-del-bg:rgba(199,63,54,.1);
  --gh-bg:#24292f; --gh-ink:#ffffff; --gh-line:#24292f;
}
/* Midnight — dark slate-blue with a cool accent. */
:root[data-theme="midnight"]{
  color-scheme:dark;
  --bg:#0a0e17; --panel:#101625; --panel2:#141b2c; --raise:#182136;
  --line:#1e2a44; --line2:#2a3a5c;
  --ink:#d9e1f2; --dim:#8b98b8; --faint:#5d6a8a;
  --accent:#6ea8ff; --accent-ink:#061530;
  --accent-soft:rgba(110,168,255,.1); --accent-line:rgba(110,168,255,.4);
  --warn:#e3b341; --warn-ink:#231a05; --warn-soft:rgba(227,179,65,.1); --warn-line:rgba(227,179,65,.38);
  --bad:#f47768; --bad-soft:rgba(244,119,104,.1); --bad-line:rgba(244,119,104,.38);
  --info:#59c2ff;
  --sel:rgba(110,168,255,.25);
  --shadow:0 16px 40px rgba(2,5,12,.55);
  --a0:#5fd0c7; --a1:#b39df2; --a2:#e0b076; --a3:#7ddba0; --a4:#e893b9;
  --diff-add:#7ee0a8; --diff-add-bg:rgba(63,185,120,.12);
  --diff-del:#f5928a; --diff-del-bg:rgba(244,119,104,.12);
  --gh-bg:#eef1f4; --gh-ink:#1f2328; --gh-line:#eef1f4;
}
/* Sage — light warm paper with the original Synchri green. */
:root[data-theme="sage"]{
  color-scheme:light;
  --bg:#faf9f7; --panel:#ffffff; --panel2:#f5f4f1; --raise:#ffffff;
  --line:#e8e5df; --line2:#d3cfc6;
  --ink:#201f1c; --dim:#6b6862; --faint:#98948b;
  --accent:#2f6f4f; --accent-ink:#ffffff;
  --accent-soft:rgba(47,111,79,.08); --accent-line:rgba(47,111,79,.35);
  --warn:#8a5a00; --warn-ink:#ffffff; --warn-soft:rgba(138,90,0,.09); --warn-line:rgba(138,90,0,.32);
  --bad:#a3352a; --bad-soft:rgba(163,53,42,.08); --bad-line:rgba(163,53,42,.32);
  --info:#22668a;
  --sel:rgba(47,111,79,.18);
  --shadow:0 14px 34px rgba(35,30,20,.14);
  --a0:#1c6e8f; --a1:#5f51a8; --a2:#8a5a00; --a3:#587c3f; --a4:#9c4368;
  --diff-add:#22623f; --diff-add-bg:rgba(47,111,79,.1);
  --diff-del:#93362c; --diff-del-bg:rgba(163,53,42,.1);
  --gh-bg:#24292f; --gh-ink:#ffffff; --gh-line:#24292f;
}

/* ------------------------------------------------------------------- base */
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
::selection{background:var(--sel)}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased}
h1{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em}
h2{margin:0;font-size:14.5px;font-weight:650;letter-spacing:-.005em}
h3{margin:0;font-size:13px;font-weight:600}
p{margin:.45rem 0}
a{color:var(--accent);text-decoration-thickness:1px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}

button{font:500 12.5px/1.35 var(--sans);cursor:pointer;border-radius:var(--radius-s);
  border:1px solid var(--line2);background:var(--panel2);color:var(--ink);padding:.42rem .8rem;
  transition:background-color .12s ease,border-color .12s ease,color .12s ease}
button:hover{background:var(--raise);border-color:var(--faint)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(0,0,0,.18)}
button.primary:hover{filter:brightness(1.08)}
button.primary:disabled{box-shadow:none}
button.ghost{background:transparent;border-color:transparent;color:var(--dim)}
button.ghost:hover{background:var(--panel2);color:var(--ink)}

input,textarea,select{font:13px/1.45 var(--sans);width:100%;padding:.5rem .65rem;
  border-radius:var(--radius-s);border:1px solid var(--line2);background:var(--bg);color:var(--ink)}
input.mono{font-family:var(--mono);font-size:12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:12rem;resize:vertical}
label>b{display:block;margin-bottom:.3rem;font-size:12px;font-weight:600}
::placeholder{color:var(--faint)}

code,pre,.mono{font-family:var(--mono);font-size:12px}
pre{overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-s);padding:.8rem .9rem;margin:0;line-height:1.55}
.muted{color:var(--dim)}
.faint{color:var(--faint)}
.small{font-size:12px}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.stack>*+*{margin-top:.8rem}
.grid{display:grid;gap:.6rem}
.hide{display:none !important}
.kicker{font:700 10.5px/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1rem}

.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.13rem .42rem;border-radius:4px;
  font:700 10px/1.4 var(--mono);letter-spacing:.05em;text-transform:uppercase;
  background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent)}
.pill.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.pill.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.pill.dim{background:var(--panel2);border-color:var(--line2);color:var(--dim)}

.led{width:7px;height:7px;border-radius:50%;background:var(--line2);display:inline-block;flex:none}
.led.live{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 0 8px var(--accent);
  animation:pulse 2.2s ease-in-out infinite}
.led.warn{background:var(--warn)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

.note{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--accent-soft);
  padding:.6rem .8rem;border-radius:var(--radius-s);font-size:12.5px}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-left-color:var(--bad);background:var(--bad-soft)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 10px/1.4 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}

/* ----------------------------------------------------------------- header
   Left: identity + navigation. Right: status and account. One primary CTA. */
header{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10}
header .wrap{max-width:none;margin:0;padding:0 1rem;height:46px;display:flex;
  justify-content:space-between;align-items:center}
.brand{font:700 13px var(--mono);letter-spacing:-.01em;display:inline-flex;align-items:center;gap:.1rem;
  margin-right:.9rem}
.brand i{font-style:normal;color:var(--accent);animation:cursorblink 1.6s steps(2) infinite}
@keyframes cursorblink{50%{opacity:0}}
#ctx{font:11px var(--mono);color:var(--faint)}
header .row{gap:.3rem;flex-wrap:nowrap}
header button{font-size:12px;padding:.34rem .6rem;white-space:nowrap}
header nav{display:inline-flex;gap:.15rem}

/* shared dropdown menu (workflow ⋯, theme picker) */
details.menu{position:relative}
details.menu>summary{list-style:none;cursor:pointer;border:1px solid transparent;
  border-radius:var(--radius-s);padding:.34rem .6rem;line-height:1.35;color:var(--dim);font-size:12px;
  display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}
details.menu>summary:hover{background:var(--panel2);color:var(--ink)}
details.menu>summary::-webkit-details-marker{display:none}
details.menu>div{position:absolute;right:0;top:calc(100% + .35rem);z-index:40;min-width:11rem;
  padding:.3rem;background:var(--raise);border:1px solid var(--line2);border-radius:var(--radius-s);
  box-shadow:var(--shadow)}
details.menu>div>button{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;
  border:0;background:none;padding:.42rem .5rem;font-size:12.5px;border-radius:4px;box-shadow:none}
details.menu>div>button:hover{background:var(--panel2)}
.swatch{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid var(--line2)}
.theme-check{margin-left:auto;color:var(--accent);font-weight:700}
.share-panel{width:17.5rem;padding:.55rem .6rem}
.share-link{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-s);
  padding:.45rem .6rem;font:600 12.5px var(--mono);color:var(--accent);text-align:center;letter-spacing:.02em}

/* branded GitHub button */
.btn-github{display:inline-flex;align-items:center;gap:.45rem;background:var(--gh-bg);
  color:var(--gh-ink);border:1px solid var(--gh-line);font-weight:600}
.btn-github:hover{background:var(--gh-bg);border-color:var(--gh-line);filter:brightness(.94)}
.btn-github svg{width:15px;height:15px;flex:none;fill:currentColor}

/* ------------------------------------------------------------------ pages */
.wrap{max-width:74rem;margin:0 auto;padding:1.6rem 1.5rem 4rem}
.wrap.session-app{max-width:none;margin:0;padding:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:1.2rem}
.page-head .row button{white-space:nowrap}
.page-head .sub{font-size:12px;color:var(--dim);margin-top:.35rem;max-width:44rem}
.section-head{display:flex;align-items:center;gap:.7rem;margin:1.8rem 0 .6rem}
.section-head::after{content:"";flex:1;height:1px;background:var(--line)}
.hero{max-width:38rem;margin:9vh auto 0;padding:1.5rem 1.6rem}

/* home: session rows */
.sess-list{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel)}
.sess-row{display:flex;justify-content:space-between;gap:1rem;padding:.7rem .95rem;
  border-bottom:1px solid var(--line);align-items:center}
.sess-row:last-child{border-bottom:none}
.sess-row:hover{background:var(--panel2)}
.sess-main{min-width:0}
.sess-title{display:flex;gap:.55rem;align-items:center;font-size:13px}
.sess-meta{font:11.5px var(--mono);color:var(--dim);margin-top:.3rem;display:flex;gap:1rem;flex-wrap:wrap}
.sess-brief{font-size:12px;color:var(--faint);margin-top:.22rem;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:44rem}
.sess-actions{flex:none;display:flex;gap:.4rem}

/* home: two-column — sessions lead, workflows are a compact defaults panel */
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 18rem;gap:1.4rem;align-items:start}
.wf-panel{padding:.85rem .95rem}
.wf-row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  padding:.6rem 0;border-top:1px solid var(--line)}
.wf-row:first-child{border-top:none}
.wf-row button[data-run]{font-size:11.5px;padding:.3rem .6rem}
.workflow-chain{font:11.5px var(--mono);color:var(--dim);margin-top:.3rem;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.workflow-menu>summary{border:1px solid var(--line2);padding:.28rem .45rem;line-height:1}
.workflow-menu button.danger{color:var(--bad)}
.workflow-editor .perm{padding:.55rem 0}
.profile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.5rem;margin-top:.7rem}

/* new session: numbered field groups */
.fieldset{margin-top:1.5rem}
.fieldset-head{display:flex;gap:.55rem;align-items:baseline;margin-bottom:.55rem}
.fieldset-num{font:700 10.5px var(--mono);color:var(--accent);letter-spacing:.06em}
.fieldset-title{font-weight:650;font-size:13px}
.repo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.5rem}
.sel-repo{display:flex;justify-content:space-between;align-items:center;gap:.8rem;
  border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--radius-s);
  padding:.55rem .75rem;margin-bottom:.55rem}
details.adv{margin-top:.55rem}
details.adv summary{cursor:pointer;color:var(--dim);font-size:12px}
details.adv summary:hover{color:var(--ink)}

.choice{border:1px solid var(--line);border-radius:var(--radius-s);padding:.6rem .75rem;cursor:pointer;
  background:var(--panel);text-align:left;width:100%;display:block;color:var(--ink);font:inherit}
.choice:hover{border-color:var(--line2);background:var(--panel2)}
.choice.on{border-color:var(--accent-line);background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.choice b{display:block;margin-bottom:.15rem;font-size:12.5px}
.choice > span{display:block;margin-top:.1rem}
.repo-row{display:flex;justify-content:space-between;gap:.8rem;align-items:baseline}
.repo-row b{margin-bottom:0}

/* permissions */
.perm{display:flex;justify-content:space-between;align-items:center;gap:1rem;
  padding:.5rem 0;border-bottom:1px solid var(--line)}
.perm:last-child{border-bottom:none}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--radius-s);overflow:hidden;
  flex:none;background:var(--bg)}
.seg button{border:0;border-radius:0;padding:.3rem .6rem;font:600 10.5px var(--mono);
  letter-spacing:.05em;text-transform:uppercase;background:none;color:var(--faint)}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button.on[data-v="ask"],.seg button.on[data-value="ask"]{background:var(--warn);color:var(--warn-ink)}
.seg button.on[data-v="deny"],.seg button.on[data-value="deny"]{background:var(--line2);color:var(--ink)}

/* wizard steps (retired flow — kept styled so nothing ever renders broken) */
.steps{display:flex;flex-wrap:wrap;gap:.25rem;margin-bottom:1.2rem}
.steps button{border:1px solid transparent;background:none;padding:.3rem .55rem;
  border-radius:var(--radius-s);color:var(--faint);font-size:12px}
.steps button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:650}
.steps button.done{color:var(--dim)}
.steps button:disabled{opacity:.4;cursor:not-allowed}
.quick textarea{min-height:9rem}

/* preflight: one panel — status, agent checklist, isolated action bar */
.preflight{max-width:46rem;padding:1.1rem 1.2rem}
.statusline{display:flex;gap:.7rem;align-items:baseline;padding:.55rem .75rem;margin-top:.9rem;
  background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius-s)}
.statusline b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.checklist{margin-top:.9rem;border-top:1px solid var(--line)}
.check-row{display:flex;gap:.9rem;padding:.7rem 0;border-bottom:1px solid var(--line);align-items:flex-start}
.check-row:last-child{border-bottom:none}
.check-status{flex:none;width:8.5rem;padding-top:.1rem}
.check-main{min-width:0;flex:1}
.check-main pre{margin-top:.5rem;white-space:pre-wrap;word-break:break-word;background:var(--bg);max-height:16rem}
.check-main details.adv{margin-top:.35rem}
.actionbar{border-top:1px solid var(--line);margin-top:.2rem;padding-top:.9rem}

/* new session: form + sticky launch plan (the one CTA on the page) */
.quick-grid{display:grid;grid-template-columns:minmax(0,1fr) 19rem;gap:1.5rem;align-items:start;max-width:66rem}
.quick{min-width:0}
.launch-plan{position:sticky;top:calc(46px + 1.2rem);padding:.95rem 1rem}
.plan-rows{margin-top:.5rem}
.plan-row{display:flex;justify-content:space-between;gap:.7rem;font-size:12px;padding:.3rem 0;
  border-bottom:1px solid var(--line)}
.plan-row:last-child{border-bottom:none}
.plan-row span{color:var(--faint);flex:none}
.plan-row b{font-weight:600;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* toast */
.err{position:fixed;right:1.25rem;bottom:1.25rem;max-width:min(26rem,calc(100vw - 2rem));z-index:60;
  animation:toast-in .18s ease}
.err.card{background:var(--raise);border:1px solid var(--line2);border-left-width:3px;
  padding:.8rem .95rem;font-size:12.5px;box-shadow:var(--shadow)}
@keyframes toast-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.success{border-left-color:var(--accent) !important}

/* dialogs (GitHub sign-in, account) */
.dialog{position:fixed;z-index:70;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(30rem,calc(100vw - 2rem));max-height:min(34rem,calc(100vh - 3rem));overflow:auto;
  background:var(--raise);border:1px solid var(--line2);border-radius:var(--radius);

<script>
const TOKEN = "__SYNCHRI_TOKEN__";
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* A deliberately small, safe Markdown renderer. Content is escaped first, so
   messages can be pleasant to scan without turning room text into executable
   HTML. It supports the code and structure agents actually use in reviews. */
/* Truncation-with-expand for oversized blocks. Only applied where overflow is
   certain, so the toggle never appears on content that already fits. */
function clampBlock(html, lines) {
  return `<div class="clamp" style="--clamp:${Number(lines) || 3}"><div class="clamp-body">${html}</div><button class="clamp-more" type="button">Show more</button></div>`;
}
document.addEventListener("click", event => {
  const button = event.target.closest(".clamp-more");
  if (!button) return;
  const clamp = button.closest(".clamp");
  clamp.classList.toggle("open");
  button.textContent = clamp.classList.contains("open") ? "Show less" : "Show more";
});

function rich(value) {
  const blocks = [];
  let text = esc(value);
  text = text.replace(/```([A-Za-z0-9_+-]*)?\n([\s\S]*?)```/g, (_, lang, code) => {
    const label = lang ? ` data-language="${esc(lang)}"` : "";
    const pre = `<pre class="rich-code"${label}><code>${code}</code></pre>`;
    blocks.push(code.split("\n").length > 30 ? clampBlock(pre, 30) : pre);
    return `@@SYNCHRI_BLOCK_${blocks.length - 1}@@`;
  });
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    (_, label, url) => `<a href="${url}" target="_blank" rel="noreferrer">${label}</a>`);
  text = text.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  return `<div class="rich">${text.split("\n").map(line => {
    const block = line.match(/^@@SYNCHRI_BLOCK_(\d+)@@$/);
    if (block) return blocks[Number(block[1])];
    if (/^###\s+/.test(line)) return `<h4>${line.replace(/^###\s+/, "")}</h4>`;
    if (/^##\s+/.test(line)) return `<h3>${line.replace(/^##\s+/, "")}</h3>`;
    if (/^#\s+/.test(line)) return `<h3 class="rich-title">${line.replace(/^#\s+/, "")}</h3>`;
    if (/^>\s?/.test(line)) return `<div class="rich-quote">${line.replace(/^>\s?/, "")}</div>`;
    if (/^\d+[.)]\s+/.test(line)) return `<div class="rich-list">${line.replace(/^(\d+[.)])\s+/, "$1 ")}</div>`;
    if (/^[-*]\s+/.test(line)) return `<div class="rich-list">${line.replace(/^[-*]\s+/, "• ")}</div>`;
    return line ? `<p>${line}</p>` : "";
  }).join("")}</div>`;
}

function richInline(value) {
  let text = esc(value);
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    (_, label, url) => `<a href="${url}" target="_blank" rel="noreferrer">${label}</a>`);
  text = text.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  return text.replace(/\n+/g, " ");
}

/* Presentation helpers: wall-clock stamps, stable per-agent hues, and diff
   line coloring. All three only re-shape data the API already returns. */
const fmtClock = (value) => {
  if (!value) return "";
  const time = new Date(value);
  return isNaN(time) ? "" : time.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
};

function hueFor(name) {
  let hash = 0;
  for (const ch of String(name || "")) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  return "a" + (hash % 5);
}

function renderDiff(diff) {
  return String(diff).split("\n").map(line => {
    const text = esc(line);
    if (line.startsWith("+++") || line.startsWith("---")) return `<span class="d-file">${text}</span>`;
    if (line.startsWith("@@")) return `<span class="d-hunk">${text}</span>`;
    if (line.startsWith("+")) return `<span class="d-add">${text}</span>`;
    if (line.startsWith("-")) return `<span class="d-del">${text}</span>`;
    if (line.startsWith("diff ") || line.startsWith("index ")) return `<span class="d-meta">${text}</span>`;
    return text;
  }).join("\n");
}

async function api(path, body) {
  const res = await fetch("/api/" + path, {
    method: body ? "POST" : "GET",
    headers: { "X-Synchri-Token": TOKEN, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.error) {
    const error = new Error(data.error?.message || res.statusText);
    error.code = data.error?.code;
    error.resolution = data.error?.resolution;
    throw error;
  }
  return data;
}

function flash(error) {
  const message = typeof error === "string" ? error : error?.message;
  const resolution = typeof error === "object" ? error?.resolution : null;
  const box = document.getElementById("err");
  box.className = "err card"; box.style.borderLeftColor = "var(--bad)";
  const action = resolution?.kind === "connect_github" || resolution?.kind === "retry_github_login"
    ? `<button id="error-connect-github" style="margin-top:.65rem">Connect GitHub</button>`
    : resolution?.kind === "github_app_settings"
      ? `<button id="error-open-github-settings" style="margin-top:.65rem">Open GitHub App settings</button>`
      : resolution?.kind === "choose_local_repository" && resolution?.path
        ? `<button id="error-choose-repo" style="margin-top:.65rem">${esc(resolution.label || "Use existing folder")}</button>`
        : resolution?.kind === "choose_repository"
          ? `<button id="error-choose-repo" style="margin-top:.65rem">Choose a repository</button>`
          : error?.code === "awaiting_join" || error?.code === "awaiting_ack"
            ? `<button id="error-open-setup" style="margin-top:.65rem">Open agent setup</button>`
            : error?.code === "gates_unsatisfied"
              ? `<button id="error-open-gates" style="margin-top:.65rem">Review acceptance gates</button>`
              : error?.code === "worktree_missing"
                ? `<button id="error-open-worktree" style="margin-top:.65rem">View workspace details</button>`
                : "";
  box.innerHTML = `<b>Here’s how to continue</b><div class="small" style="margin-top:.3rem">${esc(message)}</div>${action}`;
  box.querySelector("#error-connect-github")?.addEventListener("click", guard(connectGitHub));
  box.querySelector("#error-open-github-settings")?.addEventListener(
    "click", guard(() => openGitHub("https" + "://github.com/settings/apps"))
  );
  box.querySelector("#error-choose-repo")?.addEventListener("click", guard(async () => {
    if (!S.quick) await quickStart();
    if (resolution?.path) S.quick.repo_path = resolution.path;
    renderQuick();
  }));
  box.querySelector("#error-open-setup")?.addEventListener("click", guard(() => openLaunch(S.session)));
  box.querySelector("#error-open-gates")?.addEventListener("click", () => {
    S.tab = "gates"; renderSession();
  });
  box.querySelector("#error-open-worktree")?.addEventListener("click", () => {
    S.tab = "worktree"; renderSession();
  });
  clearTimeout(flash.t); flash.t = setTimeout(() => box.className = "err hide", 7000);
}
function confirmNotice(message, title = "Saved") {
  const box = document.getElementById("err");
  box.className = "err card success"; box.style.borderLeftColor = "var(--accent)";
  box.innerHTML = `<b>${esc(title)}</b><div class="small" style="margin-top:.3rem">${esc(message)}</div>`;
  clearTimeout(flash.t); flash.t = setTimeout(() => box.className = "err hide", 4200);
}
const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { flash(e); } };

/* ------------------------------------------------------------------ themes
   Purely client-side: the choice lives in localStorage and swaps the token
   set via data-theme. "System" clears the choice and follows the OS. */
const THEMES = [
  {key: "", label: "System", swatch: ["#0b0d10", "#f4f5f7"]},
  {key: "terminal", label: "Terminal", swatch: ["#0b0d10", "#2fd287"]},
  {key: "midnight", label: "Midnight", swatch: ["#0a0e17", "#6ea8ff"]},
  {key: "daylight", label: "Daylight", swatch: ["#f4f5f7", "#0e8f60"]},
  {key: "sage", label: "Sage", swatch: ["#faf9f7", "#2f6f4f"]},
];

function currentTheme() {
  try { return localStorage.getItem("synchri-theme") || ""; } catch (e) { return ""; }
}

function applyTheme(key) {
  try {
    if (key) localStorage.setItem("synchri-theme", key);
    else localStorage.removeItem("synchri-theme");
  } catch (e) { /* private mode: the choice still applies for this window */ }
  if (key) document.documentElement.dataset.theme = key;
  else delete document.documentElement.dataset.theme;
  renderThemeMenu();
}

function renderThemeMenu() {
  const menu = document.getElementById("theme-menu");
  const options = document.getElementById("theme-options");
  if (!menu || !options) return;
  const active = currentTheme();
  options.innerHTML = "";
  for (const theme of THEMES) {
    const row = $(`<button type="button">
      <span class="swatch" style="background:linear-gradient(135deg, ${theme.swatch[0]} 50%, ${theme.swatch[1]} 50%)"></span>
      <span>${esc(theme.label)}</span>${theme.key === active ? `<span class="theme-check">✓</span>` : ""}</button>`);
    row.onclick = () => { applyTheme(theme.key); menu.removeAttribute("open"); };
    options.append(row);
  }
}

/* ----------------------------------------------------------- GitHub sign-in */
async function connectGitHub() {
  const login = await api("github/connect", {});
  if (login.state === "connected") {
    S.repos = null; S.githubReposRequest = null;
    S.boot = await api("bootstrap"); renderGitHubAccount();
    const account = login.account?.login ? `@${login.account.login}` : "GitHub";
    confirmNotice(`${account} is already signed in.`);
    if (S.view === "quick") { await loadQuickRepositories(); renderQuick(); }
    if (S.view === "wizard" && S.step === "repository") renderWizard();
    return;
  }
  const githubDevicePage = "https" + "://github.com/login/device";
  const destination = login.verification_uri || githubDevicePage;
  await openGitHub(destination);
  await showGitHubCode(login);
}

function sleep(ms) { return new Promise(resolve => window.setTimeout(resolve, ms)); }

async function showGitHubCode(login) {
  const previous = document.getElementById("github-device-login");
  previous?.remove();
  const expiresIn = Math.max(0, Math.ceil((Number(login.expires_at) * 1000 - Date.now()) / 1000));
  const code = $(`<div class="dialog stack" id="github-device-login" role="dialog" aria-modal="true">
    <button class="detail-close" aria-label="Close">×</button>
    <div class="kicker">CONNECT GITHUB</div>
    <h2>Enter this code in GitHub</h2>
    <p class="muted small" style="margin:.2rem 0 0">GitHub opened in your browser. Sign in if needed, then enter this one-time code to link your Synchri profile. Repository access is chosen separately.</p>
    <div class="code-big">${esc(login.user_code)}</div>
    <div class="small muted">Waiting for GitHub — this closes on its own after approval. Expires in about ${expiresIn} seconds.</div>
    <div class="row"><button class="primary" data-open>Open GitHub again</button><button data-close>Cancel</button></div>
  </div>`);
  document.body.append(code);
  let cancelled = false;
  const close = () => { cancelled = true; code.remove(); };
  code.querySelector(".detail-close").onclick = close;
  code.querySelector("[data-close]").onclick = close;
  code.querySelector("[data-open]").onclick = guard(
    () => openGitHub(login.verification_uri || githubDevicePage)
  );
  let interval = Math.max(2, Number(login.interval) || 5);
  while (!cancelled && Date.now() < Number(login.expires_at) * 1000) {
    await sleep(interval * 1000);
    if (cancelled) return;
    const result = await api("github/poll", {request_id: login.request_id});
    if (result.state === "pending") { interval = Math.max(interval, Number(result.interval) || interval); continue; }
    if (result.state === "connected") {
      code.remove(); S.repos = null; S.githubReposRequest = null;
      S.boot = await api("bootstrap"); renderGitHubAccount();
      const login = result.account?.login ? `Signed in as @${result.account.login}.` : "GitHub is signed in.";
      confirmNotice(`${login} Choose repository access when you are ready.`);
      if (S.view === "quick") { await loadQuickRepositories(); renderQuick(); }
      if (S.view === "wizard" && S.step === "repository") renderWizard();
      return;
    }
    if (result.state === "expired") break;
  }
  if (!cancelled) { code.remove(); flash("That GitHub code expired. Connect GitHub again to get a new one."); }
}

function renderGitHubAccount() {
  const button = document.getElementById("github-account");
  const label = button.querySelector(".gh-label") || button;
  const github = S.boot?.github || {};
  const account = github.account || {};
  if (github.authenticated) {
    label.textContent = account.login ? `@${account.login}` : "GitHub connected";
    button.title = "Signed in to Synchri with GitHub";
    button.onclick = () => showGitHubAccount();
    return;
  }
  label.textContent = "Sign in with GitHub";
  button.title = "Create or open your Synchri profile with GitHub";
  button.onclick = guard(connectGitHub);
}

function showGitHubAccount() {
  const github = S.boot?.github || {};
  const account = github.account || {};
  const previous = document.getElementById("github-account-details");
  previous?.remove();
  const details = $(`<div class="dialog stack" id="github-account-details" role="dialog" aria-modal="true">
    <button class="detail-close" aria-label="Close">×</button>
    <div class="kicker">GITHUB ACCOUNT</div>
    <h2>${esc(account.login ? `@${account.login}` : "GitHub connected")}</h2>
    <p class="muted small" style="margin:.2rem 0 0">Signed in with GitHub. Repository access stays under your control on GitHub.</p>
    <div class="row"><button data-close>Done</button><button class="ghost" data-disconnect>Disconnect GitHub</button></div>
  </div>`);
  document.body.append(details);
  const close = () => details.remove();
  details.querySelector(".detail-close").onclick = close;
  details.querySelector("[data-close]").onclick = close;
  details.querySelector("[data-disconnect]").onclick = guard(async () => {
    await api("github/disconnect", {});
    S.repos = null; S.githubReposRequest = null; S.boot = await api("bootstrap");
    close(); renderGitHubAccount(); confirmNotice("GitHub was disconnected.");

}

async function openRepositoryAccess(access) {
  const destination = access?.install_url;
  if (!destination) {
    flash({message:"Repository selection is being finished for Synchri. You are already signed in; your existing repositories remain available in the meantime.", resolution:{kind:"github_app_settings"}});
    return;
  }
  await openGitHub(destination);
}

/* --------------------------------------------------------- application update */
const nativeInvoke = (command, args) => window.__TAURI__?.core?.invoke(command, args);

async function openGitHub(destination) {
  if (window.__TAURI__?.core?.invoke) {
    await nativeInvoke("open_github_url", {url: destination});
    return;
  }
  const opened = window.open(destination, "_blank", "noopener,noreferrer");
  if (!opened) window.location.assign(destination);
}

function renderUpdate() {
  const button = document.getElementById("app-update");
  const update = S.update;
  button.className = "ghost";
  button.disabled = false;
  button.onclick = () => guard(() => checkForUpdate({manual:true}))();
  button.title = "Check for a signed Synchri update";
  if (!update || update.status === "idle") {
    button.textContent = "Check for updates";
    return;
  }
  if (update.status === "checking") {
    button.disabled = true;
    button.textContent = "Checking for updates…";
    return;
  }
  if (update.status === "available") {
    button.className = "ghost";
    button.textContent = `Update to v${update.update.version}`;
    button.title = "Download the signed Synchri update and reopen the app";
    button.onclick = guard(async () => {
      S.update = {status:"installing", update:update.update};
      renderUpdate();
      await nativeInvoke("install_update");
    });
  } else if (update.status === "installing") {
    button.className = "ghost";
    button.disabled = true;
    button.textContent = "Updating…";
  } else if (update.status === "current") {
    button.textContent = `Synchri v${update.currentVersion} · Up to date`;
    button.title = "Synchri is up to date. Click to check again.";
  } else if (update.status === "move_to_applications") {
    button.textContent = update.update ? "Move to Applications to update" : "Install Synchri in Applications";
    button.title = update.message;
    button.onclick = () => flash(update.message);
  } else if (update.status === "error") {
    button.textContent = "Update check unavailable";
    button.title = update.message;
  }
}

async function checkForUpdate({manual=false}={}) {
  if (!window.__TAURI__?.core?.invoke) return;
  S.update = {status:"checking"}; renderUpdate();
  try {
    S.update = await nativeInvoke("check_for_update");
    renderUpdate();
    if (manual && S.update.status === "current") confirmNotice(S.update.message);
  } catch (error) {
    S.update = {status:"error", message:error.message || "Synchri could not check for updates."};
    renderUpdate();
    if (manual) flash(S.update.message);
  }
}

        <p class="small faint" style="margin:.5rem 0 0">Synchri is built to be shared: anyone can sign in with GitHub and use it with any repository.</p></div>
      <div class="row"><button class="primary" id="create-workflow">Create workflow</button></div>

    }
    return;
  }
  const grid = $(`<div class="home-grid"><div class="home-main"></div><aside class="home-aside"></aside></div>`);
  const main = grid.querySelector(".home-main");
  const aside = grid.querySelector(".home-aside");
  main.append($(`<div class="page-head"><div><h1>Sessions</h1>
    <div class="sub">Agent collaborations in this workspace, each in its own isolated worktree.</div></div></div>`));
  if (list.length) {
    main.append(sessionRows());
  } else {
    const empty = $(`<div class="card" style="text-align:center;padding:2.4rem 1rem">
      <div class="mono muted">no sessions yet</div>
      <div class="small faint" style="margin-top:.4rem">Choose a repository, write the brief, launch the agents.</div>
      <button class="primary" style="margin-top:.9rem" id="empty-run">New session</button></div>`);
    empty.querySelector("#empty-run").onclick = () => quickStart();
    main.append(empty);
  }
  const panel = $(`<div class="card wf-panel">
    <div class="between" style="margin-bottom:.2rem"><span class="kicker">Workflows</span>
      <button class="ghost" id="new-workflow" title="Create a workflow">+ New</button></div>
    <div class="small faint" style="margin-bottom:.3rem">Saved defaults: team, permissions, pacing.</div>
    <div class="wf-rows"></div></div>`);
  panel.querySelector("#new-workflow").onclick = () => configureWorkflow();

    });

async function quickStartFromRepository(repoPath) {
  await quickStart();
  S.quick.repo_path = repoPath;
  S.quick.existing_worktree_path = null;
  S.quick.workspace_choice = null;
  await loadWorktreeChoices(repoPath);
  renderQuick();
}

/* ------------------------------------------------------------- quick start */
async function quickStart(selectedWorkflow) {
  stopClock();
  app().classList.remove("session-app");
  if (!S.boot) S.boot = await api("bootstrap");
  const workflows = S.boot.presets || [];
  if (!workflows.length) return configureWorkflow();
  const workflow = workflows.find(item => item.name === selectedWorkflow) || workflows[0];
  S.view = "quick"; S.session = null; S.launch = null;
  S.quick = {
    repo_path: S.boot.default_repo || "",
    goal: "",
    deadline: "",
    preset: workflow.name,
    existing_worktree_path: null,
    workspace_choice: null,
  };
  S.worktreeChoices = null;
  await loadQuickRepositories();
  if (S.quick.repo_path) await loadWorktreeChoices(S.quick.repo_path);
  renderQuick();
}

async function loadQuickRepositories() {
  if (!S.repos) S.repos = await api("repositories?github=0");
  if (!S.githubReposRequest) {
    S.githubReposLoading = true;
    S.githubReposRequest = api("repositories").then(repos => {
      S.repos = repos; S.githubReposLoading = false;
      if (S.view === "quick") renderQuick();
      return repos;
    }).catch(() => {
      S.githubReposLoading = false;
      if (S.view === "quick") renderQuick();
      return S.repos;
    });
  }
}

async function selectQuickRepository(reference) {
  const result = await api("repository/resolve", {reference});
  S.quick.repo_path = result.repository.path;
  S.quick.existing_worktree_path = null;
  S.quick.workspace_choice = null;
  await loadWorktreeChoices(S.quick.repo_path);
  confirmNotice(result.repository.reused
    ? `Using the existing checkout. This session will get a new isolated worktree.`
    : `Repository ready. This session will get a new isolated worktree.`);
  renderQuick();
}

async function loadWorktreeChoices(repoPath) {
  if (!repoPath) return [];
  if (S.worktreeChoices?.repository === repoPath) return S.worktreeChoices.worktrees;
  if (S.worktreeLoading === repoPath) return [];
  S.worktreeLoading = repoPath;
  try {
    S.worktreeChoices = await api(`worktrees?repo=${encodeURIComponent(repoPath)}`);
    return S.worktreeChoices.worktrees;
  } finally {
    S.worktreeLoading = null;
    if (S.view === "quick" && S.quick?.repo_path === repoPath) renderQuick();
    if (S.view === "wizard" && S.draft?.draft.repo_path === repoPath && S.step === "worktree") renderWizard();
  }
}

/* ----------------------------------------------------------- workflows */
async function configureWorkflow(name) {
  stopClock();
  app().classList.remove("session-app");
  if (!S.boot) S.boot = await api("bootstrap");
  S.view = "workflow"; S.session = null;
  S.workflowOriginal = name || "";
  S.workflowName = name || "";
  S.draft = name
    ? await api("draft", {draft:"workflow", preset:name})
    : await api("draft/reset", {draft:"workflow"});
  const savedAgents = S.draft.draft.agents || [];
  S.workflowAgents = savedAgents.length ? savedAgents.map(agent => ({...agent})) : [
    {name:"codex", runtime:"codex", role:"primary_builder"},
    {name:"copilot", runtime:"copilot", role:"adversarial_reviewer"},
  ];
  S.workflowPermissions = {...S.draft.draft.permissions};
  S.workflowDeadline = S.draft.draft.deadline_duration || "";
  renderWorkflow();
}

  app().innerHTML = "";

  </div>`);
  app().append(box);
  const list = box.querySelector("#workflow-agents");
  const drawAgents = () => {
    list.innerHTML = "";
    agents.forEach((agent, index) => {
      const row = $(`<div class="grid" style="grid-template-columns:minmax(8rem,1fr) minmax(11rem,1.2fr) minmax(11rem,1.2fr) auto;align-items:center">
        <input class="mono" value="${esc(agent.name)}" placeholder="agent name">
        <select>${S.boot.runtimes.map(runtime => `<option value="${runtime.key}" ${runtime.key===agent.runtime?"selected":""}>${esc(runtime.label)}</option>`).join("")}</select>
        <select>${S.boot.roles.map(role => `<option value="${role.key}" ${role.key===agent.role?"selected":""}>${esc(role.label)}</option>`).join("")}</select>
        <button class="ghost">Remove</button></div>`);
      const [name, runtime, role] = row.querySelectorAll("input,select");
      name.oninput = event => agent.name = event.target.value;
      runtime.onchange = event => agent.runtime = event.target.value;
      role.onchange = event => agent.role = event.target.value;
      row.querySelector("button").onclick = () => { agents.splice(index, 1); drawAgents(); };
      list.append(row);
    });
  };
  drawAgents();
  box.querySelector("#workflow-add").onclick = () => {
    agents.push({name:"", runtime:"generic", role:"participant"}); drawAgents();
  };
  const permissions = box.querySelector("#workflow-permissions");
  const profiles = box.querySelector("#workflow-profiles");
  for (const profile of S.boot.permission_profiles || []) {
    const choice = $(`<button class="choice" data-profile="${esc(profile.key)}"><b>${esc(profile.label)}</b><span class="small muted">${esc(profile.description)}</span><span class="small faint" style="display:block;margin-top:.25rem">Best for: ${esc(profile.best_for)}</span>${profile.warning ? `<span class="small" style="display:block;margin-top:.25rem;color:var(--warn)">${esc(profile.warning)}</span>` : ""}</button>`);
    choice.onclick = () => {
      S.workflowPermissions = {...profile.permissions};
      renderWorkflow();
    };
    profiles.append(choice);
  }
  for (const group of S.boot.permissions) {
    const groupEl = $(`<div style="margin-top:.9rem"><div class="kicker">${esc(group.group.toUpperCase())}</div></div>`);
    for (const capability of group.capabilities) {
      const value = S.workflowPermissions[capability.key] || capability.default;
      const row = $(`<div class="perm"><div><div>${esc(capability.label)}</div><div class="small muted">${esc(capability.description)}</div></div>
        <div class="seg"><button data-value="allow" class="${value==="allow"?"on":""}">Allow</button><button data-value="ask" class="${value==="ask"?"on":""}">Ask</button><button data-value="deny" class="${value==="deny"?"on":""}">Deny</button></div></div>`);
      row.querySelectorAll("button").forEach(button => button.onclick = () => {
        S.workflowPermissions[capability.key] = button.dataset.value;
        row.querySelectorAll("button").forEach(item => item.classList.toggle("on", item === button));
      });
      groupEl.append(row);
    }
    permissions.append(groupEl);
  }
  box.querySelector("#workflow-cancel").onclick = () => home();
  box.querySelector("#workflow-save").onclick = guard(async () => {
    const name = box.querySelector("#workflow-name").value.trim();
    const selectedAgents = agents.filter(agent => agent.name.trim()).map(agent => ({...agent, name:agent.name.trim()}));
    const deadline = box.querySelector("#workflow-deadline").value.trim();
    if (!name) throw new Error("Give this workflow a name so you can use it again.");
    if (selectedAgents.length < 2) throw new Error("A long-horizon workflow needs at least a builder and a reviewer.");
    S.draft = await api("draft", {draft:"workflow", mode:"long_horizon", agents:selectedAgents,
      permissions:S.workflowPermissions, deadline});
    S.boot.presets = (await api("preset", {draft:"workflow", name, replace:S.workflowOriginal || undefined})).presets;
    confirmNotice(`“${name}” is ready. Choose it whenever you want to start work.`);
    await home();
  });
}

function copyText(value) {
  const fallback = () => {
    const field = document.createElement("textarea");
    field.value = value; field.style.position = "fixed"; field.style.opacity = "0";
    document.body.append(field); field.select(); document.execCommand("copy"); field.remove();
  };
  if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(value).catch(fallback);
  fallback(); return Promise.resolve();
}

async function refreshLaunch() {
  const result = await api("launch?session=" + encodeURIComponent(S.session));
  showLaunch(result);
}

function showLaunch(result) {
  stopClock();
  app().classList.remove("session-app");
  S.session = result.session.session_id;
  S.launch = result.launch;
  if (result.clone) S.launch.clone = result.clone;
  S.view = "launch";
  renderLaunch(); listen();
}

async function openLaunch(id) {
  const result = await api("launch?session=" + encodeURIComponent(id));
  showLaunch(result);
}

function renderLaunch() {
  const l = S.launch, a = l.acknowledgments;
  app().innerHTML = "";
  const managed = l.managed || {readiness:{available:false,agents:[]},run:{phase:"not_started"}};
  const run = managed.run;
  const allManaged = managed.readiness.available;
  const heading = run.alive ? "Starting your agents" : (allManaged ? "Ready to launch" : "Connect your agents");
  const shell = $(`<div class="preflight card">
    <div class="between"><div><div class="kicker">Preflight</div>
      <h1 style="margin-top:.35rem">${heading}</h1>
      <div class="small muted" style="margin-top:.35rem">${esc(l.agents.length)} agent${l.agents.length===1?"":"s"} · isolated worktree ready</div></div>
      <button class="ghost" id="refresh">Refresh</button></div>
    <div class="statusline"><b class="mono">${esc(run.phase.replaceAll("_"," "))}</b><span class="small muted">${esc(run.detail || (allManaged
      ? "Synchri can launch these agents for you."
      : "Use the prompts below for tools Synchri cannot launch yet."))}</span></div>
    ${l.clone ? `<div class="small muted" style="margin-top:.55rem">Repository cloned · <span class="mono">${esc(l.clone.path)}</span></div>` : ""}
    <div id="preflight-agents" class="checklist"></div>
    <div id="preflight-actions" class="actionbar"></div>
  </div>`);
  app().append(shell);
  document.getElementById("refresh").onclick = guard(refreshLaunch);

  if (allManaged) {
    const list = document.getElementById("preflight-agents");
    for (const agent of l.agents) {
      const status = agent.joined
        ? (agent.acknowledged ? `<span class="pill">ready</span>` : `<span class="pill warn">reading agreement</span>`)
        : `<span class="pill dim">not connected</span>`;
      list.append($(`<div class="check-row"><div class="check-status">${status}</div>
        <div class="check-main"><b class="mono">${esc(agent.name)}</b>
        <span class="small muted" style="margin-left:.5rem">${esc(agent.role_label)} · ${esc(agent.launch_detail)}</span></div></div>`));
    }
    const actions = document.getElementById("preflight-actions");
    const bar = $(`<div class="between" style="gap:1rem"><div class="row" style="min-width:0"><button class="ghost" id="external">Send prompts instead</button>
      <span class="small faint">Synchri connects the agents, confirms the agreement, and opens the first build turn. The timer starts only after that.</span></div>
      <button class="primary" id="managed-start" ${run.alive?"disabled":""}>${run.alive ? "Starting…" : "Start my agents"}</button></div>`);
    bar.querySelector("#managed-start").onclick = guard(startManaged);
    bar.querySelector("#external").onclick = () => renderExternalSetup(l);
    actions.append(bar);
    if (run.alive) pollManagedLaunch();
    return;
  }
  renderExternalSetup(l);
}

async function startManaged() {
  await api("managed/start", {session:S.session});
  await refreshLaunch();
  pollManagedLaunch();
}

function pollManagedLaunch() {
  window.setTimeout(guard(async () => {
    if (S.view !== "launch" || !S.session) return;
    const status = await api("managed?session=" + encodeURIComponent(S.session));
    S.launch.managed = {readiness:status.readiness, run:status.managed};
    if (status.managed.phase === "working") { await openSession(S.session); return; }
    renderLaunch();
  }), 700);
}

function renderExternalSetup(l) {
  const a = l.acknowledgments;
  const external = l.agents.filter(agent => !agent.managed_ready || !l.managed.readiness.available);
  const list = document.getElementById("preflight-agents");
  const actions = document.getElementById("preflight-actions");
  if (!list || !actions) return;
  list.innerHTML = `<div class="small muted" style="padding:.65rem 0 .3rem">Paste one short prompt into each agent's terminal. It joins the room, reads the agreement, and stays available without status chatter.</div>`;
  for (const agent of l.agents) {
    const status = agent.joined
      ? (agent.acknowledged ? `<span class="pill">ready</span>` : `<span class="pill warn">reading agreement</span>`)
      : `<span class="pill dim">not connected</span>`;
    const row = $(`<div class="check-row"><div class="check-status">${status}</div>
      <div class="check-main"><div><b class="mono">${esc(agent.name)}</b>
        <span class="small muted" style="margin-left:.5rem">${esc(agent.role_label)} · ${esc(agent.launch_detail)}</span></div>
        <details class="adv" ${agent.joined ? "" : "open"}><summary class="small muted">Setup prompt</summary>
          <pre>${esc(agent.setup_prompt)}</pre>
          <div class="row" style="margin-top:.55rem"><button class="primary" data-copy>Copy for ${esc(agent.name)}</button></div>
        </details></div></div>`);
    const setup = row.querySelector("[data-copy]");
    setup.onclick = guard(async () => { await copyText(agent.setup_prompt); setup.textContent = "Copied"; });

    : `Waiting for: ${a.waiting.join(", ") || l.agents.filter(x=>!x.joined).map(x=>x.name).join(", ") || "an acknowledgement"}`;
  const bar = $(`<div class="between" style="gap:1rem"><div class="row" style="min-width:0"><button class="ghost" id="open">Open room</button>
    <span class="small faint">${esc(waiting)}</span></div>
    <button class="primary" id="activate" ${l.ready_to_activate?"":"disabled"}>Begin collaboration</button></div>`);
  bar.querySelector("#activate").onclick = guard(async () => {
    await api("activate", {session:S.session}); await openSession(S.session);
  });
  bar.querySelector("#open").onclick = guard(() => openSession(S.session));
  actions.append(bar);
}

/* ---------------------------------------------------------------- wizard */
async function newSession(resume) {
  stopClock();
  app().classList.remove("session-app");
  S.view = "wizard"; S.step = "repository";
  S.draft = resume ? await api("draft?draft=default")
                   : await api("draft/reset", { draft: "default" });
  if (!S.boot) S.boot = await api("bootstrap");
  // Reopening an unfinished wizard should land on the first thing still needed.
  if (resume && S.draft.draft.mode) {
    const steps = S.draft.steps.map(x => x.key);
    S.step = steps.find(k => k !== "review" && S.draft.problems.length &&
                              S.draft.problems.some(() => true) && !stepSatisfied(k)) || "review";
  }
  renderWizard();
}

function stepSatisfied(key) {
  const d = S.draft.draft;
  return ({ mode: !!d.mode, repository: !!d.repo_path, worktree: true,
            agents: d.agents.length > 0, permissions: true,
            spec: !!d.spec, deadline: true, review: true })[key] ?? true;
}

async function patch(body) {
  S.draft = await api("draft", { draft: "default", ...body });
  renderWizard();
}

function renderWizard() {
  const d = S.draft, steps = d.steps.length ? d.steps : [{key:"mode",label:"Choose how this session runs"}];
  app().innerHTML = "";
  const bar = $(`<div class="steps"></div>`);
  steps.forEach((st, i) => {
    const b = $(`<button class="${st.key === S.step ? "on" : (i < steps.findIndex(x=>x.key===S.step) ? "done":"")}">${i+1}. ${esc(st.label)}</button>`);
    b.disabled = !d.draft.mode && st.key !== "mode";
    b.onclick = () => { S.step = st.key; renderWizard(); };  // free back-navigation
    bar.append(b);
  });
  app().append(bar);
  ({ mode: stepMode, repository: stepRepo, worktree: stepTree, agents: stepAgents,
     permissions: stepPerms, spec: stepSpec, deadline: stepDeadline, review: stepReview
   }[S.step] || stepMode)();
  const idx = steps.findIndex(s => s.key === S.step);
  const nav = $(`<div class="between" style="margin-top:1.5rem"></div>`);
  const back = $(`<button ${idx <= 0 ? "disabled" : ""}>Back</button>`);
  back.onclick = () => { S.step = steps[idx-1].key; renderWizard(); };
  const next = $(`<button class="primary">${idx === steps.length-1 ? "" : "Next"}</button>`);
  if (idx < steps.length - 1) {
    next.onclick = guard(async () => {
      // Agent entries are the only wizard field edited locally before an
      // explicit save.  Persist them on Next as well: leaving step 4 must not
      // silently throw away the team the user just entered.
      if (S.step === "agents" && S.agentDraft) {
        S.draft = await api("draft", {
          draft: "default", agents: S.agentDraft.filter(agent => agent.name.trim())
        });
      }
      S.step = steps[idx+1].key; renderWizard();
    });
  }
  else next.className = "hide";
  nav.append(back, next);
  app().append(nav);
}

      S.repos = {...S.repos, github_available:false}; S.githubReposLoading = false;

  if (S.repos.local.length) {
    box.append($(`<h3 class="small muted" style="margin-top:.5rem">ON THIS MACHINE</h3>`));

    box.append($(`<h3 class="small muted" style="margin-top:.5rem">GITHUB</h3>`));
    for (const r of S.repos.github.slice(0, 12)) {

        ${r.description?`<span class="small muted">${esc(r.description)}</span>`:""}</button>`);
      b.onclick = guard(async () => {
        const result = await api("repository/resolve", {reference: r.full_name});

    box.append($(`<div class="small muted">Loading your GitHub repositories…</div>`));
  } else if (!S.repos.github_status?.authenticated) {
    const status = S.repos.github_status || {};

  }

async function openSession(id) {
  app().classList.add("session-app");
  S.view = "session"; S.session = id;
  S.dash = await api("dashboard?session=" + encodeURIComponent(id));
  S.tab = S.dash.session.status === "awaiting_ack" ? "contract" : "conversation";
  renderSession();
  listen();
}

/* The server watches and pushes; the client never polls. EventSource
   reconnects by itself, so a dropped connection self-heals. */
function listen() {
  if (S.es) { S.es.close(); S.es = null; }
  const q = S.session ? "?session=" + encodeURIComponent(S.session) : "";
  const es = new EventSource("/api/stream" + q);
  S.es = es;
  es.addEventListener("changed", async (e) => {
    const what = JSON.parse(e.data).what || [];
    try {
      if (S.view === "session") {
        S.dash = await api("dashboard?session=" + encodeURIComponent(S.session));
        // Room messages and Live Work arrive often. Repainting the whole
        // session made the page visibly jump and threw away scroll position.
        // Only structural session changes need a full layout rebuild.
        if (what.includes("sessions")) {
          renderSession();
        } else {
          refreshSessionChrome();
          const conversation = document.getElementById("conversation-panel");
          if (conversation) await paint("conversation", conversation);
          if (S.tab !== "conversation" && (what.includes("gates") || what.includes("conversation"))) {
            const detail = document.getElementById("detail-panel");
            if (detail) await paint(S.tab, detail);
          }
        }
      } else if (S.view === "launch" && S.session) {
        const result = await api("launch?session=" + encodeURIComponent(S.session));
        S.launch = result.launch; renderLaunch();
      } else if (S.view === "home" && what.includes("sessions")) {
        await home();
      } else if (S.view === "wizard" && what.includes("drafts")) {
        // Another tab edited this draft. Adopt it rather than diverge.
        const fresh = await api("draft?draft=default");
        if (fresh.version !== S.draft.version) { S.draft = fresh; renderWizard(); }
      }
    } catch (err) { /* transient; the next event will catch us up */ }
  });
  es.addEventListener("closing", () => { es.close(); S.es = null; setTimeout(listen, 500); });
  es.onerror = () => { /* EventSource retries on its own */ };
}

const DETAIL_TABS = ["gates","tests","changes","commits","worktree","memory","raw","contract","changelog"];

function timeboxText(deadline) {
  if (!deadline?.ends_at) return "Open-ended";
  const seconds = Math.ceil((Date.parse(deadline.ends_at) - Date.now()) / 1000);
  if (seconds <= 0) return "Timebox passed";
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  return `${String(hours).padStart(2,"0")}:${String(minutes).padStart(2,"0")}:${String(seconds % 60).padStart(2,"0")} remaining`;
}

function taskElapsed(startedAt) {
  if (!startedAt) return "just now";
  const seconds = Math.max(0, Math.floor((Date.now() - Date.parse(startedAt)) / 1000));
  const minutes = Math.floor(seconds / 60), rest = seconds % 60;
  return minutes ? `${minutes}m ${String(rest).padStart(2,"0")}s` : `${rest}s`;
}

function activeAgentTask(d) {
  const name = d.current_actor;
  if (!name || d.session.status !== "active") return null;
  const entries = d.activity_entries || d.activities || [];
  const note = [...entries].reverse().find(item => item.name === name);
  return {
    name,
    started_at: note?.created_at || d.active_turn?.started_at,
    summary: note?.summary || "Planning the next step. This can take a few minutes.",
    planning: !note,
  };
}

function timeboxNudge(d) {
  const deadline = d.session.deadline;
  if (!deadline?.ends_at || d.session.status !== "active") return "";
  const remaining = Math.ceil((Date.parse(deadline.ends_at) - Date.now()) / 1000);
  const total = Number(deadline.duration_seconds) || Math.max(1, Date.parse(deadline.ends_at) - Date.parse(deadline.started_at)) / 1000;
  if (remaining <= 0 || remaining > Math.max(15 * 60, total * .1) || S.dismissedTimebox === d.session.session_id) return "";
  return `<section class="timebox-nudge"><b>Timebox is getting close.</b> It guides pace only—agent work will not stop when it ends.
    <span class="row"><button data-extend="30 minutes">Add 30 min</button><button data-extend="1 hour">Add 1 hour</button><button class="ghost" data-dismiss-timebox>Keep current timebox</button></span></section>`;
}

function startClock(deadline, status) {
  stopClock();
  const tick = () => {
    const clock = document.getElementById("timebox");
    if (clock) clock.textContent = ["complete", "stopped", "failed", "timed_out"].includes(status)
      ? "Session ended" : timeboxText(deadline);
    document.querySelectorAll("[data-task-started]").forEach(node => {
      node.textContent = taskElapsed(node.dataset.taskStarted);
    });
  };
  tick();
  if ((deadline?.ends_at || status === "active") && !["complete", "stopped", "failed", "timed_out"].includes(status)) S.clock = setInterval(tick, 1000);
}

function stopClock() {
  if (S.clock) clearInterval(S.clock);
  S.clock = null;
}

function renderSession() {
  const d = S.dash, s = d.session, g = d.gates.summary;
  const working = s.status === "active";
  const current = d.current_actor || (working ? "Waiting for the next turn" : s.status.replace("_", " "));
  const activeNotes = new Set((d.activities || []).map(note => note.name));
  const gatePercent = g.required ? Math.round((g.satisfied / g.required) * 100) : 0;
  app().innerHTML = "";
  const runtimeStates = d.participant_states || {};
  const team = s.participants.map(p => {
    const runtime = runtimeStates[p.name] || {};
    const trouble = ["failed", "timed_out", "dropped"].includes(runtime.state);
    const active = p.name === d.current_actor;
    const dot = trouble ? (runtime.state === "dropped" ? "bad" : "warn") : (active ? "live" : "");
    const label = trouble ? runtime.state.replace("_", " ")
      : (activeNotes.has(p.name) ? "working" : (active ? "on point" : "waiting"));
    return `<div class="team-line" data-member="${esc(p.name)}"${runtime.detail ? ` title="${esc(runtime.detail)}"` : ""}><span class="presence"><i class="${dot}"></i>${esc(p.name)}</span>
      <span class="muted small" data-team-state${trouble ? ' style="color:var(--bad)"' : ""}>${esc(label)}</span></div>`;
  }).join("");
  const nav = ["conversation", ...DETAIL_TABS.filter(tab => tab !== "changelog" || s.status === "complete")];
  const layout = $(`<div class="session-layout"><aside class="session-rail">
      <div><div class="kicker">Synchri session</div><div class="rail-title">${esc(s.name)}</div></div>
      <div class="rail-status"><i id="rail-current-dot" class="led ${working ? "live" : ""}"></i><span id="rail-current">${esc(current)}</span></div>
      <div id="timebox" class="rail-clock mono">${esc(["complete", "stopped", "failed", "timed_out"].includes(s.status) ? "Session ended" : timeboxText(s.deadline))}</div>
      <div class="rail-progress"><div class="rail-progress-line"><span>Acceptance gates</span><b id="rail-gates">${esc(g.satisfied + "/" + g.required)}</b></div><span class="rail-progress-track"><i id="rail-gates-bar" style="width:${gatePercent}%"></i></span></div>
      <nav class="rail-nav" aria-label="Session tools">${nav.map(tab =>
        `<button data-tab="${tab}" class="${tab===S.tab?"on":""}">${tab === "conversation" ? "Conversation" : tab[0].toUpperCase()+tab.slice(1)}</button>`
      ).join("")}</nav>
      <div class="rail-team"><div class="kicker" style="margin-bottom:.35rem">Team</div>${team}</div>
      <div class="rail-controls">${s.status === "active" && d.managed?.readiness?.available && !d.managed?.run?.alive ? `<button id="c-continue">Continue agents</button>` : ""}${["active", "paused"].includes(s.status) ? `<button id="c-pause">${s.status==="active"?"Pause":"Resume"}</button>` : ""}${["active", "paused"].includes(s.status) ? `<button class="control-complete" id="c-complete">Complete session</button>` : ""}${!['complete','stopped','failed','timed_out'].includes(s.status) ? `<button class="control-stop" id="c-stop">Stop session</button>` : ""}</div>
    </aside><main class="conversation-shell"><div class="chat-header"><div><div class="chat-title">Conversation</div>
      <div class="chat-subtitle">${esc(s.repository.name)} · ${esc(s.worktree?.branch || s.repository.base_branch || "")}</div></div>
      <div class="chat-time">${esc(g.satisfied + "/" + g.required)} gates verified</div></div>
      <div id="conversation-panel" class="conversation-feed"><span class="muted small" style="padding:1rem clamp(1.25rem,3vw,2.5rem)">Loading conversation…</span></div>
      <section id="detail-wrap" class="inspector hide"><div class="inspector-head"><div class="detail-heading" id="detail-heading"></div><button class="detail-close">Close</button></div>
      <section id="detail-panel" class="details-panel"></section></section></main></div>`);
  app().append(layout);
  const pause = document.getElementById("c-pause");
  if (pause) pause.onclick = guard(() => runSessionControl(pause, s.status === "active" ? "pause" : "resume"));
  const complete = document.getElementById("c-complete");
  if (complete) complete.onclick = () => guard(async () => {
    if (S.dash?.gates?.summary?.complete) {
      if (!confirm("Complete this session? Synchri will verify its gates, close the room, and create the final changelog.")) return;
      await runSessionControl(complete, "complete");
      return;
    }
    showForceCompleteDialog(complete); })();
  const stop = document.getElementById("c-stop");
  if (stop) stop.onclick = () => guard(async () => {
    if (!confirm("Stop this session? Agents stop immediately. The worktree and all work stay.")) return;
    await runSessionControl(stop, "stop");
    confirmNotice("Session stopped. Agent processes are being shut down."); })();
  layout.querySelectorAll("[data-tab]").forEach(button => button.onclick = () => {
    S.tab = button.dataset.tab; renderSession();
  });
  const resumeManaged = document.getElementById("c-continue");
  if (resumeManaged) resumeManaged.onclick = guard(async () => {
    await api("managed/start", {session:S.session});
    S.dash = await api("dashboard?session=" + encodeURIComponent(S.session));
    renderSession();
  });
  paint("conversation", document.getElementById("conversation-panel"))
    .catch(error => document.getElementById("conversation-panel").innerHTML = `<span class="muted">${esc(error.message)}</span>`);
  if (S.tab !== "conversation") {
    const wrap = document.getElementById("detail-wrap");
    wrap.classList.remove("hide");
    document.getElementById("detail-heading").textContent = S.tab.toUpperCase();
    wrap.querySelector(".detail-close").onclick = () => { S.tab = "conversation"; renderSession(); };
    const panel = document.getElementById("detail-panel");
    panel.innerHTML = `<span class="muted small">Loading…</span>`;
    paint(S.tab, panel).catch(error => panel.innerHTML = `<span class="muted">${esc(error.message)}</span>`);
  }
  startClock(s.deadline, s.status);
}

function renderActivityNote(d) {
  const activityTrail = d.activity_entries || d.activities || [];
  const currentActivity = activityTrail[activityTrail.length - 1];
  const previousActivities = activityTrail.slice(0, -1);
  const activeTask = activeAgentTask(d);
  const liveName = currentActivity?.name || activeTask?.name;
  const liveSummary = currentActivity?.summary || activeTask?.summary;
  const liveStarted = currentActivity?.created_at || activeTask?.started_at;
  return liveName ? `<details class="live-work" aria-live="polite"><summary>
      <span class="live-work-label">${esc(String(liveName).toUpperCase())} · ${activeTask?.planning ? "PLANNING" : "WORKING"} · <span data-task-started="${esc(liveStarted || "")}">${esc(taskElapsed(liveStarted))}</span></span>
      <span class="live-note"><span class="dot">●</span><span>${richInline(liveSummary)}</span></span>
    </summary>${previousActivities.length ? `<div style="margin-top:.3rem">${previousActivities.map(note =>
      `<div class="live-note"><span class="dot">●</span><b>${esc(String(note.name).toUpperCase())}</b><div>${rich(note.summary)}</div></div>`
    ).join("")}</div>` : ""}</details>` : `<section class="live-work" aria-live="polite"></section>`;
}

function renderLiveFeed(liveEvents, d) {
  // Group durable stream events by participant, then by provider invocation;
  // only a participant's newest, still-running invocation renders as a panel.
  const byParticipant = new Map();
  for (const event of liveEvents) {
    const invokes = byParticipant.get(event.participant) || new Map();
    const events = invokes.get(event.invoke_key) || [];
    events.push(event);
    invokes.set(event.invoke_key, events);
    byParticipant.set(event.participant, invokes);
  }
  const panels = [];
  for (const [name, invokes] of byParticipant) {
    let latest = null, latestId = -1;
    for (const events of invokes.values()) {
      const last = events[events.length - 1];
      if (last.event_id > latestId) { latestId = last.event_id; latest = events; }
    }
    if (!latest || latest.some(event => event.kind === "result")) continue;
    panels.push(feedPanel(name, latest));
  }
  // Runtimes without a stream (and quiet moments) keep the activity note.
  if (!panels.length) return renderActivityNote(d);
  return `<section class="live-feed" aria-live="polite">${panels.join("")}</section>`;
}

function feedPanel(name, events) {
  const started = events[0]?.created_at || "";
  const rows = events.slice(-40).map(feedRow).filter(Boolean).join("");
  const paths = [];
  for (const event of events) {
    if (event.kind === "file_edit" && event.file_path && !paths.includes(event.file_path)) {
      paths.push(event.file_path);
    }
  }
  const cards = paths.map(path => fileCardHtml(name, path)).join("");
  return `<div class="feed-panel">
    <div class="feed-head"><span class="dot">●</span><span>${esc(String(name).toUpperCase())} · WORKING · <span data-task-started="${esc(started)}">${esc(taskElapsed(started))}</span></span></div>
    <div class="feed-lines">${rows || `<div class="feed-line status muted">Starting up…</div>`}</div>${cards}</div>`;
}

function feedRow(event) {
  const kind = event.kind;
  if (kind === "usage" || kind === "result") return "";
  if (kind === "file_edit") {
    return `<div class="feed-line file mono">✎ ${esc(event.title || event.file_path || "")}</div>`;
  }
  if (kind === "command") {
    const exit = event.payload && event.payload.exit_code !== undefined && event.payload.exit_code !== null
      ? ` <span class="faint">· exit ${esc(String(event.payload.exit_code))}</span>` : "";
    return `<div class="feed-line command mono">${esc(event.title || "")}${exit}</div>`;
  }
  if (kind === "thinking") {
    const detail = event.detail || "";
    const body = richInline(detail);
    const long = detail.length > 280 || detail.split("\n").length > 3;
    return `<div class="feed-line thinking">${long ? clampBlock(`<span>${body}</span>`, 3) : body}</div>`;
  }
  if (kind === "compaction") {
    return `<div class="feed-line compaction"><span class="pill dim">${esc((event.title || "Context compacted").toUpperCase())}</span></div>`;
  }
  if (kind === "error") {
    return `<div class="feed-line error">${esc(event.title || "Error")}${event.detail ? ` <span class="faint">— ${esc(event.detail.split("\n")[0])}</span>` : ""}</div>`;
  }
  if (kind === "tool") {
    return `<div class="feed-line tool">${esc(event.title || "tool")}${event.detail ? ` <span class="faint">· ${esc(event.detail)}</span>` : ""}</div>`;
  }
  return `<div class="feed-line status">${richInline(event.title || "")}</div>`;
}

function fileCardHtml(agent, path) {
  const open = S.openFileCards.has(agent + ":" + path);
  const cached = S.fileCardCache.get(path);
  return `<details class="file-card" data-agent="${esc(agent)}" data-path="${esc(path)}"${open ? " open" : ""}>
    <summary><span class="mono file-card-path">${esc(path)}</span><span class="file-card-stats small faint">${cached ? esc(cached.stats) : ""}</span></summary>
    <pre class="diff file-card-diff">${cached ? cached.html : '<span class="muted small">Loading the diff…</span>'}</pre>
  </details>`;
}

async function loadFileCard(card) {
  const path = card.dataset.path;
  const cached = S.fileCardCache.get(path);
  const now = Date.now();
  if (cached && now - cached.at < 3000) { applyFileCard(card, cached); return; }
  try {
    const r = await api(`diff/file?session=${encodeURIComponent(S.session)}&path=${encodeURIComponent(path)}`);
    const entry = {
      at: now,
      html: r.diff ? renderDiff(r.diff) : '<span class="muted small">No changes in this file yet.</span>',
      stats: `+${r.insertions || 0} −${r.deletions || 0}${r.truncated ? " · truncated" : ""}`,
    };
    S.fileCardCache.set(path, entry);
    applyFileCard(card, entry);
  } catch (error) {
    const body = card.querySelector(".file-card-diff");
    if (body) body.innerHTML = `<span class="muted small">${esc(error.message)}</span>`;
  }
}

function applyFileCard(card, entry) {
  const body = card.querySelector(".file-card-diff");
  const stats = card.querySelector(".file-card-stats");
  if (body) body.innerHTML = entry.html;
  if (stats) stats.textContent = entry.stats;
}

function gateAddForm(editable) {
  if (!editable) return "";
  return `<details class="adv" style="margin-top:.9rem"><summary class="small muted">+ Add a gate</summary>
    <div class="row" style="margin-top:.5rem;flex-wrap:nowrap">
      <input id="gate-new-id" class="mono" placeholder="GATE-03" style="max-width:9rem">
      <input id="gate-new-description" placeholder="What must be true to accept this work">
      <button class="primary" id="gate-new-save">Add gate</button></div></details>`;
