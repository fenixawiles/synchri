[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synchri"
version = "0.4.1"
description = "Run two coding agents on one task, in one room, with an isolated worktree and a contract they both agree to."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Synchri contributors" }]
keywords = ["agents", "orchestration", "cli", "local-first", "coding-agents",
            "claude-code", "codex", "git-worktree", "ai-pair-programming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control :: Git",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# The broker stays deliberately lean. ``certifi`` is bundled for the desktop
# app's GitHub OAuth flow so its embedded Python can verify GitHub's TLS chain
# without ever weakening certificate validation.
dependencies = ["certifi>=2024.2.2"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
synchri = "synchri.cli.main:main"

[project.urls]
Homepage = "https://synchri.com"
Source = "https://github.com/fenixawiles/synchri"
Issues = "https://github.com/fenixawiles/synchri/issues"
Documentation = "https://github.com/fenixawiles/synchri/tree/main/docs"

[tool.setuptools.packages.find]
include = ["synchri*"]

[tool.setuptools.package-data]
synchri = ["storage/*.sql", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # ThreadingHTTPServer's per-connection sockets are collected after the test
    # returns; the warning is cleanup noise, not a leak in Synchri.
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
