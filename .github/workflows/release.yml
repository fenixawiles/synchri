name: Release Synchri

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release
        required: true
        type: string
      publish_pypi:
        description: Publish the wheel to PyPI (requires the configured trusted publisher)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  mac-app:
    # Build on Apple Silicon, not an Intel image cross-compiling for it. The
    # bundled Python engine and the Tauri shell must receive the same native
    # Developer ID signature for hardened runtime to allow them to load each
    # other on a customer's Mac.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python -m pip install --upgrade pyinstaller
      - run: test "$(uname -m)" = arm64
      - run: npm ci
        working-directory: desktop
      - name: Configure Apple signing certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$CERTIFICATE"
          KEYCHAIN="$RUNNER_TEMP/synchri-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE_PATH="$RUNNER_TEMP/synchri-release.p12"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
      - name: Build, sign, and notarize the native DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SYNCHRI_ARCH: arm64
          SYNCHRI_TARGET_TRIPLE: aarch64-apple-darwin
          SYNCHRI_TAURI_TARGET_DIR: ${{ runner.temp }}/synchri-tauri-target
        run: scripts/build_tauri_macos.sh
      - name: Verify the signed native bundle
        run: |
          APP="$RUNNER_TEMP/synchri-tauri-target/release/bundle/macos/Synchri.app"
          DMG="release/tauri/Synchri-macos-arm64.dmg"
          test -x "$APP/Contents/MacOS/synchri-desktop"
          test -x "$APP/Contents/Resources/engine/synchri-core"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$DMG"
          hdiutil imageinfo "$DMG" | grep -q 'Class: CUDIFDiskImage'
      - name: Build the signed update manifest
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          python scripts/make_tauri_update_manifest.py "$VERSION" "$TAG" release/tauri/latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            release/tauri/Synchri-macos-arm64.dmg
            release/tauri/Synchri-macos-arm64.dmg.sha256
            release/tauri/Synchri-macos-arm64.app.tar.gz
            release/tauri/Synchri-macos-arm64.app.tar.gz.sig
            release/tauri/latest.json

  github-release:
    needs: [python-package, mac-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish or replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --generate-notes --verify-tag
          fi

  publish-pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi
    needs: python-package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/synchri/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
