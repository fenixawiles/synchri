        <span class="small muted">A fresh branch and folder created for this session.</span></button>
      ${worktrees.map(tree => `<button class="choice ${q.workspace_choice === "existing" && tree.path === q.existing_worktree_path ? "on" : ""}" data-workspace="${esc(tree.path)}">
        <div class="repo-row"><b>${esc(tree.name)}</b><span class="mono small muted">${esc(tree.branch)}</span></div>
        <span class="mono small faint">${esc(tree.path)}</span></button>`).join("")}
    </div>`));
    if (!worktrees.length) {
      body.append($(`<div class="small muted">${S.worktreeLoading ? "Scanning for existing worktrees…" : "No existing worktrees found — the new worktree still needs an explicit pick."}</div>`));
    }
    body.querySelectorAll("[data-workspace]").forEach(button => button.onclick = () => {
      const value = button.dataset.workspace;
      if (value === "new") { q.workspace_choice = "new"; q.existing_worktree_path = null; }
      else { q.workspace_choice = "existing"; q.existing_worktree_path = value; }
      q.editStep = null;
      renderQuick();
    });
    return body;
  };

  const briefBody = () => {
    const body = $(`<div class="ask-body stack"></div>`);
    body.append($(`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(14rem,1fr))">
      <button class="choice ${planIntent ? "" : "on"}" data-intent="build"><b>Paste a brief</b>
        <span class="small muted">A spec, ticket, notes, or plain language — kept verbatim as the contract.</span></button>
      <button class="choice ${planIntent ? "on" : ""}" data-intent="plan"><b>Help me make a plan</b>
        <span class="small muted">Planners inspect the repository and draft a plan you approve before any build.</span></button>
    </div>`));
    body.append($(`<textarea id="quick-goal" placeholder="${planIntent
      ? "What do you want built or changed? Rough thoughts are fine — constraints, hopes, things that must not break…"
      : "Paste a spec, ticket, notes, or a plain-language brief — any text works."}">${esc(q.goal)}</textarea>`));
    body.append($(planIntent
      ? `<div class="small faint">Stored verbatim as the idea. The planner drafts from it plus real repository inspection; an adversarial reviewer attacks the plan until it is ready to approve.</div>`
      : `<div class="small faint">Kept verbatim as the contract's source of truth. Gate IDs like <span class="mono">AUTH-01</span> become individually tracked acceptance gates.</div>`));
    if (!planIntent) body.append($(`<div id="gate-preview" class="small muted"></div>`));
    const foot = $(`<div class="ask-foot"><button class="primary" id="brief-continue">Continue</button></div>`);
    body.append(foot);
    body.querySelectorAll("[data-intent]").forEach(button => button.onclick = () => {
      if (q.intent === button.dataset.intent) return;
      // Switching intent re-opens what it affects: the team default changes,
      // and planning supersedes the workspace pick (kept for a return to
      // build). The typed text is never thrown away.
      q.intent = button.dataset.intent;
      q.teamDone = false;
      q.briefDone = false;
      renderQuick();
    });
    const refreshGatePreview = () => {
      const target = body.querySelector("#gate-preview");
      if (!target) return;
      const text = body.querySelector("#quick-goal")?.value || "";
      if (!text.trim()) { target.innerHTML = ""; return; }
      clearTimeout(S.gatePreviewTimer);
      S.gatePreviewTimer = setTimeout(async () => {
        try {
          const r = await api("gates/preview", {spec: text});
          // The note usually names the detected gates already; the chip list
          // only earns its place when it does not.
          const listed = r.gates.length && r.note.includes(r.gates[0].gate_id);
          const chips = listed ? "" : r.gates.slice(0, 8).map(g => esc(g.gate_id)).join(" · ");
          target.innerHTML = `${esc(r.note)}${chips ? ` <span class="mono">${chips}${r.gates.length > 8 ? " …" : ""}</span>` : ""}`;
        } catch (error) { /* the preview is best-effort */ }
      }, 500);
    };
    // Typed text survives every repaint (repo selection, the GitHub repository
    // list arriving, intent switches) by living in state, not just the DOM.
    body.querySelector("#quick-goal").oninput = event => { q.goal = event.target.value; refreshGatePreview(); };
    refreshGatePreview();
    foot.querySelector("#brief-continue").onclick = () => {
      if (!q.goal.trim()) {
        flash(planIntent ? "Describe the idea first — rough thoughts are fine."
                         : "Describe what you want the agents to do.");
        return;
      }
      q.briefDone = true; q.editStep = null;
      renderQuick();
    };
    return body;
  };

  const teamBody = () => {
    const body = $(`<div class="ask-body stack"></div>`);
    const workflows = S.boot.presets || [];
    if (!planIntent && workflows.length) {
      body.append($(`<div class="row"><select id="quick-workflow" style="max-width:18rem">${workflows.map(item =>
        `<option value="${esc(item.name)}" ${team.workflow && item.name === team.workflow.name ? "selected" : ""}>${esc(item.name)}</option>`).join("")}</select>
        <button class="ghost" id="quick-advanced">Edit workflow</button></div>`));
    } else {
      body.append($(`<div class="small muted">${planIntent
        ? "Planning uses the recommended pair — one drafts, one attacks the plan — in a disposable read-only workspace."
        : "The recommended team: Claude builds, Codex reviews adversarially. Save a workflow later to make your own default."}</div>`));
    }
    const roster = $(`<div class="stack" style="gap:.35rem"></div>`);
    for (const agent of team.agents) {
      roster.append($(`<div class="row" style="gap:.55rem"><i class="led ${agent.ready.dot}"></i>
        <b style="font-size:12.5px">${esc(agent.name)}</b>
        <span class="small muted">${esc(roleLabel(agent.role))}</span>
        <span class="small faint">${esc(agent.ready.note)}</span></div>`));
    }
    body.append(roster);
    for (const blocked of planningBlockers) {
      body.append($(`<div class="note warn small"><b>${esc(blocked.label)}</b> has no planning support in this Synchri version — planning needs a runtime with a read-only planning workspace.</div>`));
    }
    const TIMEBOX_CHOICES = [["", "Open"], ["30 minutes", "30m"], ["1 hour", "1h"], ["2 hours", "2h"]];
    body.append($(`<div class="row" style="gap:.6rem"><div class="seg timebox-seg">${TIMEBOX_CHOICES.map(([value, label]) =>
      `<button type="button" data-tb="${esc(value)}" class="${!q.deadlineCustom && q.deadline.trim() === value ? "on" : ""}">${label}</button>`).join("")}<button type="button" data-tb="custom" class="${q.deadlineCustom ? "on" : ""}">Custom</button></div>
      ${q.deadlineCustom ? `<input id="quick-deadline" value="${esc(q.deadline||"")}" placeholder="e.g. 2h30m" style="max-width:9rem">` : ""}</div>`));
    body.append($(`<div class="small faint">The clock starts when collaboration begins, and never ends the work by itself.</div>`));
    const foot = $(`<div class="ask-foot"><button class="primary" id="team-continue"${planningBlockers.length ? ` disabled title="Planning needs runtimes with planning support"` : ""}>Continue</button></div>`);
    body.append(foot);
    body.querySelector("#quick-workflow")?.addEventListener("change", event => {
      q.preset = event.target.value; renderQuick();
    });
    body.querySelector("#quick-advanced")?.addEventListener("click", () => {
      S.returnToQuick = true;
      configureWorkflow(q.preset);
    });
    body.querySelectorAll("[data-tb]").forEach(button => button.onclick = () => {
      if (button.dataset.tb === "custom") q.deadlineCustom = true;
      else { q.deadlineCustom = false; q.deadline = button.dataset.tb; }
      renderQuick();
    });
    const customTimebox = body.querySelector("#quick-deadline");
    if (customTimebox) customTimebox.oninput = event => { q.deadline = event.target.value; };
    foot.querySelector("#team-continue").onclick = () => { q.teamDone = true; q.editStep = null; renderQuick(); };
    return body;
  };

  const readyBody = () => {
    const body = $(`<div class="ask-body"></div>`);
    const workspaceLabel = planIntent ? "planning workspace — managed automatically"
      : q.workspace_choice === "existing" ? (existingTree?.name || "existing worktree")
      : q.workspace_choice === "new" ? "new isolated worktree" : "choose a workspace";
    body.append($(`<div class="ready-rows">
      <div class="ready-row"><span>Repository</span><b title="${esc(q.repo_path)}">${esc(repoName || "—")}</b></div>
      <div class="ready-row"><span>Workspace</span><b>${esc(workspaceLabel)}</b></div>
      <div class="ready-row"><span>Team</span><b class="mono" style="font-weight:500">${esc(chain)}</b></div>
      <div class="ready-row"><span>Timebox</span><b>${esc(q.deadline.trim() || team.workflow?.deadline_duration || "open-ended")}</b></div>
    </div>`));
    const start = $(`<button class="primary" id="quick-go" style="min-width:11rem">Start</button>`);
    const rowEl = $(`<div class="row" style="gap:.8rem"></div>`);
    rowEl.append(start);
    rowEl.append($(`<span class="small faint">${planIntent
      ? "Creates the planning room and opens preflight. Planners launch only after your go."
      : "Writes the contract and the workspace, then opens preflight. Agents launch only after your go."}</span>`));
    body.append(rowEl);
    start.disabled = !planIntent && !q.workspace_choice;
    start.title = start.disabled ? "Choose a workspace first" : "";
    start.onclick = guard(async () => {
      q.goal = q.goal.trim();
      if (planIntent) {
        // The draft key lives only inside this click — reset, fill, start;
        // the server deletes it on start. Nothing long-lived is shared, so
        // parallel windows of this loopback app cannot trample each other.
        await api("draft/reset", {draft: "quick-plan"});
        await api("draft", {draft: "quick-plan", mode: "planning", repo_path: q.repo_path,
          spec: q.goal, deadline: q.deadline.trim() || undefined,
          agents: RECOMMENDED_PLAN_TEAM.map(agent => ({...agent}))});
        const result = await api("start", {draft: "quick-plan"});
        S.quick = null;
        showLaunch(result);
        return;
      }
      const result = await api("quick-start", {
        repo_path:q.repo_path, goal:q.goal, deadline:q.deadline, preset:q.preset || undefined,
        agents: team.workflow ? undefined : RECOMMENDED_BUILD_TEAM.map(agent => ({...agent})),
        worktree_strategy:q.workspace_choice,
        existing_worktree_path:q.workspace_choice === "existing" ? q.existing_worktree_path : null,
      });
      S.quick = null;
      showLaunch(result);
    });
    return body;
  };

  const bodies = {repo: repoBody, workspace: workspaceBody, brief: briefBody, team: teamBody, ready: readyBody};
  const page = $(`<div class="asks"></div>`);
  page.append($(`<div class="page-head" style="margin-bottom:1.1rem"><div><div class="kicker">New session</div>
    <h1 style="margin-top:.4rem">${planIntent ? "Plan, then build" : "Start a session"}</h1></div></div>`));
  steps.forEach((step, index) => {
    const state = step.key === current ? "on" : (step.answered ? "done" : "todo");
    const section = $(`<section class="ask ${state}" data-ask="${step.key}"></section>`);
    const head = $(`<div class="ask-head">${state === "done" ? `<span class="ask-check">✓</span>` : ""}<span class="ask-num">${String(index + 1).padStart(2, "0")}</span>
      <span class="ask-q">${esc(state === "done" && step.short ? step.short : step.question)}</span></div>`);
    if (state === "done") {
      head.append($(`<span class="ask-answer">${step.answer}</span>`));
      if (!step.locked) {
        const change = $(`<button class="ask-change" type="button">Edit</button>`);
        change.onclick = () => { q.editStep = step.key; renderQuick(); };
        head.append(change);
      }
    }
    section.append(head);
    if (state === "on") section.append(bodies[step.key]());
    page.append(section);
  });
  app().append(page);
}

function copyText(value) {
  const fallback = () => {
    const field = document.createElement("textarea");
    field.value = value; field.style.position = "fixed"; field.style.opacity = "0";
    document.body.append(field); field.select(); document.execCommand("copy"); field.remove();
  };
  if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(value).catch(fallback);
  fallback(); return Promise.resolve();
}

async function refreshLaunch() {
  const result = await api("launch?session=" + encodeURIComponent(S.session));
  showLaunch(result);
}

function showLaunch(result) {
  stopClock();
  app().classList.remove("session-app");
  S.session = result.session.session_id;
  S.launch = result.launch;
  if (result.clone) S.launch.clone = result.clone;
  S.view = "launch";
  renderSideContext();
  renderLaunch(); listen();
}

async function openLaunch(id) {
  const result = await api("launch?session=" + encodeURIComponent(id));
  showLaunch(result);
}

function renderLaunch() {
  const l = S.launch, a = l.acknowledgments;
  app().innerHTML = "";
  const managed = l.managed || {readiness:{available:false,agents:[]},run:{phase:"not_started"}};
  const run = managed.run;
  const allManaged = managed.readiness.available;
  const heading = run.alive ? "Starting your agents" : (allManaged ? "Ready to launch" : "Connect your agents");
  const shell = $(`<div class="preflight">
    <div class="between"><div><div class="kicker">Preflight</div>
      <h1 style="margin-top:.35rem">${heading}</h1>
      <div class="small muted" style="margin-top:.35rem">${esc(l.agents.length)} agent${l.agents.length===1?"":"s"} · isolated worktree ready</div></div>
      <button class="ghost" id="refresh">Refresh</button></div>
    <div class="statusline"><b class="mono">${esc(run.phase.replaceAll("_"," "))}</b><span class="small muted">${esc(run.detail || (allManaged
      ? "Synchri can launch these agents for you."
      : "Use the prompts below for tools Synchri cannot launch yet."))}</span></div>
    ${l.clone ? `<div class="small muted" style="margin-top:.55rem">Repository cloned · <span class="mono">${esc(l.clone.path)}</span></div>` : ""}
    <div id="preflight-agents" class="checklist"></div>
    <div id="preflight-actions" class="actionbar"></div>
  </div>`);
  app().append(shell);
  document.getElementById("refresh").onclick = guard(refreshLaunch);

  if (allManaged) {
    const list = document.getElementById("preflight-agents");
    // Assembly indicators are real durable phase transitions, never a spinner
    // on a timer. They live from Start until every agent is officially ready,
    // then the room opens and they go away.
    const phasePills = {
      launching: ["launching", "warn"],
      injecting_bootstrap: ["injecting bootstrap", "warn"],
      awaiting_acknowledgment: ["awaiting acknowledgment", "warn"],
      ready: ["ready", "ok"],
      failed: ["failed", "bad"],
    };
    const failedAgents = l.agents.filter(agent => agent.join_phase === "failed");
    const allConnected = l.agents.every(agent => agent.connected);
    for (const agent of l.agents) {
      let status;
      if (agent.join_phase && phasePills[agent.join_phase]) {
        const [label, cls] = phasePills[agent.join_phase];
        status = `<span class="pill ${cls}">${esc(label)}</span>`;
      } else {
        status = agent.joined
          ? (agent.acknowledged ? `<span class="pill ok">ready</span>` : `<span class="pill warn">reading agreement</span>`)
          : `<span class="pill dim">${agent.connected ? "ready to launch" : "not started"}</span>`;
      }
      const failure = agent.join_phase === "failed" && agent.join_detail
        ? `<div class="small" style="margin-top:.3rem;color:var(--bad)">${esc(agent.join_detail)}</div>` : "";
      const beacon = agent.join_phase === "ready" || (agent.joined && agent.acknowledged) ? "ok"
        : agent.join_phase === "failed" ? "bad"
        : (agent.join_phase || agent.joined) ? "warn" : "";
      list.append($(`<div class="check-row"><div class="check-status">${status}</div>
        <div class="agent-avatar">${esc((agent.name || "?")[0])}<i class="beacon ${beacon}"></i></div>
        <div class="check-main"><div><b class="mono">${esc(agent.name)}</b>
        <span class="small muted" style="margin-left:.5rem">${esc(agent.role_label)} · ${esc(agent.launch_detail)}</span></div>${failure}</div></div>`));
    }
    const actions = document.getElementById("preflight-actions");
    const note = failedAgents.length
      ? `The room stays inactive. Ready agents stay attached and receive no work; retry relaunches only ${esc(failedAgents.map(a=>a.name).join(", "))}.`
      : (allConnected
        ? "No paste step — Synchri launches your agents, verifies their agreement, and begins the room."
        : "Synchri connects the agents, confirms the agreement, and opens the first build turn. The timer starts only after that.");
    const startLabel = run.alive ? "Starting…"
      : (failedAgents.length ? `Retry ${esc(failedAgents.map(a=>a.name).join(", "))}` : "Start my agents");
    const bar = $(`<div class="between" style="gap:1rem"><div class="row" style="min-width:0"><button class="ghost" id="external">Send prompts instead</button>
      <span class="small faint">${note}</span></div>
      <button class="primary" id="managed-start" ${run.alive?"disabled":""}>${startLabel}</button></div>`);
    bar.querySelector("#managed-start").onclick = guard(startManaged);
    bar.querySelector("#external").onclick = () => renderExternalSetup(l);
    actions.append(bar);
    if (run.alive) pollManagedLaunch();
    return;
  }
  renderExternalSetup(l);
}

async function startManaged() {
  await api("managed/start", {session:S.session});
  await refreshLaunch();
  pollManagedLaunch();
}

function pollManagedLaunch() {
  window.setTimeout(guard(async () => {
    if (S.view !== "launch" || !S.session) return;
    // Refresh the whole launch payload, not just the run: the per-agent join
    // phases (launching → injecting bootstrap → awaiting acknowledgment →
    // ready) are durable rows the indicators render from.
    const [status, launch] = await Promise.all([
      api("managed?session=" + encodeURIComponent(S.session)),
      api("launch?session=" + encodeURIComponent(S.session)),
    ]);
    S.launch = launch.launch;
    S.launch.managed = {readiness:status.readiness, run:status.managed};
    if (status.managed.phase === "working") { await openSession(S.session); return; }
    renderLaunch();
  }), 700);
}

function renderExternalSetup(l) {
  const a = l.acknowledgments;
  const external = l.agents.filter(agent => !agent.managed_ready || !l.managed.readiness.available);
  const list = document.getElementById("preflight-agents");
  const actions = document.getElementById("preflight-actions");
  if (!list || !actions) return;
  list.innerHTML = `<div class="small muted" style="padding:.65rem 0 .3rem">Paste one short prompt into each agent's terminal. It joins the room, reads the agreement, and stays available without status chatter.</div>`;
  for (const agent of l.agents) {
    const status = agent.joined
      ? (agent.acknowledged ? `<span class="pill ok">ready</span>` : `<span class="pill warn">reading agreement</span>`)
      : `<span class="pill dim">not connected</span>`;
    const beacon = agent.joined ? (agent.acknowledged ? "ok" : "warn") : "";
    const row = $(`<div class="check-row"><div class="check-status">${status}</div>
      <div class="agent-avatar">${esc((agent.name || "?")[0])}<i class="beacon ${beacon}"></i></div>
      <div class="check-main"><div><b class="mono">${esc(agent.name)}</b>
        <span class="small muted" style="margin-left:.5rem">${esc(agent.role_label)} · ${esc(agent.launch_detail)}</span></div>
        <details class="adv" ${agent.joined ? "" : "open"}><summary class="small muted">Manual connection fallback</summary>
          <pre>${esc(agent.setup_prompt)}</pre>
          <div class="row" style="margin-top:.55rem"><button class="primary" data-copy>Copy for ${esc(agent.name)}</button></div>
        </details></div></div>`);
    const setup = row.querySelector("[data-copy]");
    setup.onclick = guard(async () => { await copyText(agent.setup_prompt); setup.textContent = "Copied"; });
    list.append(row);
  }
  actions.innerHTML = "";
  const waiting = l.ready_to_activate
    ? "All agents joined and acknowledged the agreement."
    : `Waiting for: ${a.waiting.join(", ") || l.agents.filter(x=>!x.joined).map(x=>x.name).join(", ") || "an acknowledgement"}`;
  const bar = $(`<div class="between" style="gap:1rem"><div class="row" style="min-width:0"><button class="ghost" id="open">Open room</button>
    <span class="small faint">${esc(waiting)}</span></div>
    <button class="primary" id="activate" ${l.ready_to_activate?"":"disabled"}>Begin collaboration</button></div>`);
  bar.querySelector("#activate").onclick = guard(async () => {
    await api("activate", {session:S.session}); await openSession(S.session);
  });
  bar.querySelector("#open").onclick = guard(() => openSession(S.session));
  actions.append(bar);
}

/* ---------------------------------------------------------------- wizard */
async function newSession(resume) {
  stopClock();
  app().classList.remove("session-app");
  S.view = "wizard"; S.step = "repository";
  S.draft = resume ? await api("draft?draft=default")
                   : await api("draft/reset", { draft: "default" });
  if (!S.boot) S.boot = await api("bootstrap");
  // Reopening an unfinished wizard should land on the first thing still needed.
  if (resume && S.draft.draft.mode) {
    const steps = S.draft.steps.map(x => x.key);
    S.step = steps.find(k => k !== "review" && S.draft.problems.length &&
                              S.draft.problems.some(() => true) && !stepSatisfied(k)) || "review";
  }
  renderWizard();
}

function stepSatisfied(key) {
  const d = S.draft.draft;
  return ({ mode: !!d.mode, repository: !!d.repo_path, worktree: true,
            agents: d.agents.length > 0, permissions: true,
            spec: !!d.spec, deadline: true, review: true })[key] ?? true;
}

async function patch(body) {
  S.draft = await api("draft", { draft: "default", ...body });
  renderWizard();
}

function renderWizard() {
  const d = S.draft, steps = d.steps.length ? d.steps : [{key:"mode",label:"Choose how this session runs"}];
  app().innerHTML = "";
  const bar = $(`<div class="steps"></div>`);
  steps.forEach((st, i) => {
    const b = $(`<button class="${st.key === S.step ? "on" : (i < steps.findIndex(x=>x.key===S.step) ? "done":"")}">${i+1}. ${esc(st.label)}</button>`);
    b.disabled = !d.draft.mode && st.key !== "mode";
    b.onclick = () => { S.step = st.key; renderWizard(); };  // free back-navigation
    bar.append(b);
  });
  app().append(bar);
  ({ mode: stepMode, repository: stepRepo, worktree: stepTree, agents: stepAgents,
     permissions: stepPerms, spec: stepSpec, deadline: stepDeadline, review: stepReview
   }[S.step] || stepMode)();
  const idx = steps.findIndex(s => s.key === S.step);
  const nav = $(`<div class="between" style="margin-top:1.5rem"></div>`);
  const back = $(`<button ${idx <= 0 ? "disabled" : ""}>Back</button>`);
  back.onclick = () => { S.step = steps[idx-1].key; renderWizard(); };
  const next = $(`<button class="primary">${idx === steps.length-1 ? "" : "Next"}</button>`);
  if (idx < steps.length - 1) {
    next.onclick = guard(async () => {
      // Agent entries are the only wizard field edited locally before an
      // explicit save.  Persist them on Next as well: leaving step 4 must not
      // silently throw away the team the user just entered.
      if (S.step === "agents" && S.agentDraft) {
        S.draft = await api("draft", {
          draft: "default", agents: S.agentDraft.filter(agent => agent.name.trim())
        });
      }
      S.step = steps[idx+1].key; renderWizard();
    });
  }
  else next.className = "hide";
  nav.append(back, next);
  app().append(nav);
}

function stepMode() {
  const box = $(`<div class="stack"><h2>How should this session run?</h2></div>`);
  for (const m of S.boot.modes) {
    const b = $(`<button class="choice ${S.draft.draft.mode===m.mode?"on":""}">
      <b>${esc(m.label)}</b><span class="muted small">${esc(m.summary)}</span></button>`);
    b.onclick = guard(async () => { await patch({ mode: m.mode }); S.step = "repository"; renderWizard(); });
    box.append(b);
  }
  app().append(box);
}

async function stepRepo() {
  const box = $(`<div class="stack"><h2>Which repository?</h2>
    <div class="muted small">Synchri never changes your primary working copy — it makes an
    isolated one for the agents.</div></div>`);
  app().append(box);
  const cur = S.draft.repo_status;
  if (cur) {
    box.append($(`<div class="note"><b>${esc(cur.name)}</b> · branch <code>${esc(cur.branch)}</code>

/* ------------------------------------------------------------- dashboard */
async function openSession(id) {
  app().classList.add("session-app");
  S.view = "session"; S.session = id;
  if (isNarrow()) S.railCollapsed = true;
  // Refresh the sidebar's lists too, so a session created moments ago shows
  // up (and highlights) in Recent sessions.
  const [boot, dash] = await Promise.all([
    api("bootstrap"),
    api("dashboard?session=" + encodeURIComponent(id)),
  ]);
  S.boot = boot; S.dash = dash;
  S.tab = S.dash.session.status === "awaiting_ack" ? "contract" : "conversation";
  renderSession();
  listen();
}

/* The server watches and pushes; the client never polls. EventSource
   reconnects by itself, so a dropped connection self-heals. */
function listen() {
  if (S.es) { S.es.close(); S.es = null; }
  const q = S.session ? "?session=" + encodeURIComponent(S.session) : "";
  const es = new EventSource("/api/stream" + q);
  S.es = es;
  es.addEventListener("changed", async (e) => {
    const what = JSON.parse(e.data).what || [];
    try {
      if (S.view === "session") {
        S.dash = await api("dashboard?session=" + encodeURIComponent(S.session));
        // Room messages and Live Work arrive often. Repainting the whole
        // session made the page visibly jump and threw away scroll position.
        // Only structural session changes need a full layout rebuild.
        if (what.includes("sessions")) {
          renderSession();
        } else {
          refreshSessionChrome();
          const conversation = document.getElementById("conversation-panel");
          if (conversation) await paint("conversation", conversation);
          if (S.tab !== "conversation" && (what.includes("gates") || what.includes("conversation"))) {
            const detail = document.getElementById("detail-panel");
            if (detail) await paint(S.tab, detail);
          }
        }
      } else if (S.view === "launch" && S.session) {
        const result = await api("launch?session=" + encodeURIComponent(S.session));
        S.launch = result.launch; renderLaunch();
      } else if (S.view === "home" && what.includes("sessions")) {
        await home();
      } else if (S.view === "wizard" && what.includes("drafts")) {
        // Another tab edited this draft. Adopt it rather than diverge.
        const fresh = await api("draft?draft=default");
        if (fresh.version !== S.draft.version) { S.draft = fresh; renderWizard(); }
      }
    } catch (err) { /* transient; the next event will catch us up */ }
  });
  es.addEventListener("closing", () => { es.close(); S.es = null; setTimeout(listen, 500); });
  es.onerror = () => { /* EventSource retries on its own */ };
}

const DETAIL_TABS = ["plan","gates","dropbox","tests","changes","commits","worktree","memory","raw","contract","changelog"];

function timeboxText(deadline) {
  if (!deadline?.ends_at) return "Open-ended";
  const seconds = Math.ceil((Date.parse(deadline.ends_at) - Date.now()) / 1000);
  if (seconds <= 0) return "Timebox passed";
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  return `${String(hours).padStart(2,"0")}:${String(minutes).padStart(2,"0")}:${String(seconds % 60).padStart(2,"0")} remaining`;
}

function taskElapsed(startedAt) {
  if (!startedAt) return "just now";
  const seconds = Math.max(0, Math.floor((Date.now() - Date.parse(startedAt)) / 1000));
  const minutes = Math.floor(seconds / 60), rest = seconds % 60;
  return minutes ? `${minutes}m ${String(rest).padStart(2,"0")}s` : `${rest}s`;
}

function activeAgentTask(d) {
  const name = d.current_actor;
  if (!name || d.session.status !== "active") return null;
  const entries = d.activity_entries || d.activities || [];
  const note = [...entries].reverse().find(item => item.name === name);
  return {
    name,
    started_at: note?.created_at || d.active_turn?.started_at,
    summary: note?.summary || "Planning the next step. This can take a few minutes.",
    planning: !note,
  };
}

function timeboxNudge(d) {
  const deadline = d.session.deadline;
  if (!deadline?.ends_at || d.session.status !== "active") return "";
  const remaining = Math.ceil((Date.parse(deadline.ends_at) - Date.now()) / 1000);
  const total = Number(deadline.duration_seconds) || Math.max(1, Date.parse(deadline.ends_at) - Date.parse(deadline.started_at)) / 1000;
  if (remaining <= 0 || remaining > Math.max(15 * 60, total * .1) || S.dismissedTimebox === d.session.session_id) return "";
  return `<section class="timebox-nudge"><b>Timebox is getting close.</b> It guides pace only—agent work will not stop when it ends.
    <span class="row"><button data-extend="30 minutes">Add 30 min</button><button data-extend="1 hour">Add 1 hour</button><button class="ghost" data-dismiss-timebox>Keep current timebox</button></span></section>`;
}

function startClock(deadline, status) {
  stopClock();
  const tick = () => {
    const clock = document.getElementById("timebox");
    if (clock) clock.textContent = ["complete", "stopped", "failed", "timed_out"].includes(status)
      ? "Session ended" : timeboxText(deadline);
    document.querySelectorAll("[data-task-started]").forEach(node => {
      node.textContent = taskElapsed(node.dataset.taskStarted);
    });
  };
  tick();
  if ((deadline?.ends_at || status === "active") && !["complete", "stopped", "failed", "timed_out"].includes(status)) S.clock = setInterval(tick, 1000);
}

function stopClock() {
  if (S.clock) clearInterval(S.clock);
  S.clock = null;
}

/* The session rail lives in the global sidebar: one sidebar everywhere. */
function renderSessionRail(box) {
  const d = S.dash, s = d.session, g = d.gates.summary;
  const working = s.status === "active";
  const current = d.current_actor || (working ? "Waiting for the next turn" : s.status.replace("_", " "));
  const activeNotes = new Set((d.activities || []).map(note => note.name));
  const gatePercent = g.required ? Math.round((g.satisfied / g.required) * 100) : 0;
  const runtimeStates = d.participant_states || {};
  const team = s.participants.map(p => {
    const runtime = runtimeStates[p.name] || {};
    const trouble = TROUBLE_STATES.includes(runtime.state);
    const active = p.name === d.current_actor;
    const dot = trouble ? (runtime.state === "dropped" ? "bad" : "warn") : (active ? "live" : "");
    const label = trouble ? runtime.state.replaceAll("_", " ")
      : (activeNotes.has(p.name) ? "working" : (active ? "on point" : "waiting"));
    return `<div class="team-line" data-member="${esc(p.name)}"${runtime.detail ? ` title="${esc(runtime.detail)}"` : ""}><span class="presence"><i class="${dot}"></i>${esc(p.name)}</span>
      <span class="muted small" data-team-state${trouble ? ' style="color:var(--bad)"' : ""}>${esc(label)}</span></div>`;
  }).join("");
  const nav = ["conversation", ...DETAIL_TABS.filter(tab =>
    (tab !== "changelog" || s.status === "complete")
    && (tab !== "plan" || s.mode === "planning"))];
  box.innerHTML = "";
  const rail = $(`<div class="session-rail">
      <div><div class="kicker">Session</div><div class="rail-title">${esc(s.name)}</div></div>
      <div class="rail-status"><i id="rail-current-dot" class="led ${working ? "live" : ""}"></i><span id="rail-current">${esc(current)}</span></div>
      <div id="timebox" class="rail-clock mono">${esc(["complete", "stopped", "failed", "timed_out"].includes(s.status) ? "Session ended" : timeboxText(s.deadline))}</div>
      <div class="rail-progress"><div class="rail-progress-line"><span>Acceptance gates</span><b id="rail-gates">${esc(g.satisfied + "/" + g.required)}</b></div><span class="rail-progress-track"><i id="rail-gates-bar" style="width:${gatePercent}%"></i></span></div>
      <nav class="rail-nav" aria-label="Session tools">${nav.map(tab =>
        `<button data-tab="${tab}" class="${tab===S.tab?"on":""}">${tab === "conversation" ? "Conversation" : tab[0].toUpperCase()+tab.slice(1)}</button>`
      ).join("")}</nav>
      <div class="rail-team"><div class="kicker" style="margin-bottom:.35rem">Team</div>${team}</div>
      <div class="rail-controls">${s.status === "active" && d.managed?.readiness?.available ? `<button id="c-restart">Restart session</button>` : ""}${["active", "paused"].includes(s.status) ? `<button id="c-pause">${s.status==="active"?"Pause":"Resume"}</button>` : ""}${["active", "paused"].includes(s.status) ? `<button class="control-complete" id="c-complete">Complete session</button>` : ""}${!['complete','stopped','failed','timed_out'].includes(s.status) ? `<button class="control-stop" id="c-stop">Stop session</button>` : ""}</div>
    </div>`);
  box.append(rail);
  const pause = document.getElementById("c-pause");
  if (pause) pause.onclick = guard(() => runSessionControl(pause, s.status === "active" ? "pause" : "resume"));
  const complete = document.getElementById("c-complete");
  if (complete) complete.onclick = () => guard(async () => {
    if (S.dash?.gates?.summary?.complete) {
      if (!confirm("Complete this session? Synchri will verify its gates, close the room, and create the final changelog.")) return;
      await runSessionControl(complete, "complete");
      return;
    }
    showForceCompleteDialog(complete); })();
  const stop = document.getElementById("c-stop");
  if (stop) stop.onclick = () => guard(async () => {
    if (!confirm("Stop this session? Agents stop immediately. The worktree and all work stay.")) return;
    await runSessionControl(stop, "stop");
    confirmNotice("Session stopped. Agent processes are being shut down."); })();
  rail.querySelectorAll("[data-tab]").forEach(button => button.onclick = () => {
    S.tab = button.dataset.tab; renderSession();
  });
  const restart = document.getElementById("c-restart");
  if (restart) restart.onclick = () => guard(async () => {
    if (!confirm("Restart this session's agents? Synchri stops only the managed agent run, then relaunches it in the same room. Conversation, contract, worktree, and files stay exactly where they are.")) return;
    await runSessionControl(restart, "restart");
    confirmNotice("Session agents restarted. The room, history, and worktree were preserved.");
  })();
}

function renderActivityNote(d) {
  const activityTrail = d.activity_entries || d.activities || [];
  const currentActivity = activityTrail[activityTrail.length - 1];
  const previousActivities = activityTrail.slice(0, -1);
  const activeTask = activeAgentTask(d);
  const liveName = currentActivity?.name || activeTask?.name;
  const liveSummary = currentActivity?.summary || activeTask?.summary;
  const liveStarted = currentActivity?.created_at || activeTask?.started_at;
  return liveName ? `<details class="live-work" aria-live="polite"><summary>
      <span class="live-work-label">${esc(String(liveName).toUpperCase())} · ${activeTask?.planning ? "PLANNING" : "WORKING"} · <span data-task-started="${esc(liveStarted || "")}">${esc(taskElapsed(liveStarted))}</span></span>
      <span class="live-note"><span class="dot">●</span><span>${richInline(liveSummary)}</span></span>
    </summary>${previousActivities.length ? `<div style="margin-top:.3rem">${previousActivities.map(note =>
      `<div class="live-note"><span class="dot">●</span><b>${esc(String(note.name).toUpperCase())}</b><div>${rich(note.summary)}</div></div>`
    ).join("")}</div>` : ""}</details>` : `<section class="live-work" aria-live="polite"></section>`;
}

function renderLiveFeed(liveEvents, d) {
  // Group durable stream events by participant, then by provider invocation;
  // only a participant's newest, still-running invocation renders as a panel.
  const byParticipant = new Map();
  for (const event of liveEvents) {
    const invokes = byParticipant.get(event.participant) || new Map();
    const events = invokes.get(event.invoke_key) || [];
    events.push(event);
    invokes.set(event.invoke_key, events);
    byParticipant.set(event.participant, invokes);
  }
  const panels = [];
  for (const [name, invokes] of byParticipant) {
    let latest = null, latestId = -1;
    for (const events of invokes.values()) {
      const last = events[events.length - 1];
      if (last.event_id > latestId) { latestId = last.event_id; latest = events; }
    }
    if (!latest || latest.some(event => event.kind === "result")) continue;
    panels.push(feedPanel(name, latest));
  }
  // Runtimes without a stream (and quiet moments) keep the activity note.
  if (!panels.length) return renderActivityNote(d);
  return `<section class="live-feed" aria-live="polite">${panels.join("")}</section>`;
}

function feedPanel(name, events) {
  const started = events[0]?.created_at || "";
  const rows = events.slice(-40).map(feedRow).filter(Boolean).join("");
  const paths = [];
  for (const event of events) {
    if (event.kind === "file_edit" && event.file_path && !paths.includes(event.file_path)) {
      paths.push(event.file_path);
    }
  }
  const cards = paths.map(path => fileCardHtml(name, path)).join("");
  return `<div class="feed-panel">
    <div class="feed-head"><span class="dot">●</span><span>${esc(String(name).toUpperCase())} · WORKING · <span data-task-started="${esc(started)}">${esc(taskElapsed(started))}</span></span></div>
    <div class="feed-lines">${rows || `<div class="feed-line status muted">Starting up…</div>`}</div>${cards}</div>`;
}

function feedRow(event) {
  const kind = event.kind;
  if (kind === "usage" || kind === "result") return "";
  if (kind === "file_edit") {
    return `<div class="feed-line file mono">✎ ${esc(event.title || event.file_path || "")}</div>`;
  }
  if (kind === "command") {
    const exit = event.payload && event.payload.exit_code !== undefined && event.payload.exit_code !== null
      ? ` <span class="faint">· exit ${esc(String(event.payload.exit_code))}</span>` : "";
    return `<div class="feed-line command mono">${esc(event.title || "")}${exit}</div>`;
  }
  if (kind === "thinking") {
    const detail = event.detail || "";
    const body = richInline(detail);
    const long = detail.length > 280 || detail.split("\n").length > 3;
    return `<div class="feed-line thinking">${long ? clampBlock(`<span>${body}</span>`, 3) : body}</div>`;
  }
  if (kind === "compaction") {
    return `<div class="feed-line compaction"><span class="pill dim">${esc((event.title || "Context compacted").toUpperCase())}</span></div>`;
  }
  if (kind === "error") {
    return `<div class="feed-line error">${esc(event.title || "Error")}${event.detail ? ` <span class="faint">— ${esc(event.detail.split("\n")[0])}</span>` : ""}</div>`;
  }
  if (kind === "tool") {
    return `<div class="feed-line tool">${esc(event.title || "tool")}${event.detail ? ` <span class="faint">· ${esc(event.detail)}</span>` : ""}</div>`;
  }
  return `<div class="feed-line status">${richInline(event.title || "")}</div>`;
}

function fileCardHtml(agent, path) {
  const open = S.openFileCards.has(agent + ":" + path);
  const cached = S.fileCardCache.get(path);
  return `<details class="file-card" data-agent="${esc(agent)}" data-path="${esc(path)}"${open ? " open" : ""}>
    <summary><span class="mono file-card-path">${esc(path)}</span><span class="file-card-stats small faint">${cached ? esc(cached.stats) : ""}</span></summary>
    <pre class="diff file-card-diff">${cached ? cached.html : '<span class="muted small">Loading the diff…</span>'}</pre>
  </details>`;
}

async function loadFileCard(card) {
  const path = card.dataset.path;
  const cached = S.fileCardCache.get(path);
  const now = Date.now();
  if (cached && now - cached.at < 3000) { applyFileCard(card, cached); return; }
  try {
    const r = await api(`diff/file?session=${encodeURIComponent(S.session)}&path=${encodeURIComponent(path)}`);
    const entry = {
      at: now,
      html: r.diff ? renderDiff(r.diff) : '<span class="muted small">No changes in this file yet.</span>',
      stats: `+${r.insertions || 0} −${r.deletions || 0}${r.truncated ? " · truncated" : ""}`,
    };
    S.fileCardCache.set(path, entry);
    applyFileCard(card, entry);
  } catch (error) {
    const body = card.querySelector(".file-card-diff");
    if (body) body.innerHTML = `<span class="muted small">${esc(error.message)}</span>`;
  }
}

function applyFileCard(card, entry) {
  const body = card.querySelector(".file-card-diff");
  const stats = card.querySelector(".file-card-stats");
  if (body) body.innerHTML = entry.html;
  if (stats) stats.textContent = entry.stats;
}

async function downloadSessionPackage(button) {
  const label = button.textContent;
  button.disabled = true;
  button.textContent = "Preparing…";
  try {
    if (window.__TAURI__?.core?.invoke) {
      // Anchor downloads are unreliable in the desktop webview; save the zip
      // next to the room's other artifacts and say where it went.
      const saved = await api("package/save", {session: S.session});
      confirmNotice(`Session package saved to ${saved.path}`);
    } else {
      const response = await fetch(`/api/package?session=${encodeURIComponent(S.session)}`, {
        headers: {"X-Synchri-Token": TOKEN},
      });
      if (!response.ok) throw new Error("The session package could not be prepared.");
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = (response.headers.get("Content-Disposition") || "")
        .match(/filename="([^"]+)"/)?.[1] || "synchri-session.zip";
      document.body.append(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
  } catch (error) {
    flash(error);
  } finally {
    button.disabled = false;
    button.textContent = label;
  }
}

function commitUrl(remote, sha) {
  // Only GitHub remotes become links; anything else stays plain text.
  if (!remote || !sha) return null;
  let cleaned = String(remote).trim().replace(/\.git$/, "").replace(/\/+$/, "");
  const githubOrigin = "https" + "://github.com/";
  if (cleaned.startsWith("git@github.com:")) {
    cleaned = githubOrigin + cleaned.slice("git@github.com:".length);
  } else if (cleaned.startsWith("ssh" + "://git@github.com/")) {
    cleaned = githubOrigin + cleaned.slice(("ssh" + "://git@github.com/").length);
  }
  if (!/^https:\/\/github\.com\/[^/]+\/[^/]+$/.test(cleaned)) return null;
  return `${cleaned}/commit/${sha}`;
}

function composerHint(d) {
  const actor = d.current_actor;
  if (actor && actor !== "human") return `${actor} has the floor — your message interrupts`;
  if (actor === "human") return "The agents are waiting on your reply";
  return "Your message reaches the agent leading the work";
}

// Failure discrimination surfaces in the chat as distinct, honest states —
// the "failed"/"timed_out" entries keep pre-classification rows readable.
const TROUBLE_STATES = ["failed", "timed_out", "dropped",
  "auth_failure", "provider_refusal", "crash", "unresponsive"];
const TROUBLE_LABELS = {
  dropped: "stopped responding and was dropped",
  timed_out: "timed out",
  failed: "failed",
  auth_failure: "is signed out of its provider — sign in again in your terminal, then restart it",
  provider_refusal: "was refused or rate-limited by its provider",
  crash: "crashed",
  unresponsive: "became unresponsive and its processes were ended",
};

function agentAlerts(d) {
  const states = d.participant_states || {};
  const blocks = Object.entries(states).map(([name, runtime]) => {
    if (!runtime || !runtime.state) return "";
    if (TROUBLE_STATES.includes(runtime.state)) {
      const label = TROUBLE_LABELS[runtime.state] || runtime.state.replaceAll("_", " ");
      return `<div class="agent-alert"><div><b>${esc(name)}</b> ${esc(label)}${runtime.detail ? ` — ${esc(runtime.detail)}` : ""}.</div>
        <button data-restart="${esc(name)}">Restart ${esc(name)}</button></div>`;
    }
    if (runtime.state === "active" && runtime.detail && runtime.detail.includes("refusing")) {
      return `<div class="agent-alert warn"><div><b>${esc(name)}</b> ${esc(runtime.detail)}.</div>
        <button class="ghost" data-restart="${esc(name)}">Restart ${esc(name)}</button></div>`;
    }
    return "";
  }).filter(Boolean);
  return blocks.length ? `<div class="agent-alerts">${blocks.join("")}</div>` : "";
}

async function runSessionControl(button, action, extra = {}) {
  const label = button.textContent;
  button.disabled = true;
  button.textContent = action === "complete" ? "Verifying…" : `${action[0].toUpperCase()+action.slice(1)}…`;
  try {
    S.dash = await api("control", {session:S.session, action, ...extra});
    renderSession();
  } catch (error) {
    button.disabled = false;
    button.textContent = label;
    throw error;
  }
}

function showForceCompleteDialog(button) {

    <div class="kicker">COMPLETE SESSION</div>
    <h2>${blockers.length === 1 ? "One acceptance gate is" : blockers.length + " acceptance gates are"} not satisfied</h2>
    <p class="muted small" style="margin:.2rem 0 0">Completing now waives what remains. Each waiver is recorded on its gate and in the final changelog, so the delivery record stays honest.</p>
    <div class="note warn small" style="margin:.4rem 0 0"><div class="mono">${blockers.map(esc).join("<br>")}</div></div>
    <div class="row"><button class="primary" data-force>Complete anyway — waive ${blockers.length === 1 ? "the gate" : blockers.length + " gates"}</button><button data-review>Review gates</button><button class="ghost" data-close>Cancel</button></div>
  </div>`);

function refreshSessionChrome() {
  const d = S.dash, s = d.session, g = d.gates.summary;
  const current = d.current_actor || (s.status === "active" ? "Waiting for the next turn" : s.status.replace("_", " "));
  const activeNotes = new Set((d.activities || []).map(note => note.name));
  const currentEl = document.getElementById("rail-current");
  if (currentEl) currentEl.textContent = current;
  const dot = document.getElementById("rail-current-dot");
  if (dot) dot.classList.toggle("live", s.status === "active");
  const gateText = document.getElementById("rail-gates");
  if (gateText) gateText.textContent = `${g.satisfied}/${g.required}`;
  const chatGates = document.getElementById("chat-gates");
  if (chatGates) chatGates.textContent = `${g.satisfied}/${g.required}`;
  const gateBar = document.getElementById("rail-gates-bar");
  if (gateBar) gateBar.style.width = `${g.required ? Math.round((g.satisfied / g.required) * 100) : 0}%`;
  const runtimeStates = d.participant_states || {};
  document.querySelectorAll(".team-line[data-member]").forEach(row => {
    const name = row.dataset.member;
    const active = name === d.current_actor;
    const runtime = runtimeStates[name] || {};
    const trouble = TROUBLE_STATES.includes(runtime.state);
    const state = row.querySelector("[data-team-state]");
    if (state) {
      state.textContent = trouble ? runtime.state.replaceAll("_", " ")
        : (activeNotes.has(name) ? "working" : (active ? "on point" : "waiting"));
      state.style.color = trouble ? "var(--bad)" : "";
    }
    const presence = row.querySelector(".presence i");
    if (presence) {
      presence.classList.toggle("live", active && !trouble);
      presence.classList.toggle("warn", trouble && runtime.state !== "dropped");
      presence.classList.toggle("bad", runtime.state === "dropped");
    }
    if (runtime.detail) row.title = runtime.detail; else row.removeAttribute("title");
  });
}

async function paint(tab, el) {
  const q = "?session=" + encodeURIComponent(S.session);
  const d = S.dash;
  if (tab === "conversation") {
    const previousInput = el.querySelector("#mm");
    const draftValue = previousInput?.value || "";
    const draftFocused = document.activeElement === previousInput;
    const caretStart = previousInput?.selectionStart ?? draftValue.length;
    const caretEnd = previousInput?.selectionEnd ?? draftValue.length;
    const r = await api("conversation" + q);
    const liveWork = renderLiveFeed(r.live_events || [], d);
    const messages = r.messages.length ? r.messages.map(m => {
      const speaker = m.metadata?.source === "session_activation" ? "SYNCHRI"
        : (m.sender === "human" ? "YOU" : String(m.sender).toUpperCase());
      const responseState = m.message_type === "response"
        ? `${String(m.response_status || "complete").toUpperCase()} RESPONSE` : "";
      const kind = speaker === "SYNCHRI" ? "system" : (speaker === "YOU" ? "you" : "");
      const recipient = m.target && speaker !== "SYNCHRI"
        ? `→ ${String(m.target).toUpperCase()}` : "";
      const approvalText = m.metadata?.approval_request || "This agent needs your decision before it can continue.";
      const approvalCapability = m.metadata?.approval_capability || "";
      const decision = m.target === "human" && m.response_status === "blocked" && speaker !== "YOU"
        ? `<div class="decision-actions"><span class="small muted">${esc(approvalText)}</span><div><button data-decision="approve" data-agent="${esc(m.sender)}" data-capability="${esc(approvalCapability)}" data-detail="${esc(approvalText)}">Approve</button><button data-decision="deny" data-agent="${esc(m.sender)}" data-capability="${esc(approvalCapability)}" data-detail="${esc(approvalText)}">Deny</button></div></div>` : "";
      const hue = kind ? "" : ` ${hueFor(m.sender)}`;
      return `<div class="msg ${kind}"><div class="msg-head"><span class="who${hue}">${esc(speaker)}</span>${recipient ? `<span class="to">${esc(recipient)}</span>` : ""}<span class="when mono">${esc(fmtClock(m.timestamp))}</span></div>
        <div class="body">${rich(m.content)}</div>
        ${responseState ? `<div class="response-state">${esc(responseState)}</div>` : ""}
        ${m.handoff_target ? `<div class="handoff">HANDOFF → ${esc(m.handoff_target)}</div>` : ""}${decision}</div>`;
    }).join("") : `<span class="muted small">Nothing said yet.</span>`;
    el.innerHTML = `<div class="message-list">${messages}</div>` + liveWork + agentAlerts(d) + timeboxNudge(d);
    const list = el.querySelector(".message-list");
    requestAnimationFrame(() => list.scrollTo({ top: list.scrollHeight, behavior: "smooth" }));
    el.querySelectorAll(".feed-lines").forEach(lines => { lines.scrollTop = lines.scrollHeight; });
    el.querySelectorAll("details.file-card[data-path]").forEach(card => {
      card.addEventListener("toggle", () => {
        const key = card.dataset.agent + ":" + card.dataset.path;
        if (card.open) { S.openFileCards.add(key); loadFileCard(card); }
        else S.openFileCards.delete(key);
      });
      if (card.open) loadFileCard(card);
    });
    el.querySelectorAll("[data-restart]").forEach(button => button.onclick = guard(async () => {
      button.disabled = true;
      button.textContent = "Restarting…";
      S.dash = await api("control", {session: S.session, action: "restart_agent",
                                     participant: button.dataset.restart});
      renderSession();
    }));
    if (d.session.status !== "active") {
      const closed = d.session.status === "complete"
        ? "Session complete — the final changelog is available in the rail."
        : `Session ${d.session.status.replace("_", " ")} — messaging is closed.`;
      const terminal = ["complete", "stopped", "failed", "timed_out"].includes(d.session.status);
      const strip = $(`<div class="chat-compose muted small" style="display:flex;align-items:center;justify-content:space-between;gap:.8rem"><span>${esc(closed)}</span>${terminal ? `<button class="ghost" data-package style="flex:none">Download session package</button>` : ""}</div>`);
      strip.querySelector("[data-package]")?.addEventListener("click", event => downloadSessionPackage(event.target));
      el.append(strip);
      return;
    }
    const send = $(`<div class="chat-compose"><div class="composer">
      <textarea id="mm" rows="1" placeholder="Message the agents — Enter to send, Shift+Enter for a new line" autocomplete="off"></textarea>
      <div class="composer-bar"><span class="composer-hint small faint">${esc(composerHint(d))}</span>
        <button class="primary composer-send" id="ms" aria-label="Send" title="Send">↑</button></div>
    </div></div>`);
    el.append(send);
    const input = send.querySelector("#mm");
    const grow = () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    };
    input.value = draftValue;
    grow();
    if (draftFocused) {
      input.focus();
      input.setSelectionRange(caretStart, caretEnd);
    }
    input.addEventListener("input", grow);
    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        send.querySelector("#ms").click();
      }
    });
    send.querySelector("#ms").onclick = guard(async () => {
      const v = input.value.trim(); if (!v) return;
      input.value = "";
      grow();
      await api("message", { session: S.session, content: v, interrupt: true });
      paint("conversation", el);
    });
    el.querySelectorAll("[data-decision]").forEach(button => button.onclick = guard(async () => {
      const approved = button.dataset.decision === "approve";
      const target = button.dataset.agent;
      await api("approval", {
        session: S.session,
        target,
        approved,
        capability: button.dataset.capability,
        detail: button.dataset.detail,
      });
      paint("conversation", el);
    }));
    el.querySelectorAll("[data-extend]").forEach(button => button.onclick = guard(async () => {
      await api("control", {session:S.session, action:"extend_deadline", duration:button.dataset.extend});
      S.dash = await api("dashboard" + q); renderSession();
    }));
    el.querySelector("[data-dismiss-timebox]")?.addEventListener("click", () => {
      S.dismissedTimebox = d.session.session_id; paint("conversation", el);
    });
  } else if (tab === "changelog") {
    const r = await api("changelog" + q);
    el.innerHTML = `<div class="between" style="margin-bottom:.9rem"><span class="small muted">The verified delivery record for this session.</span><button class="primary" id="package-download">Download session package</button></div><div class="rich">${rich(r.markdown)}</div>`;
    el.querySelector("#package-download").onclick = event => downloadSessionPackage(event.target);
  } else if (tab === "plan") {
    const p = await api("plan" + q);
    const statusPill = p.status === "ready" ? `<span class="pill ok">PLAN-READY</span>`
      : p.status === "approved" ? `<span class="pill ok">approved</span>`
      : p.status === "needs_human_resolution" ? `<span class="pill warn">needs you</span>`
      : `<span class="pill dim">${esc(p.status.replace(/_/g," "))}</span>`;
    const b = p.budgets;
    const chip = o => o.classification === "blocking" || o.classification === "fork"
      ? `<span class="pill bad">${esc(o.classification)}</span>`
      : `<span class="pill dim">${esc(o.classification)}</span>`;
    const openRows = p.open_objections.map(o => `<div class="card" data-objection="${esc(o.objection_id)}">
        <div class="between"><div><b class="mono">${esc(o.objection_id)}</b> ${chip(o)}
          <span class="small muted">r${o.raised_revision} · ${esc(o.raised_by)}</span></div>
          ${(o.classification === "blocking" || o.classification === "fork") && ["ready","awaiting_review","under_revision","drafting","needs_human_resolution"].includes(p.status)
            ? `<button class="ghost objection-waive">Waive…</button>` : ""}</div>
        <div class="small" style="margin-top:.35rem">${esc(o.text)}</div></div>`).join("");
    const settledRows = p.resolved_objections.map(o => `<div class="small muted" style="margin-top:.3rem">
        <b class="mono">${esc(o.objection_id)}</b> ${esc(o.classification)} · ${esc(o.status)}${o.resolved_by==="human"?" by you":""}
        — ${esc(o.disposition || o.text)}</div>`).join("");
    el.innerHTML = `
      <div class="between"><div><b class="mono">${esc(p.plan_id)}</b> ${statusPill}
        <span class="small muted">revision ${p.revision} · baseline ${esc((p.inspection_sha||"").slice(0,12))}</span>
        <div class="small muted" style="margin-top:.25rem">budgets: ${b.turns_used}/${b.turn_budget} turns ·
          ${b.revisions_used}/${b.revision_budget} revisions · ${b.minutes_budget} min${b.resumes_used?" (resumed once)":""}</div></div>
        <div class="row">
          ${p.status === "ready" ? `<button class="primary" id="plan-approve">Approve &amp; Start Coordination</button>` : ""}
          ${p.status === "needs_human_resolution" && b.resume_available ? `<button class="primary" id="plan-resume">Resume the budget (once)</button>` : ""}
          ${p.status === "approved" && p.promotion?.coordination_session_id ? `<button class="primary" id="plan-open-coordination">Open the coordination session</button>` : ""}
          ${["ready","awaiting_review","under_revision","drafting","needs_human_resolution"].includes(p.status) ? `<button id="plan-reopen">Request changes…</button>` : ""}
        </div></div>
      ${p.status === "ready" ? `<div class="note small" style="margin-top:.8rem">Review closure reached: no blocking objections or open forks remain.
        Approval creates a new linked coordination session branched from the inspected baseline — the plan and this session stay immutable.</div>` : ""}
      ${p.status === "needs_human_resolution" ? `<div class="note warn small" style="margin-top:.8rem">The planning budget is exhausted. The latest draft and its open objections are preserved below.</div>` : ""}
      <details style="margin-top:.9rem"><summary class="small muted" style="cursor:pointer">Your idea, verbatim</summary>
        <pre style="margin-top:.5rem;max-height:14rem;overflow:auto">${esc(p.idea)}</pre></details>
      ${p.open_objections.length ? `<h3 class="small muted" style="margin-top:1rem">OPEN OBJECTIONS &amp; FORKS</h3><div class="stack" style="margin-top:.5rem">${openRows}</div>` : ""}
      ${settledRows ? `<h3 class="small muted" style="margin-top:1rem">RESOLVED &amp; WAIVED</h3>${settledRows}` : ""}
      ${p.acceptance_criteria.length ? `<h3 class="small muted" style="margin-top:1rem">ACCEPTANCE CRITERIA → GATES</h3>
        <table style="margin-top:.4rem"><tbody>${p.acceptance_criteria.map(c =>
          `<tr><td class="mono">${esc(c.gate_id)}</td><td class="small">${esc(c.description)}</td></tr>`).join("")}</tbody></table>` : ""}
      ${p.latest_body ? `<h3 class="small muted" style="margin-top:1rem">PLAN — REVISION ${p.revision}</h3>
        <div class="rich" style="margin-top:.5rem;max-height:32rem;overflow:auto">${rich(p.latest_body)}</div>`
        : `<div class="muted" style="margin-top:1rem">No revision submitted yet — the planner drafts first.</div>`}`;
    const approve = el.querySelector("#plan-approve");
    if (approve) approve.onclick = guard(async () => {
      approve.disabled = true; approve.textContent = "Provisioning…";
      const result = await api("plan/approve", { session: S.session });
      confirmNotice(`${p.plan_id} approved — coordination session created.`);
      await openSession(result.coordination_session_id);
    });
    const resume = el.querySelector("#plan-resume");
    if (resume) resume.onclick = guard(async () => {
      await api("plan/control", { session: S.session, action: "resume_budget" });
      S.dash = await api("dashboard" + q); await paint("plan", el);
    });
    const openCoordination = el.querySelector("#plan-open-coordination");
    if (openCoordination) openCoordination.onclick = guard(async () => {
      await openSession(p.promotion.coordination_session_id);
    });
    const reopen = el.querySelector("#plan-reopen");
    if (reopen) reopen.onclick = guard(async () => {
      const note = prompt("What should change in the plan?");
      if (!note || !note.trim()) return;
      await api("plan/control", { session: S.session, action: "reopen", note });
      S.dash = await api("dashboard" + q); await paint("plan", el);
    });
    el.querySelectorAll(".objection-waive").forEach(button => button.onclick = guard(async () => {
      const objectionId = button.closest("[data-objection]").dataset.objection;
      const note = prompt(`Waive ${objectionId} — your reason goes on the record, and the plan returns to review:`);
      if (!note || !note.trim()) return;
      await api("plan/control", { session: S.session, action: "waive_objection", objection_id: objectionId, note });
      S.dash = await api("dashboard" + q); await paint("plan", el);
    }));
  } else if (tab === "gates") {
    const r = await api("gates" + q);
    const editable = !["complete", "stopped", "failed", "timed_out"].includes(d.session.status);
    el.innerHTML = r.gates.length ? `<div class="between"><div><b>${r.summary.satisfied}/${r.summary.required} verified</b>
      <div class="small muted">Agents report evidence here as they work. You can correct or override any gate.</div></div></div>
      <div class="stack" style="margin-top:1rem">${r.gates.map(x=>`<div class="card gate-card" data-gate="${esc(x.gate_id)}">
        <div class="between"><div><b class="mono">${esc(x.gate_id)}</b><div class="small" style="margin-top:.18rem">${esc(x.description)}</div></div>
          <select class="gate-status" ${editable?"":"disabled"}>${["pending","in_progress","pass","fail","unverified","waived"].map(status => `<option value="${status}" ${x.status===status?"selected":""}>${status.replace("_"," ")}</option>`).join("")}</select></div>
        <div class="small muted" style="margin-top:.65rem">${esc([...x.evidence,...x.tests,...x.commits].join(" · ") || "No evidence recorded yet.")}</div>
        <div class="small muted" style="margin-top:.25rem">Builder: ${esc(x.builder_assessment || "not recorded")} · Reviewer: ${esc(x.reviewer_assessment || "not recorded")}</div>
        ${editable?`<details style="margin-top:.65rem"><summary class="small muted" style="cursor:pointer">Add evidence or override</summary><div class="grid" style="margin-top:.55rem"><input class="gate-evidence mono" placeholder="Evidence, test, or commit"><input class="gate-builder" placeholder="Builder assessment"><input class="gate-reviewer" placeholder="Reviewer assessment"><button class="primary gate-save">Save gate</button></div></details>`:""}
        ${x.blocker?`<div class="small" style="color:var(--warn);margin-top:.55rem">${esc(x.blocker)}</div>`:""}</div>`).join("")}</div>
      <div class="small muted" style="margin-top:.9rem">A gate passes only with evidence and both sign-offs. ${esc(r.summary.blockers.join("; ")||"")}</div>${gateAddForm(editable)}`
      : `<span class="muted">No gates defined yet.</span>${gateAddForm(editable)}`;
    document.getElementById("gate-new-save")?.addEventListener("click", guard(async () => {
      const gateId = document.getElementById("gate-new-id").value.trim();
      const description = document.getElementById("gate-new-description").value.trim();
      await api("gate", {session:S.session, add:{gate_id:gateId, description}});
      S.dash = await api("dashboard" + q); await paint("gates", el);
      confirmNotice(`Added ${gateId.toUpperCase()}.`);
    }));
    if (editable) el.querySelectorAll(".gate-card").forEach(card => {
      const id = card.dataset.gate;
      card.querySelector(".gate-status").onchange = guard(async event => {
        await api("gate", {session:S.session, gate_id:id, status:event.target.value, actor:"human"});
        S.dash = await api("dashboard" + q); await paint("gates", el);
      });
      const save = card.querySelector(".gate-save");
      if (save) save.onclick = guard(async () => {
        const evidence = card.querySelector(".gate-evidence").value.trim();
        const builder = card.querySelector(".gate-builder").value.trim();
        const reviewer = card.querySelector(".gate-reviewer").value.trim();
        const payload = {session:S.session, gate_id:id, actor:"human"};
        if (evidence) payload.evidence = [evidence];
        if (builder) payload.builder_assessment = builder;
        if (reviewer) payload.reviewer_assessment = reviewer;
        await api("gate", payload);
        S.dash = await api("dashboard" + q); await paint("gates", el); confirmNotice(`Updated ${id}.`);
      });
    });
  } else if (tab === "dropbox") {
    const r = await api("dropbox" + q);
    const terminal = ["complete","stopped","failed","timed_out"].includes(d.session.status);
    const captureOpen = !r.frozen && !terminal;
    const phaseNote = r.phase === "original_work"
      ? "Side ideas land here without interrupting the agents. Each is investigated off the critical path, appended after the specification — never written into it — and explicitly evaluated once the original task is complete."
      : r.phase === "appendix_evaluation"
        ? "Capture is frozen — the original work is complete, and both agents now owe every item below an explicit evaluation."
        : r.phase === "extension_work"
          ? "Approved extensions are being implemented, in appendix order. The session closes when every extension gate passes."
          : "Capture is frozen.";
    const lifecycle = entry => {
      if (entry.disposition === "approved")
        return `<span class="pill ok">approved → ${esc(entry.extension_id || "EXT")}</span>`;
      if (entry.disposition === "declined") return `<span class="pill dim">declined</span>`;
      if (entry.disposition === "waived") return `<span class="pill warn">waived</span>`;
      if (entry.status === "failed" || entry.status === "timed_out")
        return `<span class="pill bad">${esc(entry.status.replace("_", " "))}</span>`;
      return `<span class="pill dim">${esc(entry.status)}</span>`;
    };
    const clip = (text, max) => {
      const flat = String(text || "").trim();
      return flat.length > max ? flat.slice(0, max - 1) + "…" : flat;
    };
    const evaluations = entry => ["builder", "reviewer", "human"].map(slot => {
      const value = (entry.evaluations || {})[slot];
      return value ? `<div class="small muted">${esc(slot)} (${esc(value.participant || "")}):
        <b>${esc(value.verdict || "")}</b>${value.rationale ? ` — ${esc(clip(value.rationale, 240))}` : ""}</div>` : "";
    }).join("");
    const card = entry => {
      const proposal = entry.proposal || {};
      const review = entry.review || {};
      const stat = (proposal.diffstat || "").split("\n").map(line => line.trim()).filter(Boolean).slice(-1)[0];
      return `<div class="card">
        <div class="between"><div><b class="mono">${esc(entry.drop_id)}</b> <span class="small">${esc(entry.title)}</span>
          <div class="small muted" style="margin-top:.18rem">${esc(clip(entry.prompt, 220))}</div></div>
          ${lifecycle(entry)}</div>
        ${proposal.recommendation ? `<div class="small" style="margin-top:.55rem"><b>Scout:</b> ${esc(clip(proposal.recommendation, 300))}</div>` : ""}
        ${stat ? `<div class="small muted mono" style="margin-top:.25rem">${esc(stat)}</div>` : ""}
        ${proposal.patch_note ? `<div class="small" style="color:var(--warn);margin-top:.25rem">${esc(proposal.patch_note)}</div>` : ""}
        ${review.verdict ? `<div class="small muted" style="margin-top:.25rem">Adversarial review: <b>${esc(review.verdict)}</b>${review.critique ? ` — ${esc(clip(review.critique, 240))}` : ""}</div>`
          : entry.skip_review ? `<div class="small muted" style="margin-top:.25rem">Adversarial review skipped by your explicit choice.</div>` : ""}
        ${entry.failure_report ? `<div class="small" style="color:var(--warn);margin-top:.25rem">${esc(clip(entry.failure_report, 300))}</div>` : ""}
        ${evaluations(entry)}
      </div>`;
    };
    el.innerHTML = `<div class="small muted">${esc(phaseNote)}</div>
      ${r.items.length ? `<div class="small muted" style="margin-top:.5rem">${r.summary.total} item(s) · ${r.summary.open} open · ${r.summary.approved} approved · ${r.summary.declined} declined${r.summary.waived ? ` · ${r.summary.waived} waived` : ""}</div>` : ""}
      ${captureOpen ? `<div class="card" style="margin-top:1rem"><b class="small">Add a side task</b>
        <div class="small muted" style="margin-top:.2rem">Captured without interrupting the agents. A scout investigates it in a disposable scratch worktree; nothing lands without both agents' approval after the original task.</div>
        <textarea id="drop-prompt" rows="3" placeholder="What should the scout investigate?" style="margin-top:.55rem;width:100%"></textarea>
        <div class="between" style="margin-top:.55rem">
          <label class="small muted" style="display:flex;align-items:center;gap:.4rem"><input type="checkbox" id="drop-skip-review"> Skip the adversarial review for this item</label>
          <button class="primary" id="drop-add">Add to dropbox</button></div></div>` : ""}
      <div class="stack" style="margin-top:1rem">${r.items.map(card).join("") || `<span class="muted">Nothing captured yet.</span>`}</div>`;
    const add = el.querySelector("#drop-add");
    if (add) add.onclick = guard(async () => {
      const prompt = el.querySelector("#drop-prompt").value.trim();
      if (!prompt) { flash("Describe the side task first."); return; }
      const result = await api("dropbox/capture", {
        session: S.session, prompt,
        skip_review: el.querySelector("#drop-skip-review").checked,
      });
      await paint("dropbox", el);
      confirmNotice(result.queued
        ? "Captured — it will enter the coordination session's dropbox as provisioning finishes."
        : result.investigating
          ? `Captured ${result.item.drop_id} — the scout is investigating.`
          : `Captured ${result.item.drop_id}. It will be evaluated at completion; connect an agent to investigate it sooner.`);
    });
  } else if (tab === "tests") {
    const t = d.tests;
    el.innerHTML = `<div class="between"><div>
      ${t ? `<div class="stat-num">${t.passed} <span class="muted" style="font-size:13px">passed</span>${t.failed?`&ensp;<span style="color:var(--bad)">${t.failed}</span> <span class="muted" style="font-size:13px">failed</span>`:""}</div>
             <div class="small muted mono" style="margin-top:.3rem">${esc(t.command)} · exit ${t.exit_code}</div>`
          : `<span class="muted">Not run yet.</span>`}
      </div><button class="primary" id="rt">Run tests</button></div>
      ${t && t.output_tail ? `<pre style="margin-top:1rem;max-height:22rem;overflow:auto">${esc(t.output_tail)}</pre>` : ""}
      ${!d.test_command ? `<div class="note warn small" style="margin-top:1rem">No test command
        detected. Set one to collect evidence.</div>` : ""}`;
    el.querySelector("#rt").onclick = guard(async () => {
      el.innerHTML = `<span class="muted">Running…</span>`;
      await api("tests/run", { session: S.session });
      S.dash = await api("dashboard" + q); renderSession();
    });
  } else if (tab === "changes") {
    const r = await api("changes/files" + q);
    const files = r.files || [];
    const adds = files.reduce((total, f) => total + (f.insertions || 0), 0);
    const dels = files.reduce((total, f) => total + (f.deletions || 0), 0);
    el.innerHTML = `<div class="small muted mono">${files.length} file(s) ·
      <span style="color:var(--diff-add)">+${adds}</span> <span style="color:var(--diff-del)">−${dels}</span></div>` +
      (files.length ? `<div class="stack" style="margin-top:.8rem">${files.map((f, index) => `
        <details class="file-card"${index < 3 ? " open" : ""}>
          <summary><span class="mono file-card-path">${esc(f.path)}</span>
            ${f.uncommitted ? `<span class="pill warn">uncommitted</span>` : ""}
            <span class="file-card-stats small faint">${esc(f.status)} · +${f.insertions} −${f.deletions}</span></summary>
          <pre class="diff file-card-diff">${f.diff ? renderDiff(f.diff) : "No content changes."}</pre>
        </details>`).join("")}</div>` : `<span class="muted" style="display:block;margin-top:.8rem">No changes yet.</span>`);
  } else if (tab === "commits") {
    const c = d.changes;
    const remote = d.session.repository?.remote;
    el.innerHTML = c.recent.length ? `<table><thead><tr><th>Commit</th><th>Subject</th><th>Author</th><th>Date</th>
      </tr></thead><tbody>${c.recent.map(x => {
        const url = commitUrl(remote, x.full_sha || x.sha);
        const id = url
          ? `<a href="${esc(url)}" class="mono" data-commit-url="${esc(url)}" title="Open this commit on GitHub">${esc(x.sha)}</a>`
          : `<span class="mono">${esc(x.sha)}</span>`;
        return `<tr><td>${id}</td><td>${esc(x.subject)}</td><td class="small muted">${esc(x.author)}</td>
          <td class="small muted mono">${esc(String(x.date || "").slice(0, 16))}</td></tr>`;
      }).join("")}
      </tbody></table>` : `<span class="muted">No commits on this branch yet.</span>`;
    el.querySelectorAll("[data-commit-url]").forEach(link => link.onclick = event => {
      event.preventDefault();
      guard(() => openGitHub(link.dataset.commitUrl))();
    });
  } else if (tab === "worktree") {
    const w = d.session.worktree;
    el.innerHTML = w ? `<table><tbody>
      <tr><th>Name</th><td class="mono">${esc(w.name)}</td></tr>
      <tr><th>Branch</th><td class="mono">${esc(w.branch)}</td></tr>
      <tr><th>Base</th><td class="mono">${esc(w.base_branch)}</td></tr>
      <tr><th>Path</th><td class="mono">${esc(w.path)}</td></tr>
      <tr><th>Primary repo</th><td class="mono">${esc(w.repo_root)}</td></tr>
      <tr><th>Present</th><td>${d.worktree_present?"yes":"<b>MISSING</b>"}</td></tr></tbody></table>
      <div class="note small" style="margin-top:1rem">Every change the agents make happens here.
      Your primary working copy is never the target.</div>` : `<span class="muted">No worktree.</span>`;
  } else if (tab === "memory") {
    const r = await api("memory" + q);
    el.innerHTML = `<pre style="max-height:30rem;overflow:auto">${esc(r.markdown||"(empty)")}</pre>`;
  } else if (tab === "raw") {
    const r = await api("events" + q);
    el.innerHTML = `<pre style="max-height:30rem;overflow:auto">${esc(r.events.map(e =>
      `[${e.seq}] ${e.created_at} ${e.event_type} ${e.actor_name||"-"} ${JSON.stringify(e.payload)}`
      ).join("\n") || "(no events)")}</pre>`;
  } else if (tab === "contract") {
    const r = await api("contract" + q);
    const a = r.acknowledgments;
    el.innerHTML = `<div class="between"><div><b>Revision ${r.revision}</b>
      <span class="small muted mono"> ${esc(r.short_digest)}</span></div></div>
      <table style="margin-top:.8rem"><tbody>${a.expected.map(p => {
        const c = a.conflicts.find(x=>x.participant===p);
        const ok = a.accepted.includes(p);
        return `<tr><td><b>${esc(p)}</b></td><td>${ok?`<span class="pill ok">UNDERSTOOD</span>`
          : c?`<span class="pill bad">CONFLICT</span> <span class="small">${esc(c.reason)}</span>`
          : `<span class="pill dim">waiting</span>`}</td></tr>`;}).join("")}</tbody></table>
      ${a.all_accepted && d.session.status==="awaiting_ack"
        ? `<button class="primary" id="act" style="margin-top:1rem">Activate session</button>` : ""}
      <pre style="margin-top:1rem;max-height:26rem;overflow:auto">${esc(r.core_text)}</pre>`;
    const act = el.querySelector("#act");
    if (act) act.onclick = guard(async () => {
      await api("activate", { session: S.session });
      S.dash = await api("dashboard" + q); renderSession();
    });
  }
}

document.getElementById("nav-home").onclick = guard(home);
document.getElementById("nav-new").onclick = guard(() => quickStart());
document.getElementById("side-toggle").onclick = () => toggleSidebar(true);
document.getElementById("side-reveal").onclick = () => toggleSidebar(false);
document.getElementById("side-backdrop").onclick = () => toggleSidebar(true);
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && isNarrow() && !S.sidebarCollapsed) toggleSidebar(true);
});
// On a narrow screen the sidebar is an overlay: navigating from it closes it.
document.getElementById("sidebar").addEventListener("click", event => {
  if (!isNarrow()) return;
  if (event.target.closest(".side-item, .side-nav button, #nav-new")) {
    S.sidebarCollapsed = true;
    applySidebar();
  }
});
/* Share: hand people the website link plus the one thing they need to know —
   sign in with GitHub and Synchri works with any repository. Clipboard only;
   the page itself still makes no external request. */
const SYNCHRI_SITE = "https" + "://synchri.com";
const shareMessage = () =>
  `Synchri — autonomous agent teams for your repositories. Get it at ${SYNCHRI_SITE}. Sign in with GitHub to use it with any repo.`;
document.getElementById("share-copy").onclick = guard(async () => {
  await copyText(shareMessage());
  document.getElementById("share-menu")?.removeAttribute("open");
  confirmNotice("Invite copied — the synchri.com link plus GitHub sign-in.", "Copied");
});
const nativeShare = document.getElementById("share-native");
if (navigator.share) {
  nativeShare.classList.remove("hide");
  nativeShare.onclick = guard(async () => {
    try {
      await navigator.share({title: "Synchri", text: shareMessage(), url: SYNCHRI_SITE});
    } catch (error) { /* dismissing the native sheet is not an error */ }
    document.getElementById("share-menu")?.removeAttribute("open");
  });
}
renderThemeMenu();
document.addEventListener("click", (event) => {
  document.querySelectorAll("details.menu[open]").forEach(menu => {
    if (!menu.contains(event.target)) menu.removeAttribute("open");
  });
});
if (isNarrow()) S.sidebarCollapsed = true;
applySidebar();
guard(home)();
</script>
