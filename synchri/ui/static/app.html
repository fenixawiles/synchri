<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synchri</title>
<style>
:root{
  --bg:#fbfbfa; --panel:#fff; --line:#ebe9e5; --ink:#1c1b19; --dim:#6b6862;
  --accent:#2f6f4f; --accent-soft:#e8f2ec; --warn:#8a5a00; --warn-soft:#fdf3e0;
  --bad:#a3352a; --bad-soft:#fbeceb; --radius:14px;
  --sans:"SF Pro Text","Avenir Next",Inter,ui-sans-serif,system-ui,sans-serif;
  --mono:"SF Mono",Berkeley Mono,JetBrains Mono,ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16171a; --panel:#1e2024; --line:#2f3237; --ink:#e9e8e4; --dim:#9b9892;
  --accent:#6dbd93; --accent-soft:#1d2f26; --warn:#e0aa5a; --warn-soft:#2e2519;
  --bad:#e0736a; --bad-soft:#2e1d1c;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 var(--sans)}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);padding:.5rem .9rem}
button:hover{border-color:var(--dim)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:none;border-color:transparent;color:var(--dim);padding:.35rem .6rem}
input,textarea,select{font:inherit;width:100%;padding:.55rem .7rem;border-radius:10px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink)}
textarea{min-height:14rem;resize:vertical;font-family:var(--mono);
  font-size:13.5px}
code,pre,.mono{font-family:var(--mono);font-size:13px}
pre{overflow-x:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:1rem;margin:0}
a{color:var(--accent)}
.wrap{max-width:76rem;margin:0 auto;padding:2rem 2rem 5rem}
.wrap.session-app{max-width:none;margin:0;padding:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.25rem}
.muted{color:var(--dim)}
.small{font-size:13px}
.row{display:flex;gap:.75rem;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.stack>*+*{margin-top:.85rem}
.grid{display:grid;gap:.75rem}
.hide{display:none !important}
.pill{display:inline-block;padding:.12rem .55rem;border-radius:999px;font-size:12px;font-weight:600;
  background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.dim{background:var(--line);color:var(--dim)}
/* header */
header{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10}
header .wrap{padding:.9rem 1.5rem;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:700;letter-spacing:-.02em;font-size:17px}
.brand span{color:var(--accent)}
/* wizard */
.steps{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:1.5rem}
.steps button{border:none;background:none;padding:.3rem .6rem;border-radius:6px;color:var(--dim);
  font-size:13px}
.steps button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.steps button.done{color:var(--ink)}
.steps button:disabled{opacity:.4;cursor:not-allowed}
.choice{border:1px solid var(--line);border-radius:var(--radius);padding:1rem;cursor:pointer;
  background:var(--panel);text-align:left;width:100%;display:block}
.choice:hover{border-color:var(--accent)}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
.choice b{display:block;margin-bottom:.15rem}
.repo-row{display:flex;justify-content:space-between;gap:1rem;align-items:baseline}
.perm{display:flex;justify-content:space-between;align-items:center;gap:1rem;
  padding:.45rem 0;border-bottom:1px solid var(--line)}
.perm:last-child{border-bottom:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:none;border-radius:0;padding:.3rem .7rem;font-size:12.5px;background:none;
  color:var(--dim)}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.seg button.on.risky{background:var(--bad)}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:.7rem 1rem;
  border-radius:0 10px 10px 0}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.quick textarea{min-height:7rem}
.agent-card{border:1px solid var(--line);border-radius:var(--radius);padding:1rem;background:var(--panel)}
.agent-card pre{margin-top:.75rem;white-space:pre-wrap;word-break:break-word}
/* focused session view: a fixed rail and a contained, breathing chat surface */
.session-layout{display:grid;grid-template-columns:15.5rem minmax(0,1fr);height:calc(100vh - 58px);min-height:34rem;background:var(--panel);overflow:hidden}
.session-rail{position:sticky;top:0;height:calc(100vh - 58px);padding:1.35rem 1rem;border-right:1px solid var(--line);background:#fafaf8;display:flex;flex-direction:column;gap:1.15rem;overflow-y:auto}
.rail-kicker{font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--dim);text-transform:uppercase}.rail-title{font-size:15px;font-weight:680;line-height:1.3}.rail-status{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:.4rem}.rail-status i{width:.45rem;height:.45rem;border-radius:50%;background:var(--line);display:inline-block}.rail-status i.live{background:var(--accent)}
.rail-clock{font-size:12px;color:var(--dim);margin-top:-.6rem}.rail-nav{display:grid;gap:.15rem}.rail-nav button{text-align:left;border:0;background:transparent;padding:.48rem .55rem;border-radius:6px;color:var(--dim);font-size:13px}.rail-nav button:hover{background:var(--bg);color:var(--ink)}.rail-nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
.rail-team{border-top:1px solid var(--line);padding-top:.85rem;margin-top:auto}.team-line{display:flex;align-items:center;justify-content:space-between;gap:.45rem;font-size:12px;padding:.16rem 0}.presence{display:inline-flex;align-items:center;gap:.42rem;min-width:0}.presence i{width:.46rem;height:.46rem;border-radius:50%;background:var(--line);display:inline-block;flex:none}.presence i.live{background:var(--accent)}
.rail-controls{display:flex;gap:.4rem;border-top:1px solid var(--line);padding-top:.85rem}.rail-controls button{font-size:12px;padding:.35rem .5rem}
.conversation-shell{min-width:0;min-height:0;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--panel)}.chat-header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.2rem clamp(2rem,4vw,5rem) 1rem;border-bottom:1px solid var(--line)}.chat-title{font-size:17px;font-weight:680}.chat-subtitle{font-size:12px;color:var(--dim);margin-top:.1rem}.chat-time{font-size:12px;color:var(--dim);white-space:nowrap}
.conversation-feed{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto auto;overflow:hidden}.message-list{min-height:0;overflow-y:auto;padding:1rem clamp(2rem,4vw,5rem) .6rem;scroll-behavior:smooth}.message-list .msg{padding:1rem 0;border-bottom:0;max-width:62rem}.conversation-feed .msg .who{font-size:11px;letter-spacing:.075em;font-weight:750;color:var(--dim)}.conversation-feed .msg .body{white-space:normal;margin-top:.28rem;line-height:1.62}.msg.you .who{color:var(--accent)}.msg.system .body{color:var(--dim);font-size:13px}.handoff{margin:.52rem 0 0;font-size:10px;font-weight:750;letter-spacing:.08em;color:var(--accent)}.response-state{margin-top:.45rem;font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--dim)}
.live-work{margin:0;padding:.3rem clamp(2rem,4vw,5rem) .45rem;max-width:none;background:transparent}.live-work-label{font-size:10px;font-weight:750;letter-spacing:.09em;color:var(--accent);margin-bottom:.18rem}.live-note{display:grid;grid-template-columns:auto max-content minmax(0,1fr);gap:.55rem;align-items:baseline;font-size:13px;padding:.08rem 0;max-width:62rem}.live-note b{font-size:11px;letter-spacing:.06em}.live-note .dot{color:var(--accent)}
.rich{max-width:62rem}.rich h3,.rich h4{font-size:14px;margin:.65rem 0 .2rem}.rich h4{font-size:13px}.rich p{margin:.45rem 0}.rich .rich-list{margin:.42rem 0;padding-left:1.1rem}.rich .rich-list div{margin:.16rem 0}.rich code{font-size:.88em;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:.1rem .28rem}.rich .rich-code{margin:.65rem 0;padding:.75rem .85rem;border:1px solid var(--line);background:#f7f7f5;border-radius:7px;overflow:auto;line-height:1.5}.rich .rich-code code{padding:0;border:0;background:transparent}.rich a{color:var(--accent);text-decoration-thickness:1px}.live-note .rich{display:inline}.live-note .rich p{display:inline;margin:0}.live-note .rich .rich-code{display:block}
.chat-compose{display:flex;gap:.55rem;margin:0;padding:.7rem clamp(2rem,4vw,5rem) 1.7rem;max-width:none}.chat-compose input{min-width:0;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:.55rem .05rem;background:transparent;max-width:62rem}.chat-compose input:focus{outline:none;border-color:var(--accent)}.chat-compose button{padding:.45rem .8rem}
.details-panel{margin:0;padding:1rem clamp(2rem,4vw,5rem) 1.5rem;border-top:1px solid var(--line);background:#fcfcfb;max-height:45vh;overflow:auto}.detail-heading{font-size:11px;letter-spacing:.08em;color:var(--dim);font-weight:750;margin-bottom:.7rem}
@media(max-width:760px){.wrap{padding-left:1rem;padding-right:1rem}.wrap.session-app{padding:0}.session-layout{grid-template-columns:1fr;height:auto;min-height:calc(100vh - 58px)}.session-rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:.6rem}.rail-nav{grid-column:1/-1;display:flex;overflow:auto}.rail-nav button{white-space:nowrap}.rail-team,.rail-controls{display:none}.conversation-shell{min-height:32rem}.message-list{padding-left:1rem;padding-right:1rem}.live-work,.chat-compose{padding-left:1rem;padding-right:1rem}.chat-header{padding-left:1rem;padding-right:1rem}}
.msg{border-bottom:1px solid var(--line);padding:.7rem 0}
.msg:last-child{border-bottom:none}
.msg .who{font-weight:640}
.msg .body{white-space:pre-wrap;margin-top:.2rem}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);font-weight:600}
.err{position:fixed;left:50%;transform:translateX(-50%);bottom:1.5rem;max-width:38rem;z-index:50}
</style>

<header><div class="wrap">
  <div class="brand">synchri<span>.</span></div>
  <div class="row">
    <span id="ctx" class="small muted"></span>
    <button class="ghost" id="nav-home">Sessions</button>
    <button id="nav-new">Start a room</button>
  </div>
</div></header>

<div class="wrap" id="app"></div>
<div class="err hide" id="err"></div>

<script>
const TOKEN = "__SYNCHRI_TOKEN__";
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* A deliberately small, safe Markdown renderer. Content is escaped first, so
   messages can be pleasant to scan without turning room text into executable
   HTML. It supports the code and structure agents actually use in reviews. */
function rich(value) {
  const blocks = [];
  let text = esc(value);
  text = text.replace(/```([A-Za-z0-9_+-]*)?\n([\s\S]*?)```/g, (_, lang, code) => {
    const label = lang ? ` data-language="${esc(lang)}"` : "";
    blocks.push(`<pre class="rich-code"${label}><code>${code}</code></pre>`);
    return `@@SYNCHRI_BLOCK_${blocks.length - 1}@@`;
  });
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    (_, label, url) => `<a href="${url}" target="_blank" rel="noreferrer">${label}</a>`);
  text = text.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  return `<div class="rich">${text.split("\n").map(line => {
    const block = line.match(/^@@SYNCHRI_BLOCK_(\d+)@@$/);
    if (block) return blocks[Number(block[1])];
    if (/^###\s+/.test(line)) return `<h4>${line.replace(/^###\s+/, "")}</h4>`;
    if (/^##\s+/.test(line)) return `<h3>${line.replace(/^##\s+/, "")}</h3>`;
    if (/^[-*]\s+/.test(line)) return `<div class="rich-list">${line.replace(/^[-*]\s+/, "• ")}</div>`;
    return line ? `<p>${line}</p>` : "";
  }).join("")}</div>`;
}

async function api(path, body) {
  const res = await fetch("/api/" + path, {
    method: body ? "POST" : "GET",
    headers: { "X-Synchri-Token": TOKEN, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.error) throw new Error(data.error?.message || res.statusText);
  return data;
}

function flash(message) {
  const box = document.getElementById("err");
  box.className = "err card"; box.style.borderColor = "var(--bad)";
  box.innerHTML = `<b>Could not do that</b><div class="small" style="margin-top:.3rem">${esc(message)}</div>`;
  clearTimeout(flash.t); flash.t = setTimeout(() => box.className = "err hide", 7000);
}
const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { flash(e.message); } };

const S = { view:"home", boot:null, draft:null, step:"mode", session:null,
            tab:"conversation", dash:null, repos:null, es:null, quick:null, launch:null,
            agentDraft:null, githubReposRequest:null, githubReposLoading:false, clock:null };
const app = () => document.getElementById("app");

/* ------------------------------------------------------------------ home */
async function home() {
  stopClock();
  app().classList.remove("session-app");
  S.view = "home"; S.session = null;
  S.boot = await api("bootstrap");
  listen();
  document.getElementById("ctx").textContent = S.boot.workspace;
  const list = S.boot.sessions;
  app().innerHTML = "";
  if (!list.length) {
    app().append($(`<div class="card stack" style="text-align:center;padding:3.5rem 2rem">
      <h2>Put your agents in one room</h2>
      <p class="muted">Describe the work once. Synchri makes a safe workspace and gives you
        one ready-to-paste setup instruction for each agent.</p>
      <div class="row" style="justify-content:center"><button class="primary" id="cta">Start a room</button>
        <button id="advanced">Advanced setup</button></div>
    </div>`));
    document.getElementById("cta").onclick = () => quickStart();
    document.getElementById("advanced").onclick = () => newSession();
    return;
  }
  const title = $(`<div class="between" style="margin-bottom:1rem"><h2>Rooms</h2>
    <button class="primary" id="new-room">Start a room</button></div>`);
  title.querySelector("#new-room").onclick = () => quickStart();
  app().append(title);
  for (const s of list) {
    const done = ["complete","timed_out","stopped","failed"].includes(s.status);
    const cls = s.status === "active" ? "" : (done ? "dim" : "warn");
    const row = $(`<div class="card" style="margin-bottom:.65rem;cursor:pointer">
      <div class="between">
        <div>
          <b>${esc(s.name)}</b> <span class="pill ${cls}">${esc(s.status.replace("_"," "))}</span>
          <div class="small muted" style="margin-top:.2rem">
            ${esc(s.mode_label)} · ${esc(s.repository.name)} ·
            ${esc(s.worktree ? s.worktree.name : "no worktree")}
          </div>
        </div>
        <div class="small muted mono">${esc(s.session_id)}</div>
      </div></div>`);
    row.onclick = () => openSession(s.session_id);
    app().append(row);
  }
}

/* ------------------------------------------------------------- quick start */
async function quickStart() {
  stopClock();
  app().classList.remove("session-app");
  if (!S.boot) S.boot = await api("bootstrap");
  S.view = "quick"; S.session = null; S.launch = null;
  S.quick = {
    repo_path: S.boot.default_repo || "",
    goal: "",
    agents: [
      {name:"codex", runtime:"codex", role:"primary_builder"},
      {name:"copilot", runtime:"copilot", role:"adversarial_reviewer"},
    ],
  };
  renderQuick();
}

function renderQuick() {
  const q = S.quick;
  app().innerHTML = "";
  app().append($(`<div class="quick stack" style="max-width:48rem">
    <div><h2>Start a collaboration room</h2>
      <p class="muted">Synchri uses a separate worktree, so your primary checkout stays untouched.</p></div>
    <label><b>Project</b><input id="quick-repo" value="${esc(q.repo_path)}"
      placeholder="Paste a GitHub link, owner/repository, or local folder"></label>
    <div class="small muted">No local project folder? Paste <code>owner/repository</code> or a
      GitHub URL. Synchri downloads it into <code>${esc(S.boot.desktop_clone_root)}</code> first.
      Existing local folders work too.</div>
    <label><b>What do you want the team to do?</b>
      <textarea id="quick-goal" placeholder="Review the current changes, then fix the most important issue.">${esc(q.goal)}</textarea></label>
    <div class="card stack"><div><b>Your agents</b>
      <div class="small muted">Use the names you want them to address each other by.</div></div>
      <div id="quick-agents" class="stack"></div>
    </div>
    <div class="row"><button class="primary" id="quick-go">Create room and setup instructions</button>
      <button id="quick-advanced">Advanced setup</button></div>
  </div>`));
  const agents = document.getElementById("quick-agents");
  q.agents.forEach((agent, index) => {
    const row = $(`<div class="grid" style="grid-template-columns:1fr 1fr;align-items:center">
      <input value="${esc(agent.name)}" placeholder="agent name">
      <select>${S.boot.runtimes.map(runtime =>
        `<option value="${runtime.key}" ${runtime.key===agent.runtime?"selected":""}>${esc(runtime.label)}</option>`
      ).join("")}</select></div>`);
    const [name, runtime] = row.querySelectorAll("input,select");
    name.oninput = event => q.agents[index].name = event.target.value;
    runtime.onchange = event => q.agents[index].runtime = event.target.value;
    agents.append(row);
  });
  document.getElementById("quick-advanced").onclick = () => newSession();
  document.getElementById("quick-go").onclick = guard(async () => {
    q.repo_path = document.getElementById("quick-repo").value.trim();
    q.goal = document.getElementById("quick-goal").value.trim();
    const result = await api("quick-start", q);
    showLaunch(result);
  });
}

function copyText(value) {
  const fallback = () => {
    const field = document.createElement("textarea");
    field.value = value; field.style.position = "fixed"; field.style.opacity = "0";
    document.body.append(field); field.select(); document.execCommand("copy"); field.remove();
  };
  if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(value).catch(fallback);
  fallback(); return Promise.resolve();
}

async function refreshLaunch() {
  const result = await api("launch?session=" + encodeURIComponent(S.session));
  showLaunch(result);
}

function showLaunch(result) {
  stopClock();
  app().classList.remove("session-app");
  S.session = result.session.session_id;
  S.launch = result.launch;
  if (result.clone) S.launch.clone = result.clone;
  S.view = "launch";
  renderLaunch(); listen();
}

async function openLaunch(id) {
  const result = await api("launch?session=" + encodeURIComponent(id));
  showLaunch(result);
}

function renderLaunch() {
  const l = S.launch, a = l.acknowledgments;
  app().innerHTML = "";
  const heading = l.ready_to_activate ? "Everyone is ready" : "Your room is ready";
  app().append($(`<div class="stack"><div class="between"><div>
    <h2>${heading}</h2>
    <div class="muted small">${esc(l.joined_count)} of ${esc(l.agents.length)} agents connected ·
      worktree <span class="mono">${esc(l.worktree_path)}</span></div></div>
    <button id="refresh">Check connections</button></div>
    <div class="note">Paste each setup instruction into its agent. Synchri only marks an agent
      connected after it actually joins the room.</div>
  </div>`));
  if (l.clone) app().append($(`<div class="note"><b>Repository cloned</b>
    <div class="small mono">${esc(l.clone.path)}</div></div>`));
  document.getElementById("refresh").onclick = guard(refreshLaunch);

  for (const agent of l.agents) {
    const status = agent.joined
      ? (agent.acknowledged ? `<span class="pill">ready</span>` : `<span class="pill warn">joined — reading agreement</span>`)
      : `<span class="pill dim">waiting to join</span>`;
    const card = $(`<div class="agent-card"><div class="between"><div><b>${esc(agent.name)}</b>
      <span class="small muted">${esc(agent.role_label)} · ${esc(agent.runtime)}</span></div>${status}</div>
      <div class="small muted" style="margin-top:.55rem">Paste this into ${esc(agent.name)}:</div>
      <pre>${esc(agent.setup_prompt)}</pre>
      <div class="row" style="margin-top:.75rem"><button class="primary">Copy setup instruction</button>
        <button>Copy join command</button></div></div>`);
    const [setup, join] = card.querySelectorAll("button");
    setup.onclick = guard(async () => { await copyText(agent.setup_prompt); setup.textContent = "Copied"; });
    join.onclick = guard(async () => { await copyText(agent.join_command); join.textContent = "Copied"; });
    app().append(card);
  }
  const action = $(`<div class="card stack" style="margin-top:1rem"><div>
    <b>Start the collaboration</b><div class="small muted">${l.ready_to_activate
      ? "Both agents joined and acknowledged the agreement."
      : `Waiting for: ${esc(a.waiting.join(", ") || l.agents.filter(x=>!x.joined).map(x=>x.name).join(", ") || "an acknowledgement")}`}
    </div></div><div class="row"><button class="primary" id="activate" ${l.ready_to_activate?"":"disabled"}>Start collaboration</button>
      <button id="open">Open room</button></div></div>`);
  action.querySelector("#activate").onclick = guard(async () => {
    await api("activate", {session:S.session}); await openSession(S.session);
  });
  action.querySelector("#open").onclick = guard(() => openSession(S.session));
  app().append(action);
}

/* ---------------------------------------------------------------- wizard */
async function newSession(resume) {
  stopClock();
  app().classList.remove("session-app");
  S.view = "wizard"; S.step = "mode";
  S.draft = resume ? await api("draft?draft=default")
                   : await api("draft/reset", { draft: "default" });
  if (!S.boot) S.boot = await api("bootstrap");
  // Reopening an unfinished wizard should land on the first thing still needed.
  if (resume && S.draft.draft.mode) {
    const steps = S.draft.steps.map(x => x.key);
    S.step = steps.find(k => k !== "review" && S.draft.problems.length &&
                              S.draft.problems.some(() => true) && !stepSatisfied(k)) || "review";
  }
  renderWizard();
}

function stepSatisfied(key) {
  const d = S.draft.draft;
  return ({ mode: !!d.mode, repository: !!d.repo_path, worktree: true,
            agents: d.agents.length > 0, permissions: true,
            spec: !!d.spec, deadline: true, review: true })[key] ?? true;
}

async function patch(body) {
  S.draft = await api("draft", { draft: "default", ...body });
  renderWizard();
}

function renderWizard() {
  const d = S.draft, steps = d.steps.length ? d.steps : [{key:"mode",label:"Choose how this session runs"}];
  app().innerHTML = "";
  const bar = $(`<div class="steps"></div>`);
  steps.forEach((st, i) => {
    const b = $(`<button class="${st.key === S.step ? "on" : (i < steps.findIndex(x=>x.key===S.step) ? "done":"")}">${i+1}. ${esc(st.label)}</button>`);
    b.disabled = !d.draft.mode && st.key !== "mode";
    b.onclick = () => { S.step = st.key; renderWizard(); };  // free back-navigation
    bar.append(b);
  });
  app().append(bar);
  ({ mode: stepMode, repository: stepRepo, worktree: stepTree, agents: stepAgents,
     permissions: stepPerms, spec: stepSpec, deadline: stepDeadline, review: stepReview
   }[S.step] || stepMode)();
  const idx = steps.findIndex(s => s.key === S.step);
  const nav = $(`<div class="between" style="margin-top:1.5rem"></div>`);
  const back = $(`<button ${idx <= 0 ? "disabled" : ""}>Back</button>`);
  back.onclick = () => { S.step = steps[idx-1].key; renderWizard(); };
  const next = $(`<button class="primary">${idx === steps.length-1 ? "" : "Next"}</button>`);
  if (idx < steps.length - 1) {
    next.onclick = guard(async () => {
      // Agent entries are the only wizard field edited locally before an
      // explicit save.  Persist them on Next as well: leaving step 4 must not
      // silently throw away the team the user just entered.
      if (S.step === "agents" && S.agentDraft) {
        S.draft = await api("draft", {
          draft: "default", agents: S.agentDraft.filter(agent => agent.name.trim())
        });
      }
      S.step = steps[idx+1].key; renderWizard();
    });
  }
  else next.className = "hide";
  nav.append(back, next);
  app().append(nav);
}

function stepMode() {
  const box = $(`<div class="stack"><h2>How should this session run?</h2></div>`);
  for (const m of S.boot.modes) {
    const b = $(`<button class="choice ${S.draft.draft.mode===m.mode?"on":""}">
      <b>${esc(m.label)}</b><span class="muted small">${esc(m.summary)}</span></button>`);
    b.onclick = guard(async () => { await patch({ mode: m.mode }); S.step = "repository"; renderWizard(); });
    box.append(b);

}

async function stepRepo() {
  const box = $(`<div class="stack"><h2>Which repository?</h2>
    <div class="muted small">Synchri never changes your primary working copy — it makes an
    isolated one for the agents.</div></div>`);
  app().append(box);
  const cur = S.draft.repo_status;
  if (cur) {
    box.append($(`<div class="note"><b>${esc(cur.name)}</b> · branch <code>${esc(cur.branch)}</code>
      <div class="small mono muted">${esc(cur.root)}</div>
      ${cur.is_dirty ? `<div class="small" style="margin-top:.4rem">
        ${cur.dirty_files.length} uncommitted change(s) — left exactly as they are.</div>` : ""}</div>`));
  }
  const manual = $(`<div class="row"><input id="rp" placeholder="/path/to/repository"
    value="${esc(S.draft.draft.repo_path||"")}"><button id="use">Use</button></div>`);
  box.append(manual);
  manual.querySelector("#use").onclick = guard(async () => {
    await patch({ repo_path: document.getElementById("rp").value });
  });
  const loading = $(`<div class="muted small">Looking for repositories…</div>`);
  box.append(loading);
  // A GitHub lookup can take seconds (or its full timeout while offline).  Do
  // not make the local chooser wait for a network request the user may not
  // even need.  It lands first, then GitHub fills in when it is available.
  if (!S.repos) S.repos = await api("repositories?github=0");
  loading.remove();
  if (!S.githubReposRequest) {
    S.githubReposLoading = true;
    S.githubReposRequest = api("repositories").then(repos => {
      S.repos = repos; S.githubReposLoading = false;
      if (S.view === "wizard" && S.step === "repository") renderWizard();
    }).catch(() => {
      S.repos = {...S.repos, github_available:false}; S.githubReposLoading = false;
      if (S.view === "wizard" && S.step === "repository") renderWizard();
    });
  }
  if (S.repos.local.length) {
    box.append($(`<h3 class="small muted" style="margin-top:.5rem">ON THIS MACHINE</h3>`));
    for (const r of S.repos.local.slice(0, 12)) {
      const b = $(`<button class="choice ${S.draft.draft.repo_path===r.path?"on":""}">
        <div class="repo-row"><b>${esc(r.name)}</b>
        <span class="small muted">${esc(r.branch||"")}${r.dirty?" · uncommitted changes":""}</span></div>
        <span class="small muted mono">${esc(r.path)}</span></button>`);
      b.onclick = guard(() => patch({ repo_path: r.path }));
      box.append(b);
    }
  }
  if (S.repos.github_available && S.repos.github.length) {
    box.append($(`<h3 class="small muted" style="margin-top:.5rem">GITHUB</h3>`));
    for (const r of S.repos.github.slice(0, 12)) {
      const usable = !!r.local_path;
      const b = $(`<button class="choice" ${usable?"":"disabled style=opacity:.5"}>
        <div class="repo-row"><b>${esc(r.full_name)}</b>
        <span class="small muted">${usable ? "cloned locally" : "not cloned — clone it first"}</span></div>
        ${r.description?`<span class="small muted">${esc(r.description)}</span>`:""}</button>`);
      if (usable) b.onclick = guard(() => patch({ repo_path: r.local_path }));
      box.append(b);
    }
  } else if (S.githubReposLoading) {
    box.append($(`<div class="small muted">Loading your GitHub repositories…</div>`));
  } else if (!S.repos.github_available) {
    box.append($(`<div class="small muted">GitHub listing needs the <code>gh</code> CLI signed in.
      Local repositories work without it.</div>`));
  }
}

/* ------------------------------------------------------------- dashboard */
async function openSession(id) {
  app().classList.add("session-app");
  S.view = "session"; S.session = id;
  S.dash = await api("dashboard?session=" + encodeURIComponent(id));
  S.tab = S.dash.session.status === "awaiting_ack" ? "contract" : "conversation";
  renderSession();
  listen();
}

/* The server watches and pushes; the client never polls. EventSource
   reconnects by itself, so a dropped connection self-heals. */
function listen() {
  if (S.es) { S.es.close(); S.es = null; }
  const q = S.session ? "?session=" + encodeURIComponent(S.session) : "";
  const es = new EventSource("/api/stream" + q);
  S.es = es;
  es.addEventListener("changed", async (e) => {
    const what = JSON.parse(e.data).what || [];
    try {
      if (S.view === "session") {
        S.dash = await api("dashboard?session=" + encodeURIComponent(S.session));
        // Room messages and Live Work arrive often. Repainting the whole
        // session made the page visibly jump and threw away scroll position.
        // Only structural session changes need a full layout rebuild.
        if (what.includes("sessions")) {
          renderSession();
        } else {
          refreshSessionChrome();
          const conversation = document.getElementById("conversation-panel");
          if (conversation) await paint("conversation", conversation);
        }
      } else if (S.view === "launch" && S.session) {
        const result = await api("launch?session=" + encodeURIComponent(S.session));
        S.launch = result.launch; renderLaunch();
      } else if (S.view === "home" && what.includes("sessions")) {
        await home();
      } else if (S.view === "wizard" && what.includes("drafts")) {
        // Another tab edited this draft. Adopt it rather than diverge.
        const fresh = await api("draft?draft=default");
        if (fresh.version !== S.draft.version) { S.draft = fresh; renderWizard(); }
      }
    } catch (err) { /* transient; the next event will catch us up */ }
  });
  es.addEventListener("closing", () => { es.close(); S.es = null; setTimeout(listen, 500); });
  es.onerror = () => { /* EventSource retries on its own */ };
}

const DETAIL_TABS = ["gates","tests","changes","commits","worktree","memory","raw","contract","changelog"];

function timeboxText(deadline) {
  if (!deadline?.ends_at) return "Open-ended";
  const seconds = Math.ceil((Date.parse(deadline.ends_at) - Date.now()) / 1000);
  if (seconds <= 0) return "Timebox passed";
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  return `${String(hours).padStart(2,"0")}:${String(minutes).padStart(2,"0")}:${String(seconds % 60).padStart(2,"0")} remaining`;
}

function startClock(deadline) {
  stopClock();
  const tick = () => {
    const clock = document.getElementById("timebox");
    if (clock) clock.textContent = timeboxText(deadline);
  };
  tick();
  if (deadline?.ends_at) S.clock = setInterval(tick, 1000);
}

function stopClock() {
  if (S.clock) clearInterval(S.clock);
  S.clock = null;
}

function renderSession() {
  const d = S.dash, s = d.session, g = d.gates.summary;
  const working = s.status === "active";
  const current = d.current_actor || (working ? "Waiting for the next turn" : s.status.replace("_", " "));
  const activeNotes = new Set((d.activities || []).map(note => note.name));
  app().innerHTML = "";
  const team = s.participants.map(p => {
    const active = p.name === d.current_actor;
    return `<div class="team-line" data-member="${esc(p.name)}"><span class="presence"><i class="${active ? "live" : ""}"></i>${esc(p.name)}</span>
      <span class="muted small" data-team-state>${activeNotes.has(p.name) ? "working" : (active ? "on point" : "waiting")}</span></div>`;
  }).join("");
  const nav = ["conversation", ...DETAIL_TABS.filter(tab => tab !== "changelog" || s.status === "complete")];
  const layout = $(`<div class="session-layout"><aside class="session-rail">
      <div><div class="rail-kicker">Synchri session</div><div class="rail-title">${esc(s.name)}</div></div>
      <div class="rail-status"><i id="rail-current-dot" class="${working ? "live" : ""}"></i><span id="rail-current">${esc(current)}</span></div>
      <div id="timebox" class="rail-clock mono">${esc(timeboxText(s.deadline))}</div>
      <nav class="rail-nav" aria-label="Session tools">${nav.map(tab =>
        `<button data-tab="${tab}" class="${tab===S.tab?"on":""}">${tab === "conversation" ? "Conversation" : tab[0].toUpperCase()+tab.slice(1)}</button>`
      ).join("")}</nav>
      <div class="rail-team"><div class="rail-kicker" style="margin-bottom:.35rem">Team</div>${team}</div>
      <div class="rail-controls">${["active", "paused"].includes(s.status) ? `<button id="c-pause">${s.status==="active"?"Pause":"Resume"}</button>` : ""}${s.status === "active" ? `<button id="c-complete">Complete</button>` : ""}${!['complete','stopped','failed','timed_out'].includes(s.status) ? `<button id="c-stop">Stop</button>` : ""}</div>
    </aside><main class="conversation-shell"><div class="chat-header"><div><div class="chat-title">Conversation</div>
      <div class="chat-subtitle">${esc(s.repository.name)} · ${esc(s.repository.branch || "")}</div></div>
      <div class="chat-time">${esc(g.satisfied + "/" + g.required)} gates verified</div></div>
      <div id="conversation-panel" class="conversation-feed"><span class="muted small">Loading conversation…</span></div>
      <section id="detail-panel" class="details-panel hide"></section></main></div>`);
  app().append(layout);
  const pause = document.getElementById("c-pause");
  if (pause) pause.onclick = guard(async () => {
    S.dash = await api("control", { session: S.session,
      action: s.status === "active" ? "pause" : "resume" }); renderSession(); });
  const complete = document.getElementById("c-complete");
  if (complete) complete.onclick = guard(async () => {
    if (!confirm("Complete this session? Synchri will verify its gates, close the room, and create the final changelog.")) return;
    S.dash = await api("control", { session: S.session, action: "complete" }); renderSession(); });
  const stop = document.getElementById("c-stop");
  if (stop) stop.onclick = guard(async () => {
    if (!confirm("Stop this session? Agents stop immediately. The worktree and all work stay.")) return;
    S.dash = await api("control", { session: S.session, action: "stop" }); renderSession(); });
  layout.querySelectorAll("[data-tab]").forEach(button => button.onclick = () => {
    S.tab = button.dataset.tab; renderSession();
  });
  paint("conversation", document.getElementById("conversation-panel"))
    .catch(error => document.getElementById("conversation-panel").innerHTML = `<span class="muted">${esc(error.message)}</span>`);
  if (S.tab !== "conversation") {
    const panel = document.getElementById("detail-panel");
    panel.classList.remove("hide");
    panel.innerHTML = `<div class="detail-heading">${esc(S.tab.toUpperCase())}</div><span class="muted small">Loading…</span>`;
    paint(S.tab, panel).catch(error => panel.innerHTML = `<span class="muted">${esc(error.message)}</span>`);
  }
  startClock(s.deadline);
}

function refreshSessionChrome() {
  const d = S.dash, s = d.session;
  const current = d.current_actor || (s.status === "active" ? "Waiting for the next turn" : s.status.replace("_", " "));
  const activeNotes = new Set((d.activities || []).map(note => note.name));
  const currentEl = document.getElementById("rail-current");
  if (currentEl) currentEl.textContent = current;
  const dot = document.getElementById("rail-current-dot");
  if (dot) dot.classList.toggle("live", s.status === "active");
  document.querySelectorAll(".team-line[data-member]").forEach(row => {
    const name = row.dataset.member;
    const active = name === d.current_actor;
    const state = row.querySelector("[data-team-state]");
    if (state) state.textContent = activeNotes.has(name) ? "working" : (active ? "on point" : "waiting");
    const presence = row.querySelector(".presence i");
    if (presence) presence.classList.toggle("live", active);
  });
}

async function paint(tab, el) {
  const q = "?session=" + encodeURIComponent(S.session);
  const d = S.dash;
  if (tab === "conversation") {
    const previousInput = el.querySelector("#mm");
    const draftValue = previousInput?.value || "";
    const draftFocused = document.activeElement === previousInput;
    const caretStart = previousInput?.selectionStart ?? draftValue.length;
    const caretEnd = previousInput?.selectionEnd ?? draftValue.length;
    const r = await api("conversation" + q);
    const activityTrail = d.activity_entries || d.activities || [];
    const liveWork = `<section class="live-work" aria-live="polite">
      ${activityTrail.length ? `<div class="live-work-label">LIVE WORK · THIS TURN</div>${activityTrail.map(note =>
        `<div class="live-note"><span class="dot">●</span><b>${esc(String(note.name).toUpperCase())}</b><div>${rich(note.summary)}</div></div>`
      ).join("")}` : ""}</section>`;
    const messages = r.messages.length ? r.messages.map(m => {
      const speaker = m.metadata?.source === "session_activation" ? "SYNCHRI"
        : (m.sender === "human" ? "YOU" : String(m.sender).toUpperCase());
      const responseState = m.message_type === "response"
        ? `${String(m.response_status || "complete").toUpperCase()} RESPONSE` : "";
      const kind = speaker === "SYNCHRI" ? "system" : (speaker === "YOU" ? "you" : "");
      const recipient = m.target && speaker !== "SYNCHRI"
        ? ` → ${String(m.target).toUpperCase()}` : "";
      return `<div class="msg ${kind}"><div class="who">${esc(speaker + recipient)}</div>
        <div class="body">${rich(m.content)}</div>
        ${responseState ? `<div class="response-state">${esc(responseState)}</div>` : ""}
        ${m.handoff_target ? `<div class="handoff">HANDOFF → ${esc(m.handoff_target)}</div>` : ""}</div>`;
    }).join("") : `<span class="muted">Nothing said yet.</span>`;
    el.innerHTML = `<div class="message-list">${messages}</div>` + liveWork;
    const list = el.querySelector(".message-list");
    requestAnimationFrame(() => list.scrollTo({ top: list.scrollHeight, behavior: "smooth" }));
    if (d.session.status !== "active") {
      const closed = d.session.status === "complete"
        ? "Session complete — the final changelog is available in the rail."
        : `Session ${d.session.status.replace("_", " ")} — messaging is closed.`;
      el.append($(`<div class="chat-compose muted small">${esc(closed)}</div>`));
      return;
    }
    const send = $(`<div class="chat-compose">
      <input id="mm" placeholder="Message the agents">
      <button class="primary" id="ms">Send</button></div>`);
    el.append(send);
    const input = send.querySelector("#mm");
    input.value = draftValue;
    if (draftFocused) {
      input.focus();
      input.setSelectionRange(caretStart, caretEnd);
    }
    send.querySelector("#ms").onclick = guard(async () => {
      const v = input.value.trim(); if (!v) return;
      input.value = "";
      await api("message", { session: S.session, content: v, interrupt: true });
      paint("conversation", el);
    });
  } else if (tab === "changelog") {
    const r = await api("changelog" + q);
    el.innerHTML = `<div class="rich">${rich(r.markdown)}</div>`;
  } else if (tab === "gates") {
    const r = await api("gates" + q);
    el.innerHTML = r.gates.length ? `<table><thead><tr><th>Gate</th><th>Status</th><th>Description</th>
      <th>Evidence</th></tr></thead><tbody>${r.gates.map(x=>`<tr>
      <td class="mono">${esc(x.gate_id)}</td>
      <td><span class="pill ${x.satisfied?"":(x.status==="fail"?"bad":"dim")}">${esc(x.status)}</span></td>
      <td>${esc(x.description)}</td>
      <td class="small muted">${esc([...x.evidence,...x.tests,...x.commits].join(", ")||"none")}</td>
      </tr>`).join("")}</tbody></table>
      <div class="small muted" style="margin-top:.7rem">A gate passes only with evidence and both
      sign-offs. ${esc(r.summary.blockers.join("; ")||"")}</div>`
      : `<span class="muted">No gates defined. Add acceptance criteria to the spec.</span>`;
  } else if (tab === "tests") {
    const t = d.tests;
    el.innerHTML = `<div class="between"><div>
      ${t ? `<div class="v" style="font-size:22px">${t.passed} passed${t.failed?`, ${t.failed} failed`:""}</div>
             <div class="small muted mono">${esc(t.command)} · exit ${t.exit_code}</div>`
          : `<span class="muted">Not run yet.</span>`}
      </div><button class="primary" id="rt">Run tests</button></div>
      ${t && t.output_tail ? `<pre style="margin-top:1rem;max-height:22rem;overflow:auto">${esc(t.output_tail)}</pre>` : ""}
      ${!d.test_command ? `<div class="note warn small" style="margin-top:1rem">No test command
        detected. Set one to collect evidence.</div>` : ""}`;
    el.querySelector("#rt").onclick = guard(async () => {
      el.innerHTML = `<span class="muted">Running…</span>`;
      await api("tests/run", { session: S.session });
      S.dash = await api("dashboard" + q); renderSession();
    });
  } else if (tab === "changes") {
    const r = await api("diff" + q);
    el.innerHTML = `<div class="small muted">${d.changes.files_changed} file(s),
      +${d.changes.insertions} −${d.changes.deletions}</div>
      <pre style="margin-top:.8rem;max-height:30rem;overflow:auto">${esc(r.diff||"No changes yet.")}</pre>`;
  } else if (tab === "commits") {
    const c = d.changes;
    el.innerHTML = c.recent.length ? `<table><thead><tr><th>Commit</th><th>Subject</th><th>Author</th>
      </tr></thead><tbody>${c.recent.map(x=>`<tr><td class="mono">${esc(x.sha)}</td>
      <td>${esc(x.subject)}</td><td class="small muted">${esc(x.author)}</td></tr>`).join("")}
      </tbody></table>` : `<span class="muted">No commits on this branch yet.</span>`;
  } else if (tab === "worktree") {
    const w = d.session.worktree;
    el.innerHTML = w ? `<table><tbody>
      <tr><th>Name</th><td class="mono">${esc(w.name)}</td></tr>
      <tr><th>Branch</th><td class="mono">${esc(w.branch)}</td></tr>
      <tr><th>Base</th><td class="mono">${esc(w.base_branch)}</td></tr>
      <tr><th>Path</th><td class="mono">${esc(w.path)}</td></tr>
      <tr><th>Primary repo</th><td class="mono">${esc(w.repo_root)}</td></tr>
      <tr><th>Present</th><td>${d.worktree_present?"yes":"<b>MISSING</b>"}</td></tr></tbody></table>
      <div class="note small" style="margin-top:1rem">Every change the agents make happens here.
      Your primary working copy is never the target.</div>` : `<span class="muted">No worktree.</span>`;
  } else if (tab === "memory") {
    const r = await api("memory" + q);
    el.innerHTML = `<pre style="max-height:30rem;overflow:auto">${esc(r.markdown||"(empty)")}</pre>`;
  } else if (tab === "raw") {
    const r = await api("events" + q);
    el.innerHTML = `<pre style="max-height:30rem;overflow:auto">${esc(r.events.map(e =>
      `[${e.seq}] ${e.created_at} ${e.event_type} ${e.actor_name||"-"} ${JSON.stringify(e.payload)}`
      ).join("\n") || "(no events)")}</pre>`;
  } else if (tab === "contract") {
    const r = await api("contract" + q);
    const a = r.acknowledgments;
    el.innerHTML = `<div class="between"><div><b>Revision ${r.revision}</b>
      <span class="small muted mono"> ${esc(r.short_digest)}</span></div></div>
      <table style="margin-top:.8rem"><tbody>${a.expected.map(p => {
        const c = a.conflicts.find(x=>x.participant===p);
        const ok = a.accepted.includes(p);
        return `<tr><td><b>${esc(p)}</b></td><td>${ok?`<span class="pill">UNDERSTOOD</span>`
          : c?`<span class="pill bad">CONFLICT</span> <span class="small">${esc(c.reason)}</span>`
          : `<span class="pill dim">waiting</span>`}</td></tr>`;}).join("")}</tbody></table>
      ${a.all_accepted && d.session.status==="awaiting_ack"
        ? `<button class="primary" id="act" style="margin-top:1rem">Activate session</button>` : ""}
      <pre style="margin-top:1rem;max-height:26rem;overflow:auto">${esc(r.core_text)}</pre>`;
    const act = el.querySelector("#act");
    if (act) act.onclick = guard(async () => {
      await api("activate", { session: S.session });
      S.dash = await api("dashboard" + q); renderSession();
    });
  }
}

document.getElementById("nav-home").onclick = guard(home);
document.getElementById("nav-new").onclick = guard(quickStart);
guard(home)();
</script>
