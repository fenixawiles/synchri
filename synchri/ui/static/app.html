<!doctype html>

<title>Synchri</title>
<script>
/* The server injects the durable preference before first paint. Browser
   storage cannot own this setting because the desktop app's loopback port —
   and therefore its origin — changes on every launch. */
const savedTheme = "__SYNCHRI_THEME__";
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
</script>

/* ------------------------------------------------------------------ tokens
   Every theme-dependent value is a token. Bare :root is Graphite (dark) — a
   neutral instrument panel: the chrome carries no hue; one muted steel accent
   marks focus, links, selection, and live state; green/amber/red appear only
   where they mean something (pass / caution / failure, diffs). With no
   explicit choice, the OS light preference switches to Daylight. An explicit
   data-theme (from the sidebar picker, kept by Synchri) always wins. Each
   block also sets color-scheme for native controls. */
:root{
  color-scheme:dark;
  --bg:#0b0c0e; --panel:#131518; --panel2:#1a1d22; --raise:#20242b;

  --a0:#7fb3ce; --a1:#a99fd8; --a2:#c9a878; --a3:#7cbfa5; --a4:#c996b4;

  --diff-del:#eb9d94; --diff-del-bg:rgba(229,131,122,.12);
  --gh-bg:#eef1f4; --gh-ink:#1f2328; --gh-line:#eef1f4;
  --radius:12px; --radius-s:8px;

/* ------------------------------------------------------------------- base */
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
::selection{background:var(--sel)}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;--sidebar-w:13.75rem}
h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.02em}
h2{margin:0;font-size:14.5px;font-weight:650;letter-spacing:-.005em}
h3{margin:0;font-size:13px;font-weight:600}
p{margin:.45rem 0}
a{color:var(--accent);text-decoration-thickness:1px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:6px}

button{font:500 12.5px/1.35 var(--sans);cursor:pointer;border-radius:var(--radius-s);
  border:1px solid var(--line2);background:var(--panel);color:var(--ink);padding:.42rem .8rem;
  transition:background-color .12s ease,border-color .12s ease,color .12s ease,box-shadow .12s ease}
button:hover{background:var(--panel2);border-color:var(--faint)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink);font-weight:600}
button.primary:hover{box-shadow:inset 0 0 0 99rem rgba(128,128,128,.14)}
button.primary:disabled{box-shadow:none}
button.ghost{background:transparent;border-color:transparent;color:var(--dim)}
button.ghost:hover{background:var(--panel2);color:var(--ink)}

input,textarea,select{font:13px/1.45 var(--sans);width:100%;padding:.5rem .65rem;
  border-radius:var(--radius-s);border:1px solid var(--line2);background:var(--panel2);color:var(--ink)}
input.mono{font-family:var(--mono);font-size:12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:12rem;resize:vertical}
label>b{display:block;margin-bottom:.3rem;font-size:12px;font-weight:600}
::placeholder{color:var(--faint)}

code,pre,.mono{font-family:var(--mono);font-size:12px}
pre{overflow:auto;background:var(--panel2);border:1px solid var(--line);
  border-radius:var(--radius-s);padding:.8rem .9rem;margin:0;line-height:1.55}
.muted{color:var(--dim)}
.faint{color:var(--faint)}
.small{font-size:12px}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.stack>*+*{margin-top:.8rem}
.grid{display:grid;gap:.6rem}
.hide{display:none !important}
.kicker{font:600 10px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem 1rem}

.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.15rem .58rem;border-radius:999px;
  font:650 10px/1.4 var(--mono);letter-spacing:.05em;text-transform:uppercase;
  background:var(--panel2);border:1px solid var(--line2);color:var(--dim)}
.pill.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.pill.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.pill.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.pill.dim{background:var(--panel2);border-color:var(--line2);color:var(--dim)}

.led{width:7px;height:7px;border-radius:50%;background:var(--line2);display:inline-block;flex:none}
.led.live{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
  animation:pulse 2.4s ease-in-out infinite}
.led.warn{background:var(--warn)}
.led.ok{background:var(--ok)}
.led.bad{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

.note{border:1px solid var(--line);border-left:2px solid var(--accent);background:var(--panel2);
  padding:.6rem .8rem;border-radius:var(--radius-s);font-size:12.5px}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-left-color:var(--bad);background:var(--bad-soft)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 10px/1.4 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

/* ------------------------------------------------------------------ shell
   One global surface: a collapsible sidebar (navigation, workflows, recent
   sessions, account and utilities — and, inside a session, that session's
   rail) beside a single content column. No top chrome. */
.shell{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
.shell.collapsed{grid-template-columns:minmax(0,1fr)}
.shell.collapsed #sidebar{display:none}
.shell.collapsed .chat-header{padding-left:3.2rem}
.side-item.on{background:var(--panel2);color:var(--ink)}
#sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:.85rem;
  padding:.85rem .7rem .7rem;background:transparent;
  overflow:hidden;min-width:0}
.side-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:0 .3rem}
.brand{font:650 13.5px/1 var(--sans);letter-spacing:.01em;display:inline-flex;align-items:center;gap:.5rem}
.brand::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.side-toggle{border:0;background:none;color:var(--faint);padding:.25rem .45rem;font-size:13px;line-height:1}
.side-toggle:hover{background:var(--panel2);color:var(--ink)}
#side-reveal{position:fixed;top:.7rem;left:.7rem;z-index:45;border:1px solid var(--line2);
  background:var(--panel);color:var(--dim);padding:.3rem .55rem;font-size:13px;line-height:1;
  border-radius:var(--radius-s)}
#side-reveal:hover{color:var(--ink)}
.side-cta button{width:100%}
.side-nav{display:grid;gap:1px}
.side-nav button,.side-item{text-align:left;border:0;background:transparent;padding:.4rem .55rem;
  border-radius:var(--radius-s);color:var(--dim);font-size:12.5px;width:100%;min-width:0}
.side-nav button:hover,.side-item:hover{background:var(--panel2);color:var(--ink)}
.side-nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-context{display:flex;flex-direction:column;gap:.9rem;flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;margin:0 -.2rem;padding:0 .2rem}
.side-backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);border:0;padding:0}
.side-label{font:600 10px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);padding:0 .55rem;display:flex;justify-content:space-between;align-items:center}
.side-list{display:grid;gap:1px}
.side-item{display:flex;align-items:center;gap:.5rem;cursor:pointer}
.side-item b{font-weight:550;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-item .side-meta{margin-left:auto;flex:none;font:10.5px var(--mono);color:var(--faint)}
.side-row{display:flex;align-items:center;min-width:0}
.side-row .side-item{flex:1}
.side-row details.menu>summary{border:0;padding:.3rem .4rem;color:var(--faint);opacity:0}
.side-row:hover details.menu>summary,.side-row details.menu[open]>summary{opacity:1}
.side-row details.menu>div{left:auto;right:.2rem}
.side-empty{padding:.1rem .55rem;font-size:12px;color:var(--faint)}
.sess-more{display:block;width:100%;background:none;border:0;color:var(--faint);
  padding:.35rem .55rem;cursor:pointer;font-size:11.5px;text-align:left;border-radius:var(--radius-s)}
.sess-more:hover{color:var(--ink);background:var(--panel2)}
.side-foot{padding-top:.65rem;margin-top:auto;display:grid;gap:1px}
/* soft separators: hairlines that fade out instead of ruling across */
.side-foot,.rail-team,.rail-controls{position:relative}
.side-foot::before,.rail-team::before,.rail-controls::before{content:"";position:absolute;top:0;
  left:.4rem;right:1.6rem;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.side-foot>button,.side-foot details.menu>summary,.btn-github{width:100%;display:flex;align-items:center;
  gap:.5rem;text-align:left;border:0;background:none;color:var(--dim);font-size:12px;font-weight:500;
  padding:.38rem .55rem;border-radius:var(--radius-s);cursor:pointer}
.side-foot>button:hover,.side-foot details.menu>summary:hover,.btn-github:hover{background:var(--panel2);color:var(--ink)}
.side-foot details.menu>div{bottom:calc(100% + .3rem);top:auto;left:.2rem;right:auto}
.btn-github svg{width:14px;height:14px;flex:none;fill:currentColor}
#ctx{display:block;padding:.35rem .55rem 0;font:10.5px var(--mono);color:var(--faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* shared dropdown menu (workflow ⋯, theme picker) */
details.menu{position:relative}
details.menu>summary{list-style:none;cursor:pointer;border:1px solid transparent;
  border-radius:var(--radius-s);padding:.34rem .6rem;line-height:1.35;color:var(--dim);font-size:12px;
  display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}
details.menu>summary:hover{background:var(--panel2);color:var(--ink)}
details.menu>summary::-webkit-details-marker{display:none}
details.menu>div{position:absolute;right:0;top:calc(100% + .35rem);z-index:40;min-width:11rem;
  padding:.3rem;background:var(--raise);border:1px solid var(--line2);border-radius:var(--radius);
  box-shadow:var(--shadow)}
details.menu>div>button{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;
  border:0;background:none;padding:.42rem .5rem;font-size:12.5px;border-radius:4px;box-shadow:none}
details.menu>div>button:hover{background:var(--panel2)}
.swatch{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid var(--line2)}
.theme-check{margin-left:auto;color:var(--accent);font-weight:700}
.share-panel{width:17.5rem;padding:.55rem .6rem}
.share-link{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-s);
  padding:.45rem .6rem;font:600 12.5px var(--mono);color:var(--accent);text-align:center;letter-spacing:.02em}

/* ------------------------------------------------------------------ pages
   The workspace floats as a distinct volume on the canvas: one bordered,
   softly-shadowed panel, centered. The session view stays full-bleed. */
.wrap{max-width:54rem;margin:1.7rem auto 3rem;padding:2.1rem 2.4rem 2.5rem;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.wrap.session-app{max-width:none;margin:0;padding:0;background:transparent;border:0;
  border-radius:0;box-shadow:none}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:1.4rem}
.page-head .row button{white-space:nowrap}
.page-head .sub{font-size:12.5px;color:var(--dim);margin-top:.4rem;max-width:44rem}
.section-head{display:flex;align-items:center;gap:.7rem;margin:2rem 0 .7rem}
.section-head::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.hero{max-width:34rem;margin:3.5rem auto 2.5rem}

/* home: an attention strip, then the start surface */
.attn{display:grid;gap:.35rem;margin-bottom:2rem}
.attn-row{display:flex;align-items:center;gap:.7rem;padding:.6rem .95rem;min-width:0;
  background:var(--panel2);border-radius:12px}
.attn-row b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attn-row .side-meta{font:11px var(--mono);color:var(--faint)}
.attn-row button{margin-left:auto;flex:none}
.wf-grid{display:grid;gap:.25rem;margin-top:.2rem}
.wf-row{display:flex;align-items:center;gap:1rem;padding:.7rem .95rem;min-width:0;
  border-radius:12px;transition:background-color .12s ease}
.wf-row:hover{background:var(--panel2)}
.wf-main{min-width:0;flex:1;cursor:pointer;border:0;background:none;text-align:left;padding:0;font:inherit;color:inherit}
.wf-main b{font-size:13px;font-weight:600}
.workflow-chain{font:11.5px var(--mono);color:var(--faint);margin-top:.25rem;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.wf-actions{flex:none;display:flex;gap:.35rem;align-items:center}
.workflow-menu>summary{border:1px solid transparent;padding:.28rem .45rem;line-height:1}
.workflow-menu button.danger{color:var(--bad)}
.workflow-editor .perm{padding:.55rem 0}
.profile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.5rem;margin-top:.7rem}

/* connections: quiet status lines, full guidance one click away */
.conn-list{display:grid;gap:.15rem}
.conn-row{display:flex;align-items:center;gap:.6rem;padding:.5rem .95rem;min-width:0;
  border-radius:10px;transition:background-color .12s ease}
.conn-row:hover{background:var(--panel2)}
.conn-row b{font-weight:600;flex:none}
.conn-row .conn-note{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:12px;color:var(--faint)}
.conn-row button{margin-left:auto;flex:none}

/* new session: progressive questions — answered steps collapse to summaries,
   the current one is expanded, upcoming ones are titles only */
.asks{max-width:46rem}
.ask{padding:.65rem .2rem}
.ask.on{background:var(--panel);border:1px solid var(--frame);border-radius:14px;
  padding:1.5rem;margin:.5rem 0;animation:ask-in .18s ease-out;
  box-shadow:0 14px 30px -20px rgba(0,0,0,.3)}
@keyframes ask-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ask-head{display:flex;align-items:baseline;gap:.7rem;min-width:0}
.ask-num{font:600 10.5px var(--mono);color:var(--faint);flex:none;width:1.3rem}
.ask-q{font-size:13.5px;font-weight:650;letter-spacing:-.005em}
.ask.todo .ask-q,.ask.todo .ask-num{color:var(--faint);font-weight:500}
/* completed steps read as single-line monospace breadcrumbs */
.ask-check{color:var(--ok);font-size:11px;flex:none}
.ask.done .ask-q{font:600 11.5px var(--mono);color:var(--dim);letter-spacing:.02em}
.ask.done .ask-answer,.ask.done .ask-answer b{font:500 11.5px var(--mono)}
.ask.on .choice{background:var(--panel2)}
.ask.on .choice:hover{background:var(--panel2);border-color:var(--line2)}
.ask.on .choice.on{background:var(--accent-soft)}
.ask-answer{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:12.5px;color:var(--dim);margin-left:auto;text-align:right}
.ask-answer .mono{font-size:11.5px}
.ask-change{flex:none;border:0;background:none;color:var(--accent);font-size:11.5px;padding:.1rem .2rem;cursor:pointer}
.ask-change:hover{text-decoration:underline;background:none}
.ask-body{margin:.9rem 0 0 2rem}
.ask.done{padding:.65rem .2rem}
.ask-foot{display:flex;justify-content:flex-end;margin-top:.8rem}
.repo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.5rem}
.sel-repo{display:flex;justify-content:space-between;align-items:center;gap:.8rem;
  border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--radius-s);
  padding:.55rem .75rem;margin-bottom:.55rem}
details.adv{margin-top:.55rem}
details.adv summary{cursor:pointer;color:var(--dim);font-size:12px}
details.adv summary:hover{color:var(--ink)}

.choice{border:1px solid var(--line);border-radius:var(--radius-s);padding:.6rem .75rem;cursor:pointer;
  background:var(--panel);text-align:left;width:100%;display:block;color:var(--ink);font:inherit;
  transition:transform .06s ease}
.choice:hover{border-color:var(--line2);background:var(--panel2)}
.choice:active{transform:translateY(1px)}
.choice.on{border-color:var(--accent-line);background:var(--accent-soft)}
.choice b{display:block;margin-bottom:.15rem;font-size:12.5px}
.choice > span{display:block;margin-top:.1rem}
.choice .mono.faint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.repo-row{display:flex;justify-content:space-between;gap:.8rem;align-items:baseline}
.repo-row b{margin-bottom:0}

/* the ready step: quiet summary rows and the one primary action */
.ready-rows{display:grid;gap:0;margin-bottom:1.1rem;max-width:30rem}
.ready-row{display:flex;justify-content:space-between;gap:.9rem;font-size:12.5px;padding:.3rem 0}
.ready-row span{color:var(--faint);flex:none}
.ready-row b{font-weight:550;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* permissions */
.perm{display:flex;justify-content:space-between;align-items:center;gap:1rem;
  padding:.5rem 0;border-bottom:1px solid var(--line)}
.perm:last-child{border-bottom:none}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--radius-s);overflow:hidden;
  flex:none;background:var(--panel)}
.seg button{border:0;border-radius:0;padding:.3rem .6rem;font:600 10.5px var(--sans);
  letter-spacing:.05em;text-transform:uppercase;background:none;color:var(--faint)}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.seg button.on[data-v="ask"],.seg button.on[data-value="ask"]{background:var(--warn-soft);color:var(--warn)}
.seg button.on[data-v="deny"],.seg button.on[data-value="deny"]{background:var(--line);color:var(--ink)}

/* wizard steps (retired flow — kept styled so nothing ever renders broken) */
.steps{display:flex;flex-wrap:wrap;gap:.25rem;margin-bottom:1.2rem}
.steps button{border:1px solid transparent;background:none;padding:.3rem .55rem;
  border-radius:var(--radius-s);color:var(--faint);font-size:12px}
.steps button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:650}
.steps button.done{color:var(--dim)}
.steps button:disabled{opacity:.4;cursor:not-allowed}
.quick textarea{min-height:9rem}

/* preflight: one flat surface — status, agent checklist, isolated action bar */
.preflight{max-width:46rem}
.statusline{display:flex;gap:.7rem;align-items:baseline;padding:.6rem .85rem;margin-top:1rem;
  background:var(--panel2);border-radius:12px}
.statusline b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.checklist{margin-top:.7rem}
.check-row{display:flex;gap:.9rem;padding:.7rem 0;align-items:flex-start}
.check-status{flex:none;width:8.5rem;padding-top:.1rem}
.check-main{min-width:0;flex:1}
/* luminescent status nodes: avatar + ambient connection beacon */
.agent-avatar{position:relative;flex:none;width:30px;height:30px;border-radius:50%;
  background:var(--panel2);border:1px solid var(--line2);display:inline-flex;align-items:center;
  justify-content:center;font:650 12px var(--sans);color:var(--dim);text-transform:uppercase}
.beacon{position:absolute;right:-2px;bottom:-2px;width:8px;height:8px;border-radius:50%;
  background:var(--line2);border:2px solid var(--panel)}
.beacon.ok{background:var(--ok)}
.beacon.bad{background:var(--bad)}
.beacon.warn{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft);
  animation:pulse 1.6s ease-in-out infinite}
.check-main pre{margin-top:.5rem;white-space:pre-wrap;word-break:break-word;background:var(--bg);max-height:16rem}
.check-main details.adv{margin-top:.35rem}
.actionbar{margin-top:.5rem;padding-top:.7rem}

/* toast */
.err{position:fixed;right:1.25rem;bottom:1.25rem;max-width:min(26rem,calc(100vw - 2rem));z-index:60;
  animation:toast-in .18s ease}
.err.card{background:var(--raise);border:1px solid var(--line2);border-left-width:3px;
  padding:.8rem .95rem;font-size:12.5px;box-shadow:var(--shadow)}
@keyframes toast-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.success{border-left-color:var(--ok) !important}

/* dialogs (GitHub sign-in, account) */
.dialog{position:fixed;z-index:70;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(30rem,calc(100vw - 2rem));max-height:min(34rem,calc(100vh - 3rem));overflow:auto;
  background:var(--raise);border:1px solid var(--line2);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:1.1rem 1.2rem}
.dialog .detail-close{position:absolute;top:.55rem;right:.55rem}
.detail-close{border:1px solid transparent;background:transparent;color:var(--dim);
  font-size:12px;padding:.25rem .5rem}
.detail-close:hover{color:var(--ink);background:var(--panel2);border-color:transparent}
.code-big{font:700 1.5rem var(--mono);text-align:center;letter-spacing:.14em;padding:.9rem;
  background:var(--bg);border:1px solid var(--line2);border-radius:var(--radius-s)}

/* ---------------------------------------------------------------- session
   Conversation in the center; a collapsible right telemetry rail carries the
   session's status, gates, tools, team, and controls. The left rail stays
   global navigation. */
.session-layout{display:grid;grid-template-columns:minmax(0,1fr) 16.25rem;height:100vh;background:var(--bg)}
.session-layout.rail-hidden{grid-template-columns:minmax(0,1fr)}
.session-layout.rail-hidden .session-rail-side{display:none}
.session-rail-side{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;
  overflow-x:hidden;padding:1rem .9rem;min-width:0}
.session-rail{display:flex;flex-direction:column;gap:.9rem;min-height:100%}
.rail-title{font-size:13.5px;font-weight:650;line-height:1.35}
.rail-status{font:11.5px var(--mono);color:var(--dim);display:flex;align-items:center;gap:.45rem;padding:0 .1rem}
.rail-clock{font-size:11.5px;color:var(--dim);margin-top:-.55rem;letter-spacing:.02em;padding:0 .1rem}
.rail-progress{display:grid;gap:.4rem;padding:.6rem .7rem;background:var(--panel2);border-radius:10px}
.rail-progress-line{display:flex;justify-content:space-between;gap:.5rem;
  font:600 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.rail-progress-line b{color:var(--ink);font-family:var(--mono)}
.rail-progress-track{height:3px;background:var(--line);border-radius:99px;overflow:hidden}
.rail-progress-track i{display:block;height:100%;background:var(--accent);border-radius:inherit;
  transition:width .25s ease}
.rail-nav{display:grid;gap:1px}
.rail-nav button{text-align:left;border:0;background:transparent;padding:.3rem .55rem;
  border-radius:var(--radius-s);color:var(--dim);font-size:12.5px}
.rail-nav button:hover{background:var(--panel2);color:var(--ink)}
.rail-nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail-team{padding-top:.75rem;margin-top:auto}
.team-line{display:flex;align-items:center;justify-content:space-between;gap:.45rem;
  font-size:12px;padding:.18rem .1rem}
.team-line [data-team-state]{font:11px var(--mono);color:var(--faint);transition:color .2s ease}
.presence{display:inline-flex;align-items:center;gap:.45rem;min-width:0;
  font:11.5px var(--mono);overflow:hidden;text-overflow:ellipsis}
.presence i{width:6px;height:6px;border-radius:50%;background:var(--line2);display:inline-block;flex:none}
.presence i.warn{background:var(--warn)}
.presence i.bad{background:var(--bad)}
.presence i.live{background:var(--accent);box-shadow:0 0 5px var(--accent)}
.agent-alerts{padding:.55rem clamp(1.25rem,3vw,2.5rem) 0;display:grid;gap:.45rem}
.agent-alert{display:flex;align-items:center;justify-content:space-between;gap:.8rem;max-width:56rem;
  border:1px solid var(--bad-line);border-left:2px solid var(--bad);background:var(--bad-soft);
  border-radius:var(--radius);padding:.55rem .8rem;font-size:12.5px}
.agent-alert.warn{border-color:var(--warn-line);border-left-color:var(--warn);background:var(--warn-soft)}
.agent-alert button{flex:none}
.rail-controls{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;padding-top:.75rem}
.rail-controls button{font-size:11.5px;padding:.42rem .5rem;text-align:center}
.rail-controls .control-complete{grid-column:1/-1;background:var(--ok-soft);
  border-color:var(--ok-line);color:var(--ok);font-weight:650}
.rail-controls .control-stop{color:var(--bad);border-color:var(--bad-line)}

.conversation-shell{position:relative;min-width:0;min-height:0;height:100%;display:grid;
  grid-template-rows:auto minmax(0,1fr);background:var(--bg)}
.chat-header{display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.7rem clamp(1.25rem,3vw,2.5rem);border-bottom:1px solid var(--line);background:var(--panel)}
.chat-title{font-size:13.5px;font-weight:650}
.chat-subtitle{font:11px var(--mono);color:var(--faint);margin-top:.18rem}
.chat-time{font:11px var(--mono);color:var(--faint);white-space:nowrap}

.conversation-feed{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto auto;
  grid-auto-rows:auto;overflow:hidden}
.message-list{min-height:0;overflow-y:auto;padding:.9rem clamp(1.25rem,3vw,2.5rem) .6rem;
  scroll-behavior:smooth}
.message-list .msg{padding:.6rem 0;max-width:56rem;border-bottom:0}
.msg-head{display:flex;align-items:baseline;gap:.55rem;max-width:56rem}
.msg .who{font:650 10.5px var(--mono);letter-spacing:.07em;color:var(--dim)}
.msg.you .who{color:var(--accent)}
.msg.system .who{color:var(--faint)}
.msg .to{font:600 10.5px var(--mono);letter-spacing:.05em;color:var(--faint)}
.msg .when{margin-left:auto;font-size:10.5px;color:var(--faint)}
.msg .body{margin-top:.3rem;line-height:1.6;font-size:14px;white-space:normal;overflow-wrap:anywhere}
.msg.system .body{color:var(--dim);font-size:12.5px}
.who.a0{color:var(--a0)}.who.a1{color:var(--a1)}.who.a2{color:var(--a2)}.who.a3{color:var(--a3)}.who.a4{color:var(--a4)}
.handoff{margin:.6rem 0 0;font:650 10px var(--mono);letter-spacing:.08em;color:var(--accent);
  display:flex;align-items:center;gap:.7rem;max-width:56rem}
.handoff::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--accent-line),transparent)}
.response-state{margin-top:.4rem;font:650 10px var(--mono);letter-spacing:.07em;color:var(--faint)}

/* Collapsible per-file diff cards (chat live feed and the Changes tab) */

/* diff coloring — presentation of the raw diff text only */
pre.diff{background:var(--bg)}

/* rich text (safe mini-markdown) */

<script>
const TOKEN = "__SYNCHRI_TOKEN__";
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* A deliberately small, safe Markdown renderer. Content is escaped first, so
   messages can be pleasant to scan without turning room text into executable
   HTML. It supports the code and structure agents actually use in reviews. */
/* Truncation-with-expand for oversized blocks. Only applied where overflow is
   certain, so the toggle never appears on content that already fits. */
function clampBlock(html, lines) {
  return `<div class="clamp" style="--clamp:${Number(lines) || 3}"><div class="clamp-body">${html}</div><button class="clamp-more" type="button">Show more</button></div>`;
}
document.addEventListener("click", event => {
  const button = event.target.closest(".clamp-more");
  if (!button) return;
  const clamp = button.closest(".clamp");
  clamp.classList.toggle("open");
  button.textContent = clamp.classList.contains("open") ? "Show less" : "Show more";
});

function rich(value) {
  const blocks = [];
  let text = esc(value);
  text = text.replace(/```([A-Za-z0-9_+-]*)?\n([\s\S]*?)```/g, (_, lang, code) => {
    const label = lang ? ` data-language="${esc(lang)}"` : "";
    const pre = `<pre class="rich-code"${label}><code>${code}</code></pre>`;
    blocks.push(code.split("\n").length > 30 ? clampBlock(pre, 30) : pre);
    return `@@SYNCHRI_BLOCK_${blocks.length - 1}@@`;
  });
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    (_, label, url) => `<a href="${url}" target="_blank" rel="noreferrer">${label}</a>`);
  text = text.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  return `<div class="rich">${text.split("\n").map(line => {
    const block = line.match(/^@@SYNCHRI_BLOCK_(\d+)@@$/);
    if (block) return blocks[Number(block[1])];
    if (/^###\s+/.test(line)) return `<h4>${line.replace(/^###\s+/, "")}</h4>`;
    if (/^##\s+/.test(line)) return `<h3>${line.replace(/^##\s+/, "")}</h3>`;
    if (/^#\s+/.test(line)) return `<h3 class="rich-title">${line.replace(/^#\s+/, "")}</h3>`;
    if (/^>\s?/.test(line)) return `<div class="rich-quote">${line.replace(/^>\s?/, "")}</div>`;
    if (/^\d+[.)]\s+/.test(line)) return `<div class="rich-list">${line.replace(/^(\d+[.)])\s+/, "$1 ")}</div>`;
    if (/^[-*]\s+/.test(line)) return `<div class="rich-list">${line.replace(/^[-*]\s+/, "• ")}</div>`;
    return line ? `<p>${line}</p>` : "";
  }).join("")}</div>`;
}

function richInline(value) {
  let text = esc(value);
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    (_, label, url) => `<a href="${url}" target="_blank" rel="noreferrer">${label}</a>`);
  text = text.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  return text.replace(/\n+/g, " ");
}

/* Presentation helpers: wall-clock stamps, stable per-agent hues, and diff
   line coloring. All three only re-shape data the API already returns. */
const fmtClock = (value) => {
  if (!value) return "";
  const time = new Date(value);
  return isNaN(time) ? "" : time.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
};

function hueFor(name) {
  let hash = 0;
  for (const ch of String(name || "")) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  return "a" + (hash % 5);
}

function renderDiff(diff) {
  return String(diff).split("\n").map(line => {
    const text = esc(line);
    if (line.startsWith("+++") || line.startsWith("---")) return `<span class="d-file">${text}</span>`;
    if (line.startsWith("@@")) return `<span class="d-hunk">${text}</span>`;
    if (line.startsWith("+")) return `<span class="d-add">${text}</span>`;
    if (line.startsWith("-")) return `<span class="d-del">${text}</span>`;
    if (line.startsWith("diff ") || line.startsWith("index ")) return `<span class="d-meta">${text}</span>`;
    return text;
  }).join("\n");
}

async function api(path, body) {
  const res = await fetch("/api/" + path, {
    method: body ? "POST" : "GET",
    headers: { "X-Synchri-Token": TOKEN, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.error) {
    const error = new Error(data.error?.message || res.statusText);
    error.code = data.error?.code;
    error.resolution = data.error?.resolution;
    throw error;
  }
  return data;
}

function flash(error) {
  const message = typeof error === "string" ? error : error?.message;
  const resolution = typeof error === "object" ? error?.resolution : null;
  const box = document.getElementById("err");
  box.className = "err card"; box.style.borderLeftColor = "var(--bad)";
  const action = resolution?.kind === "connect_github" || resolution?.kind === "retry_github_login"
    ? `<button id="error-connect-github" style="margin-top:.65rem">Connect GitHub</button>`
    : resolution?.kind === "github_app_settings"
      ? `<button id="error-open-github-settings" style="margin-top:.65rem">Open GitHub App settings</button>`
      : resolution?.kind === "choose_local_repository" && resolution?.path
        ? `<button id="error-choose-repo" style="margin-top:.65rem">${esc(resolution.label || "Use existing folder")}</button>`
        : resolution?.kind === "choose_repository"
          ? `<button id="error-choose-repo" style="margin-top:.65rem">Choose a repository</button>`
          : error?.code === "awaiting_join" || error?.code === "awaiting_ack"
            ? `<button id="error-open-setup" style="margin-top:.65rem">Open agent setup</button>`
            : error?.code === "gates_unsatisfied"
              ? `<button id="error-open-gates" style="margin-top:.65rem">Review acceptance gates</button>`
              : error?.code === "worktree_missing"
                ? `<button id="error-open-worktree" style="margin-top:.65rem">View workspace details</button>`
                : "";
  box.innerHTML = `<b>Here’s how to continue</b><div class="small" style="margin-top:.3rem">${esc(message)}</div>${action}`;
  box.querySelector("#error-connect-github")?.addEventListener("click", guard(connectGitHub));
  box.querySelector("#error-open-github-settings")?.addEventListener(
    "click", guard(() => openGitHub("https" + "://github.com/settings/apps"))
  );
  box.querySelector("#error-choose-repo")?.addEventListener("click", guard(async () => {
    if (!S.quick) await quickStart();
    if (resolution?.path) S.quick.repo_path = resolution.path;
    renderQuick();
  }));
  box.querySelector("#error-open-setup")?.addEventListener("click", guard(() => openLaunch(S.session)));
  box.querySelector("#error-open-gates")?.addEventListener("click", () => {
    S.tab = "gates"; renderSession();
  });
  box.querySelector("#error-open-worktree")?.addEventListener("click", () => {
    S.tab = "worktree"; renderSession();
  });
  clearTimeout(flash.t); flash.t = setTimeout(() => box.className = "err hide", 7000);
}
function confirmNotice(message, title = "Saved") {
  const box = document.getElementById("err");
  box.className = "err card success"; box.style.borderLeftColor = "var(--ok)";
  box.innerHTML = `<b>${esc(title)}</b><div class="small" style="margin-top:.3rem">${esc(message)}</div>`;
  clearTimeout(flash.t); flash.t = setTimeout(() => box.className = "err hide", 4200);
}
const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { flash(e); } };

/* ------------------------------------------------------------------ themes
   The choice is persisted by Synchri, independent of the ephemeral loopback
   origin, and swaps the token set via data-theme. "System" clears the choice
   and follows the OS. */
const THEMES = [
  {key: "", label: "System", swatch: ["#0b0c0e", "#f9f9fb"]},
  {key: "terminal", label: "Terminal", swatch: ["#0b0c0e", "#10b981"]},
  {key: "midnight", label: "Midnight", swatch: ["#0d1119", "#89a8dd"]},
  {key: "ember", label: "Ember", swatch: ["#141110", "#cd8478"]},
  {key: "copper", label: "Copper", swatch: ["#131110", "#c69566"]},
  {key: "orchid", label: "Orchid", swatch: ["#121016", "#a892d2"]},
  {key: "daylight", label: "Daylight", swatch: ["#f9f9fb", "#047857"]},
  {key: "sage", label: "Sage", swatch: ["#f4f2ee", "#54755f"]},
  {key: "solar", label: "Solar", swatch: ["#f4f1e8", "#776334"]},
  {key: "harbor", label: "Harbor", swatch: ["#eff2f5", "#44709a"]},
  {key: "iris", label: "Iris", swatch: ["#f2f1f7", "#6b64ae"]},
];

function currentTheme() {
  return document.documentElement.dataset.theme || "";
}

async function applyTheme(key) {
  const result = await api("appearance", {theme:key});
  if (S.boot) S.boot.appearance = result.appearance;
  if (key) document.documentElement.dataset.theme = key;
  else delete document.documentElement.dataset.theme;
  renderThemeMenu();
}

function renderThemeMenu() {
  const menu = document.getElementById("theme-menu");
  const options = document.getElementById("theme-options");
  if (!menu || !options) return;
  const active = currentTheme();
  options.innerHTML = "";
  for (const theme of THEMES) {
    const row = $(`<button type="button">
      <span class="swatch" style="background:linear-gradient(135deg, ${theme.swatch[0]} 50%, ${theme.swatch[1]} 50%)"></span>
      <span>${esc(theme.label)}</span>${theme.key === active ? `<span class="theme-check">✓</span>` : ""}</button>`);
    row.onclick = guard(async () => {
      await applyTheme(theme.key);
      menu.removeAttribute("open");
    });
    options.append(row);
  }
}

const S = { view:"home", boot:null, draft:null, step:"mode", session:null,
            tab:"conversation", dash:null, repos:null, es:null, quick:null, launch:null,
            agentDraft:null, githubReposRequest:null, githubReposLoading:false, clock:null,
            workflowName:"", workflowOriginal:"", workflowAgents:null,
            workflowPermissions:null, workflowDeadline:"", update:null, dismissedTimebox:null,
            worktreeChoices:null, worktreeLoading:null, sidebarCollapsed:false, railCollapsed:false,
            returnToQuick:false,
            openFileCards:new Set(), fileCardCache:new Map() };
const app = () => document.getElementById("app");

/* ----------------------------------------------------------------- sidebar
   One global, collapsible sidebar. While browsing it holds workflows, recent
   sessions, and utilities; inside a session it becomes that session's rail.
   Collapse removes it from layout and the accessibility tree (display:none),
   so nothing hidden stays focusable. */
const isNarrow = () => window.matchMedia("(max-width:760px)").matches;

function applySidebar() {
  const shell = document.getElementById("shell");
  const reveal = document.getElementById("side-reveal");
  const collapsed = !!S.sidebarCollapsed;
  shell.classList.toggle("collapsed", collapsed);
  reveal.classList.toggle("hide", !collapsed);
  reveal.setAttribute("aria-expanded", collapsed ? "false" : "true");
  document.getElementById("side-backdrop").classList.toggle("hide", collapsed || !isNarrow());
  document.body.style.overflow = !collapsed && isNarrow() ? "hidden" : "";
}

function toggleSidebar(collapsed) {
  S.sidebarCollapsed = collapsed;
  applySidebar();
  // Keep keyboard focus on a control that still exists.
  document.getElementById(collapsed ? "side-reveal" : "side-toggle").focus();
}

function renderSideContext() {
  const box = document.getElementById("side-context");
  if (!box) return;
  document.querySelectorAll(".side-nav button").forEach(button =>
    button.classList.toggle("on", S.view === "home" && button.id === "nav-home"));
  box.innerHTML = "";
  if (!S.boot) return;
  const workflows = S.boot.presets || [];
  if (workflows.length) {
    box.append($(`<div class="side-label">Workflows</div>`));
    const runs = $(`<div class="side-list"></div>`);
    for (const workflow of workflows.slice(0, 6)) {
      const chain = (workflow.agents || []).map(agent => agent.name).join(" → ");
      const row = $(`<button class="side-item" title="Run ${esc(workflow.name)}${chain ? ` · ${esc(chain)}` : ""}"><b>${esc(workflow.name)}</b><span class="side-meta">run</span></button>`);
      row.onclick = guard(() => quickStart(workflow.name));
      runs.append(row);
    }
    box.append(runs);
  }
  const list = S.boot.sessions || [];
  box.append($(`<div class="side-label">Recent sessions</div>`));
  if (!list.length) {
    box.append($(`<div class="side-empty">Sessions appear here.</div>`));
    return;
  }
  const rows = $(`<div class="side-list"></div>`);
  const visible = S.showAllSessions ? list : list.slice(0, 6);
  for (const s of visible) {
    const done = ["complete","timed_out","stopped","failed"].includes(s.status);
    const led = s.status === "active" ? "live" : (done ? "" : "warn");
    const open = s.session_id === S.session;
    const row = $(`<div class="side-row"><button class="side-item${open ? " on" : ""}" title="${esc(s.name)} · ${esc(s.repository.name)} · ${esc(s.status.replace("_", " "))}"><i class="led ${led}"></i><b>${esc(s.name)}</b><span class="side-meta">${esc(String(s.created_at || "").slice(5, 10))}</span></button>
      <details class="menu workflow-menu"><summary aria-label="Session options">⋯</summary><div>
        <button data-open>Open</button>
        <button data-new>New session in this repo</button>
        <button data-rename>Rename</button>
        ${done ? `<button class="danger" data-delete>Delete session</button>`
               : `<button disabled title="Stop the session first">Delete session</button>`}
      </div></details></div>`);
    row.querySelector(".side-item").onclick = guard(() => openSession(s.session_id));
    row.querySelector("[data-open]").onclick = guard(() => openSession(s.session_id));
    row.querySelector("[data-new]").onclick = guard(() => quickStartFromRepository(s.repository.root));
    row.querySelector("[data-rename]").onclick = guard(async () => {
      const name = prompt("Rename session", s.name)?.trim();
      if (!name || name === s.name) return;
      S.boot.sessions = (await api("session/rename", {session: s.session_id, name})).sessions;
      confirmNotice(`Renamed session to “${name}”.`);
      if (S.view === "home") await home(); else renderSideContext();
    });
    row.querySelector("[data-delete]")?.addEventListener("click", () => showDeleteSessionDialog(s));
    rows.append(row);
  }
  if (list.length > 6) {
    const toggle = $(`<button class="sess-more">${S.showAllSessions ? "Show fewer" : `Show all ${list.length} sessions`}</button>`);
    toggle.onclick = () => { S.showAllSessions = !S.showAllSessions; renderSideContext(); };
    rows.append(toggle);
  }
  box.append(rows);
}

/* ----------------------------------------------------------- GitHub sign-in */
async function connectGitHub() {
  const login = await api("github/connect", {});
  if (login.state === "connected") {
    S.repos = null; S.githubReposRequest = null;
    S.boot = await api("bootstrap"); renderGitHubAccount();
    const account = login.account?.login ? `@${login.account.login}` : "GitHub";
    confirmNotice(`${account} is already signed in.`);
    if (S.view === "quick") { await loadQuickRepositories(); renderQuick(); }
    if (S.view === "wizard" && S.step === "repository") renderWizard();
    return;
  }
  const githubDevicePage = "https" + "://github.com/login/device";
  const destination = login.verification_uri || githubDevicePage;
  await openGitHub(destination);
  await showGitHubCode(login);
}

function sleep(ms) { return new Promise(resolve => window.setTimeout(resolve, ms)); }

async function showGitHubCode(login) {
  const previous = document.getElementById("github-device-login");
  previous?.remove();
  const expiresIn = Math.max(0, Math.ceil((Number(login.expires_at) * 1000 - Date.now()) / 1000));
  const code = $(`<div class="dialog stack" id="github-device-login" role="dialog" aria-modal="true">
    <button class="detail-close" aria-label="Close">×</button>
    <div class="kicker">CONNECT GITHUB</div>
    <h2>Enter this code in GitHub</h2>
    <p class="muted small" style="margin:.2rem 0 0">GitHub opened in your browser. Sign in if needed, then enter this one-time code to link your Synchri profile and load the repositories visible to you.</p>
    <div class="code-big">${esc(login.user_code)}</div>
    <div class="small muted">Waiting for GitHub — this closes on its own after approval. Expires in about ${expiresIn} seconds.</div>
    <div class="row"><button class="primary" data-open>Open GitHub again</button><button data-close>Cancel</button></div>
  </div>`);
  document.body.append(code);
  let cancelled = false;
  const close = () => { cancelled = true; code.remove(); };
  code.querySelector(".detail-close").onclick = close;
  code.querySelector("[data-close]").onclick = close;
  code.querySelector("[data-open]").onclick = guard(
    () => openGitHub(login.verification_uri || githubDevicePage)
  );
  let interval = Math.max(2, Number(login.interval) || 5);
  while (!cancelled && Date.now() < Number(login.expires_at) * 1000) {
    await sleep(interval * 1000);
    if (cancelled) return;
    const result = await api("github/poll", {request_id: login.request_id});
    if (result.state === "pending") { interval = Math.max(interval, Number(result.interval) || interval); continue; }
    if (result.state === "connected") {
      code.remove(); S.repos = null; S.githubReposRequest = null;
      S.boot = await api("bootstrap"); renderGitHubAccount();
      const login = result.account?.login ? `Signed in as @${result.account.login}.` : "GitHub is signed in.";
      confirmNotice(`${login} Your repositories are loading now.`);
      if (S.view === "quick") { await loadQuickRepositories(); renderQuick(); }
      if (S.view === "wizard" && S.step === "repository") renderWizard();
      return;
    }
    if (result.state === "expired") break;
  }
  if (!cancelled) { code.remove(); flash("That GitHub code expired. Connect GitHub again to get a new one."); }
}

function renderGitHubAccount() {
  const button = document.getElementById("github-account");
  const label = button.querySelector(".gh-label") || button;
  const github = S.boot?.github || {};
  const account = github.account || {};
  if (github.authenticated) {
    label.textContent = account.login ? `@${account.login}` : "GitHub connected";
    button.title = "Signed in to Synchri with GitHub";
    button.onclick = () => showGitHubAccount();
    return;
  }
  label.textContent = "Sign in with GitHub";
  button.title = "Create or open your Synchri profile with GitHub";
  button.onclick = guard(connectGitHub);
}

function showGitHubAccount() {
  const github = S.boot?.github || {};
  const account = github.account || {};
  const previous = document.getElementById("github-account-details");
  previous?.remove();
  const details = $(`<div class="dialog stack" id="github-account-details" role="dialog" aria-modal="true">
    <button class="detail-close" aria-label="Close">×</button>
    <div class="kicker">GITHUB ACCOUNT</div>

    <p class="muted small" style="margin:.2rem 0 0">Signed in with GitHub. Synchri can list public repositories and any private repositories this GitHub connection is allowed to see.</p>
    <div class="row"><button data-close>Done</button><button class="ghost" data-disconnect>Disconnect GitHub</button></div>
  </div>`);
  document.body.append(details);
  const close = () => details.remove();
  details.querySelector(".detail-close").onclick = close;
  details.querySelector("[data-close]").onclick = close;
  details.querySelector("[data-disconnect]").onclick = guard(async () => {

/* --------------------------------------------------------- application update */
const nativeInvoke = (command, args) => window.__TAURI__?.core?.invoke(command, args);

async function openGitHub(destination) {
  if (window.__TAURI__?.core?.invoke) {
    await nativeInvoke("open_github_url", {url: destination});
    return;
  }
  const opened = window.open(destination, "_blank", "noopener,noreferrer");
  if (!opened) window.location.assign(destination);
}

function renderUpdate() {
  const button = document.getElementById("app-update");
  const update = S.update;
  button.className = "ghost";
  button.disabled = false;
  button.onclick = () => guard(() => checkForUpdate({manual:true}))();
  button.title = "Check for a signed Synchri update";
  if (!update || update.status === "idle") {
    button.textContent = "Check for updates";
    return;
  }
  if (update.status === "checking") {
    button.disabled = true;
    button.textContent = "Checking for updates…";
    return;
  }
  if (update.status === "available") {
    button.className = "ghost";
    button.textContent = `Update to v${update.update.version}`;
    button.title = "Download the signed Synchri update and reopen the app";
    button.onclick = guard(async () => {
      S.update = {status:"installing", update:update.update};
      renderUpdate();
      await nativeInvoke("install_update");
    });
  } else if (update.status === "installing") {
    button.className = "ghost";
    button.disabled = true;
    button.textContent = "Updating…";
  } else if (update.status === "current") {
    button.textContent = "All up to date!";
    button.title = `Synchri v${update.currentVersion} is the newest version. Click to check again.`;
  } else if (update.status === "move_to_applications") {
    button.textContent = update.update ? "Move to Applications to update" : "Install Synchri in Applications";
    button.title = update.message;
    button.onclick = () => flash(update.message);
  } else if (update.status === "error") {
    button.textContent = "Update check unavailable";
    button.title = update.message;
  }
}

async function checkForUpdate({manual=false, silent=false}={}) {
  if (!window.__TAURI__?.core?.invoke) return;
  if (!silent) { S.update = {status:"checking"}; renderUpdate(); }
  const revertSoon = () => {
    window.clearTimeout(S.updateRevert);
    S.updateRevert = window.setTimeout(() => { S.update = null; renderUpdate(); }, 4000);
  };
  try {
    const result = await nativeInvoke("check_for_update");
    if (silent) {
      // The button rests on "Check for updates": a background check may only
      // surface an actionable outcome, never a reassurance state.
      S.update = ["available", "move_to_applications"].includes(result.status) ? result : null;
      renderUpdate();
      return;
    }
    S.update = result;
    renderUpdate();
    if (result.status === "current") revertSoon();
  } catch (error) {
    if (silent) { S.update = null; renderUpdate(); return; }
    S.update = {status:"error", message:error.message || "Synchri could not check for updates."};
    renderUpdate();
    flash(S.update.message);
    revertSoon();
  }
}

function renderAgentConnections(page) {
  const connectable = (S.boot.runtimes || []).filter(runtime => runtime.managed_command);
  if (!connectable.length) return;
  page.append($(`<div class="section-head" style="margin-top:2.4rem"><span class="kicker">Agent connections</span></div>`));
  const box = $(`<div class="conn-list"></div>`);
  for (const runtime of connectable) {
    const stored = (S.boot.runtime_connections || {})[runtime.key];
    const test = (S.boot.runtime_connection_tests || {})[runtime.key];
    const canTest = runtime.connection_test_available;
    const testing = test?.state === "testing" || test?.alive;
    const failed = stored?.state === "failed" || test?.state === "failed";
    const dot = stored?.state === "connected" ? "ok" : testing ? "warn" : failed ? "bad" : "";
    const toolPermissions = runtime.tool_permissions || {};
    const toolSummary = toolPermissions.state === "pass" ? "saved tool permissions found"
      : toolPermissions.state === "fail" ? "tool permissions still need setup"
      : "CLI tool permissions still apply";
    const summary = stored?.state === "connected"
      ? `Connection verified${stored.version ? ` · v${stored.version}` : ""} · ${toolSummary}`
      : testing ? (test.detail || "Protected connection test in progress — no action needed.")
      : failed ? (stored?.detail || test?.detail || "The last connection test failed.")
      : !runtime.installed ? runtime.detail
      : !canTest ? "Installed, but this Synchri version cannot safely verify it."
      : "One step remains: run the protected connection test.";
    const action = stored?.state === "connected" ? "Review setup"
      : testing ? "View progress"
      : failed ? "Fix connection"
      : !canTest ? "Why unavailable?" : "Finish setup";
    const row = $(`<div class="conn-row"><i class="led ${dot}"></i><b>${esc(runtime.label)}</b>
      <span class="conn-note">${esc(summary || "")}</span>
      <button class="ghost" data-connect>${action}</button></div>`);
    row.querySelector("[data-connect]").onclick = () => showConnectDialog(runtime.key);
    box.append(row);
  }
  page.append(box);
  page.append($(`<div class="small faint" style="margin-top:.6rem">Sign-in stays inside each CLI —
    Synchri owns no provider account, stores no credential or API key, and uses no cloud relay.</div>`));
}

function connectionDisplayState(connection, test) {
  if (test?.state === "testing" || test?.alive) return "testing";
  if (test?.state === "failed" || test?.phase === "failed") return "failed";
  if (connection?.state === "connected") return "connected";
  if (["failed", "reconnect_needed"].includes(connection?.state)) return "failed";
  return "not_connected";
}

async function showConnectDialog(runtimeKey) {
  document.getElementById("connect-dialog")?.remove();
  const dialog = $(`<div class="dialog stack" id="connect-dialog" role="dialog" aria-modal="true">
    <button class="detail-close" aria-label="Close">×</button>
    <div class="kicker">AGENT CONNECTION</div>
    <h2 id="connect-title">Checking…</h2>
    <p class="muted small" id="connect-explanation" style="margin:.2rem 0 0">Checking installation and connection state…</p>
    <div id="connect-state" aria-live="polite"></div>
    <div class="note small" id="connect-next"></div>
    <div class="kicker" style="margin-top:.35rem">SETUP CHECKLIST</div>
    <div id="connect-checks" class="stack" style="gap:.3rem"></div>
    <div id="connect-test-results" class="stack hide" style="gap:.3rem">
      <div class="kicker" style="margin-top:.35rem">CONNECTION TEST RESULTS</div>
      <div id="connect-test-checks" class="stack" style="gap:.3rem"></div>
    </div>
    <div class="row" id="connect-actions"><button class="primary" data-connect>Run connection test</button><button data-close>Close</button></div>
    <div class="small muted" id="connect-status" aria-live="polite"></div>
  </div>`);
  document.body.append(dialog);
  const close = () => { dialog.remove(); if (S.view === "home") home().catch(() => {}); };
  dialog.querySelector(".detail-close").onclick = close;
  dialog.querySelector("[data-close]").onclick = close;

  const stateChip = state => state === "pass" ? `<span class="pill ok">pass</span>`
    : state === "fail" ? `<span class="pill bad">fail</span>` : `<span class="pill dim">unknown</span>`;
  const renderChecks = (selector, checks) => {
    const box = dialog.querySelector(selector);
    box.innerHTML = "";
    for (const check of checks || []) {
      box.append($(`<div class="row" style="gap:.5rem;align-items:baseline">${stateChip(check.state)}
        <b class="mono small">${esc(check.key.replaceAll("_", " "))}</b><span class="small muted">${esc(check.detail || "")}</span></div>`));
    }
  };

  const renderTestChecks = checks => {
    const section = dialog.querySelector("#connect-test-results");
    if (!checks?.length) { section.classList.add("hide"); return; }
    section.classList.remove("hide");
    renderChecks("#connect-test-checks", checks);
  };

  const payload = await api("runtimes/doctor");
  const entry = (payload.runtimes || []).find(runtime => runtime.key === runtimeKey);
  const button = dialog.querySelector("[data-connect]");
  let currentConnection = entry?.connection || {state:"not_connected", checks:[]};
  let currentTest = entry?.test || {state:"not_connected", phase:"idle"};

  const renderState = () => {
    if (!entry) return;
    const state = connectionDisplayState(currentConnection, currentTest);
    const stateView = {
      connected:["ok", "Connection verified"],
      testing:["warn", "Testing connection"],
      failed:["bad", "Connection failed"],
      not_connected:["dim", "Not connected yet"],
    }[state];
    dialog.querySelector("#connect-title").textContent = state === "connected"
      ? `${entry.label} connection is verified` : entry.label;
    dialog.querySelector("#connect-state").innerHTML =
      `<span class="pill ${stateView[0]}">${stateView[1]}</span>`;
    renderChecks("#connect-checks", entry.doctor);
    renderTestChecks(currentTest?.result?.checks || currentConnection?.checks);

    if (state === "connected") {
      dialog.querySelector("#connect-explanation").textContent =
        "Synchri verified installation, sign-in, prompt delivery, and structured output. The protected canary intentionally used no tools.";
      const permissions = entry.tool_permissions || {};
      dialog.querySelector("#connect-next").textContent =
        permissions.instructions || "Connection is ready. Your CLI's own tool permissions still control what the agent may read, edit, or run during orchestration.";
      button.disabled = true;
      button.textContent = "Connection verified";
    } else if (state === "testing") {
      dialog.querySelector("#connect-explanation").textContent =
        "Synchri is running the protected canary now. The state will finish as Connected or Failed.";
      dialog.querySelector("#connect-next").textContent =
        "Wait here — no other action is needed while the test runs.";
      button.disabled = true;
      button.textContent = "Testing…";
    } else if (!entry.installed) {
      dialog.querySelector("#connect-explanation").textContent =
        "Synchri cannot find this CLI on the app's PATH.";
      dialog.querySelector("#connect-next").textContent =
        `Next: install ${entry.label}, fully quit and reopen Synchri, then return here.`;
      button.disabled = true;
      button.textContent = "CLI not detected";
    } else if (!entry.connection_test_available) {
      dialog.querySelector("#connect-explanation").textContent =
        "The green setup checks do not mean connected. This Synchri version has no enforced canary for this CLI.";
      dialog.querySelector("#connect-next").textContent =
        "Nothing you can do locally will verify this connection in this version. Do not retry; Synchri must add a protected adapter first.";
      button.disabled = true;
      button.textContent = "Test unavailable";
    } else if (currentConnection?.state === "reconnect_needed") {
      dialog.querySelector("#connect-explanation").textContent =
        "A previously verified part of this connection changed, so Synchri removed the connected state.";
      dialog.querySelector("#connect-next").textContent =
        `Next: ${currentConnection.detail || "run the protected test again to re-verify this CLI."}`;
      button.disabled = false;
      button.textContent = "Re-verify connection";
    } else if (state === "failed") {
      dialog.querySelector("#connect-explanation").textContent =
        "The protected test completed, but at least one required proof failed.";
      dialog.querySelector("#connect-next").textContent =
        "Still not connected. Fix the red test result below, then choose Try connection test again.";
      button.disabled = false;
      button.textContent = "Try connection test again";
    } else {
      dialog.querySelector("#connect-explanation").textContent =
        "The checklist confirms local readiness; it does not create a connected state by itself.";
      dialog.querySelector("#connect-next").textContent =
        "Next: run the protected connection test once. That final step changes this state to Connected or explains exactly what failed.";
      button.disabled = false;
      button.textContent = "Run protected test";
    }
    dialog.querySelector("#connect-status").textContent =
      currentTest?.detail || currentConnection?.detail || "";
  };
  renderState();

  button.onclick = guard(async () => {
    currentTest = {state:"testing", phase:"starting", detail:"Starting the protected test."};
    renderState();
    const started = await api("runtimes/connect", {runtime: runtimeKey});
    currentTest = started.test || currentTest;
    renderState();
    if (S.view === "home") await home();
    const poll = async () => {
      const visible = document.getElementById("connect-dialog") === dialog;
      const status = await api("runtimes/connect?runtime=" + encodeURIComponent(runtimeKey));
      currentTest = status.test || currentTest;
      currentConnection = status.connection || currentConnection;
      if (visible) renderState();
      if (currentTest.alive || !["done", "failed", "cancelled", "idle"].includes(currentTest.phase)) {
        window.setTimeout(guard(poll), 700);
        return;
      }
      if (S.view === "home") await home();
      else S.boot = await api("bootstrap");
    };
    await poll();
  });
}

async function quickStartFromRepository(repoPath) {

/* ------------------------------------------------------------- quick start
   The new-session flow asks one question at a time: repository → workspace →
   brief (or "Help me make a plan") → team → start. Answered steps collapse to
   summaries; the expanded step is always the next thing needed. The
   recommended team means no saved workflow is required to begin. */
const RECOMMENDED_BUILD_TEAM = [
  {runtime: "claude_code", role: "primary_builder"},
  {runtime: "codex", role: "adversarial_reviewer"},
];
const RECOMMENDED_PLAN_TEAM = [
  {runtime: "claude_code", role: "planner"},
  {runtime: "codex", role: "plan_reviewer"},
];

async function quickStart(selectedWorkflow) {
  stopClock();
  app().classList.remove("session-app");
  if (!S.boot) S.boot = await api("bootstrap");
  const workflows = S.boot.presets || [];
  const workflow = workflows.find(item => item.name === selectedWorkflow) || workflows[0];
  S.view = "quick"; S.session = null; S.launch = null;
  if (S.quick && (S.quick.goal.trim() || S.quick.repo_path)) {
    // An unfinished flow survives sidebar navigation. Running a specific
    // workflow only swaps the team default and re-asks that one question.
    if (selectedWorkflow && workflow && S.quick.preset !== workflow.name) {
      S.quick.preset = workflow.name;
      S.quick.teamDone = false;
    }
  } else {
    S.quick = {
      repo_path: S.boot.default_repo || "",
      goal: "",
      deadline: "",
      preset: workflow ? workflow.name : "",
      existing_worktree_path: null,
      workspace_choice: null,
      intent: "build",
      briefDone: false,
      teamDone: false,
      deadlineCustom: false,
      editStep: null,
    };
    S.worktreeChoices = null;
  }
  renderSideContext();
  await loadQuickRepositories();
  if (S.quick.repo_path) await loadWorktreeChoices(S.quick.repo_path);
  renderQuick();
}

async function loadQuickRepositories() {
  if (!S.repos) S.repos = await api("repositories?github=0");
  if (!S.githubReposRequest) {
    S.githubReposLoading = true;
    S.githubReposRequest = api("repositories").then(repos => {
      S.repos = repos; S.githubReposLoading = false;
      if (S.view === "quick") renderQuick();
      return repos;
    }).catch(() => {
      S.githubReposLoading = false;
      if (S.view === "quick") renderQuick();
      return S.repos;
    });
  }
}

async function selectQuickRepository(reference) {
  const result = await api("repository/resolve", {reference});
  // Changing the repository invalidates everything repository-scoped: the
  // workspace pick and the worktree list belong to the previous repo.
  S.quick.repo_path = result.repository.path;
  S.quick.existing_worktree_path = null;
  S.quick.workspace_choice = null;
  S.quick.editStep = null;
  await loadWorktreeChoices(S.quick.repo_path);
  confirmNotice(result.repository.reused
    ? `Using the existing checkout. Choose where this session should work next.`
    : `Repository ready. Choose where this session should work next.`);
  renderQuick();
}

async function loadWorktreeChoices(repoPath) {
  if (!repoPath) return [];
  if (S.worktreeChoices?.repository === repoPath) return S.worktreeChoices.worktrees;
  if (S.worktreeLoading === repoPath) return [];
  S.worktreeLoading = repoPath;
  try {
    S.worktreeChoices = await api(`worktrees?repo=${encodeURIComponent(repoPath)}`);
    return S.worktreeChoices.worktrees;
  } finally {
    S.worktreeLoading = null;
    if (S.view === "quick" && S.quick?.repo_path === repoPath) renderQuick();
    if (S.view === "wizard" && S.draft?.draft.repo_path === repoPath && S.step === "worktree") renderWizard();
  }
}

/* ----------------------------------------------------------- workflows */
async function configureWorkflow(name) {
  stopClock();
  app().classList.remove("session-app");
  if (!S.boot) S.boot = await api("bootstrap");
  S.view = "workflow"; S.session = null;
  renderSideContext();
  S.workflowOriginal = name || "";
  S.workflowName = name || "";
  S.draft = name
    ? await api("draft", {draft:"workflow", preset:name})
    : await api("draft/reset", {draft:"workflow"});
  const savedAgents = S.draft.draft.agents || [];
  S.workflowAgents = savedAgents.length ? savedAgents.map(agent => ({...agent})) : [
    {name:"", runtime:"codex", role:"primary_builder"},
    {name:"", runtime:"copilot", role:"adversarial_reviewer"},
  ];
  S.workflowPermissions = {...S.draft.draft.permissions};
  S.workflowProfile = inferPermissionProfile(S.workflowPermissions);
  S.workflowDeadline = S.draft.draft.deadline_duration || "";
  renderWorkflow();
}

function inferPermissionProfile(permissions) {
  // Which profile produced this permission map, if any — so re-opening a
  // workflow highlights the card that is actually in effect.
  for (const profile of S.boot?.permission_profiles || []) {
    const keys = new Set([
      ...Object.keys(profile.permissions || {}),
      ...Object.keys(permissions || {}),
    ]);
    let matches = true;
    for (const key of keys) {
      if ((profile.permissions || {})[key] !== (permissions || {})[key]) { matches = false; break; }
    }
    if (matches) return profile.key;
  }
  return null;
}

      row.querySelectorAll("button").forEach(button => button.onclick = () => {
        S.workflowPermissions[capability.key] = button.dataset.value;
        row.querySelectorAll("button").forEach(item => item.classList.toggle("on", item === button));
        // A fine-tuned map is no longer any named profile.
        S.workflowProfile = null;
        profiles.querySelectorAll(".choice").forEach(item => {

    const deadline = box.querySelector("#workflow-deadline").value.trim();
    if (!name) throw new Error("Give this workflow a name so you can use it again.");
    if (selectedAgents.length < 2) throw new Error("A long-horizon workflow needs at least a builder and a reviewer.");

function quickReadiness(runtimeKey) {
  const runtime = (S.boot.runtimes || []).find(item => item.key === runtimeKey);
  const connection = (S.boot.runtime_connections || {})[runtimeKey];
  if (!runtime) return {runtime: null, dot: "", note: ""};
  if (connection?.state === "connected") return {runtime, dot: "ok", note: "connected"};
  if (!runtime.installed) return {runtime, dot: "bad", note: "not installed — preflight offers a manual paste step"};
  return {runtime, dot: "warn", note: "not verified — connect it, or use the paste step at preflight"};
}

/* The team answer: the chosen workflow when one exists, otherwise the
   recommended pair — so a session can start before any workflow is saved. */
function quickTeam(q) {
  const workflows = S.boot.presets || [];
  const workflow = q.intent === "plan" ? null
    : workflows.find(item => item.name === q.preset) || workflows[0] || null;
  const fromPlan = plan => {
    const ready = quickReadiness(plan.runtime);
    return {...plan, label: ready.runtime?.label || plan.runtime,
            name: ready.runtime?.default_name || plan.runtime, ready};
  };
  if (q.intent === "plan") return {workflow: null, agents: RECOMMENDED_PLAN_TEAM.map(fromPlan)};
  if (workflow) {
    return {workflow, agents: (workflow.agents || []).map(agent =>
      ({...agent, label: agent.name, ready: quickReadiness(agent.runtime)}))};
  }
  return {workflow: null, agents: RECOMMENDED_BUILD_TEAM.map(fromPlan)};
}

const roleLabel = key =>
  (S.boot.roles || []).find(role => role.key === key)?.label || String(key).replaceAll("_", " ");
