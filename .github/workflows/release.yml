name: Release Synchri

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release
        required: true
        type: string
      publish_pypi:
        description: Publish the wheel to PyPI (requires the configured trusted publisher)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  python-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  mac-app:
    # Build on Apple Silicon, not an Intel image cross-compiling for it. The
    # bundled Python engine and the Tauri shell must receive the same native
    # Developer ID signature for hardened runtime to allow them to load each
    # other on a customer's Mac.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Install Synchri itself as well as PyInstaller so the signed embedded
      # engine includes every declared runtime dependency (notably certifi for
      # verified GitHub OAuth TLS).
      - run: python -m pip install --upgrade pyinstaller .
      - run: test "$(uname -m)" = arm64
      - run: npm ci
        working-directory: desktop
      - name: Configure Apple signing certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$CERTIFICATE"
          KEYCHAIN="$RUNNER_TEMP/synchri-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE_PATH="$RUNNER_TEMP/synchri-release.p12"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
      - name: Build and sign the native DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # SYNCHRI_-prefixed on purpose: exporting APPLE_ID/APPLE_PASSWORD here
          # would make the Tauri bundler start its own notarization pass on the
          # intermediate app. The build script staples the final app itself so
          # both the DMG and the updater tarball carry a Gatekeeper ticket.
          SYNCHRI_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          SYNCHRI_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SYNCHRI_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SYNCHRI_ARCH: arm64
          SYNCHRI_TARGET_TRIPLE: aarch64-apple-darwin
          SYNCHRI_TAURI_TARGET_DIR: ${{ runner.temp }}/synchri-tauri-target
        run: scripts/build_tauri_macos.sh
      - name: Notarize and staple the final native DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="release/tauri/Synchri-macos-arm64.dmg"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          # Stapling writes the ticket into the DMG and therefore changes its
          # bytes. Replace the build-time checksum with one for the artifact
          # users will actually download.
          DMG_DIR=$(dirname "$DMG")
          DMG_NAME=$(basename "$DMG")
          (cd "$DMG_DIR" && shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256")
      - name: Verify the signed native bundle
        run: |
          APP="$RUNNER_TEMP/synchri-tauri-target/release/final/Synchri.app"
          DMG="release/tauri/Synchri-macos-arm64.dmg"
          UPDATE="release/tauri/Synchri-macos-arm64.app.tar.gz"
          test -x "$APP/Contents/MacOS/synchri-desktop"
          test -x "$APP/Contents/Resources/engine/synchri-core"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$DMG"
          (cd "$(dirname "$DMG")" && shasum -a 256 -c "$(basename "$DMG").sha256")
          hdiutil imageinfo "$DMG" | grep -Eq 'Class Name: (CUDIFDiskImage|CRawDiskImage)'
          test "$(od -An -tx1 -N2 "$UPDATE" | tr -d '[:space:]')" = "1f8b"
          tar -tzf "$UPDATE" | grep -qx 'Synchri.app/'
          if gzip -cd "$UPDATE" | LC_ALL=C grep -aqE 'LIBARCHIVE\.xattr|SCHILY\.xattr|PaxHeader/'; then
            echo "Updater archive must not contain macOS metadata records"
            exit 1
          fi
          # BSD tar hides AppleDouble sidecars when listing an archive, but
          # Tauri's Rust extractor writes them into the app. Reproduce that
          # exact extraction path and verify the resulting bundle seal.
          VERIFY_DIR="$RUNNER_TEMP/synchri-updater-verify/Synchri.app"
          mkdir -p "$VERIFY_DIR"
          CARGO_TARGET_DIR="$RUNNER_TEMP/synchri-tauri-target" \
            cargo run --quiet --release --target aarch64-apple-darwin \
              --manifest-path desktop/src-tauri/Cargo.toml \
              --example verify_update_archive -- "$UPDATE" "$VERIFY_DIR"
          if find "$VERIFY_DIR" -name '._*' -print -quit | grep -q .; then
            echo "Updater archive produces AppleDouble sidecars under Tauri extraction"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$VERIFY_DIR"
          # What users receive through the updater must carry its own ticket
          # and pass Gatekeeper's actual assessment, not only codesign's.
          xcrun stapler validate "$APP"
          xcrun stapler validate "$VERIFY_DIR"
          spctl --assess --type exec --verbose=2 "$APP"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
      - name: Build the signed update manifest
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          python scripts/make_tauri_update_manifest.py "$VERSION" "$TAG" release/tauri/latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            release/tauri/Synchri-macos-arm64.dmg
            release/tauri/Synchri-macos-arm64.dmg.sha256
            release/tauri/Synchri-macos-arm64.app.tar.gz
            release/tauri/Synchri-macos-arm64.app.tar.gz.sig
            release/tauri/latest.json

  github-release:
    needs: [python-package, mac-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish or replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          manifest="release-assets/latest.json"
          test -f "$manifest"
          payload=$(find release-assets -type f ! -name latest.json)
          # The manifest must land last. Assets replace one at a time, so a
          # client checking for updates mid-publish must never read a manifest
          # that references bytes which are missing or just been replaced —
          # that window is a signature mismatch reported as a corrupt update.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $payload --clobber
            gh release upload "$TAG" "$manifest" --clobber
          else
            gh release create "$TAG" $payload --generate-notes --verify-tag
            gh release upload "$TAG" "$manifest"
          fi

  publish-pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi
    needs: python-package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/synchri/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
