[package]
name = "synchri-desktop"
version = "0.4.2"
description = "A calm, native desktop home for local coding-agent collaboration."
authors = ["Synchri contributors"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
flate2 = "1"
tar = "0.4.46"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
url = "2"
